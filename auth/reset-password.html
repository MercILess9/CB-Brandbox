<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Reset Password</title>
    <meta name="description" content="Set a new password.">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25"></script>
    <script src="/system/config.js"></script>
    <script src="/system/system.js"></script>
    <script src="/auth/auth.js?v=4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/system/theme.css?v=2">
    <link rel="stylesheet" href="/auth/auth.css?v=3">
</head>
<body>

<div class="card">
    <div class="logo-wrap">
        <img id="brandbox-logo" class="is-pending" alt="Logo" height="80">
    </div>

    <form novalidate id="resetForm">
        <div class="group">
            <label for="pass_val">New Password</label>
            <div class="input-wrapper">
                <input id="pass_val" type="password" class="pass-input" autocomplete="new-password" placeholder="Min 6 characters" required minlength="6">
                <button type="button" class="password-toggle-btn" onclick="togglePass('pass_val', this)" aria-label="Show password">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
        </div>

        <div class="group">
            <label for="conf_val">Confirm New Password</label>
            <div class="input-wrapper">
                <input id="conf_val" type="password" class="pass-input" autocomplete="new-password" placeholder="Repeat password" required>
                <button type="button" class="password-toggle-btn" onclick="togglePass('conf_val', this)" aria-label="Show password">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
        </div>

        <button class="btn-main" type="submit">Set New Password</button>
    </form>

    <div class="footer-links">
        <a href="/auth/login.html">Back to Login</a>
    </div>
</div>

<script>
    // Branding (logo, theme colours) — see initAuthPage() in auth.js.
    initAuthPage();

    async function initPage() {
        const params = new URLSearchParams(window.location.search);
        const token_hash = params.get('token_hash');
        const token = params.get('token');
        const type = params.get('type');

        let verified = false;

        if (token_hash && type === 'recovery') {
            const { error } = await supabaseClient.auth.verifyOtp({ token_hash, type });
            if (!error) verified = true;
        } else if (token && type === 'recovery') {
            // format เก่า — ใช้ exchangeCodeForSession
            const { error } = await supabaseClient.auth.verifyOtp({ token_hash: token, type });
            if (!error) verified = true;
        } else {
            // ลองเช็ค session ที่ Supabase อาจ set ไว้ให้แล้วหลัง redirect
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) verified = true;
        }

        if (!verified) {
            // No confirmButtonColor — the shared .swal2-styled.swal2-confirm
            // rule in system.js already themes this correctly, a hardcoded
            // value here would override it with a stale color.
            return Swal.fire({
                icon: 'error', title: 'Link Expired',
                text: 'This reset link is invalid or has expired. Please request a new one.'
            }).then(() => { window.location.href = '/auth/forgot-password.html'; });
        }

        document.getElementById("resetForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const form = e.currentTarget;
            if (!validateAuthForm(form)) return;
            const password = document.getElementById("pass_val").value;
            const confirm = document.getElementById("conf_val").value;
            if (password !== confirm) return setFieldError('conf_val', 'Passwords do not match.');
            await handleUpdatePassword(password, form);
        });
    }

    initPage();
</script>

</body>
</html>
