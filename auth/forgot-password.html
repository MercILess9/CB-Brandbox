<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Forgot Password</title>
    <meta name="description" content="Reset your password.">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/system/config.js"></script>
    <script src="/system/system.js"></script>
    <script src="/auth/auth.js?v=4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/system/theme.css">
    <link rel="stylesheet" href="/auth/auth.css?v=3">
</head>
<body>

<div class="card">
    <div class="logo-wrap"><img id="brandbox-logo" class="is-pending" alt="Logo" height="80"></div>

    <form novalidate id="forgotForm">
        <div class="group">
            <label for="email">Email Address</label>
            <input id="email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="name@company.com" required>
        </div>

        <button class="btn-main" type="submit">Send Reset Link</button>
    </form>
    
    <div class="footer-links">
        <a href="/auth/login.html">Back to Login</a>
    </div>
</div>

<script>
    // Branding (logo, theme colours) — see initAuthPage() in auth.js.
    initAuthPage({ emailInputId: 'email' });

    document.getElementById("forgotForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const form = e.currentTarget;
        if (!validateAuthForm(form)) return;
        await handleForgotPassword(document.getElementById("email").value.trim(), form);
    });
    
</script>

</body>
</html>
