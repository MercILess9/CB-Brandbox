<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Sign Up</title>
    <meta name="description" content="Create an account.">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25"></script>
    <script src="/system/config.js"></script>
    <script src="/system/system.js"></script>
    <script src="/system/select-picker.js"></script>
    <script src="/auth/auth.js?v=4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/system/theme.css?v=2">
    <link rel="stylesheet" href="/auth/auth.css?v=3">
</head>
<body>

<div class="card">
    <div class="logo-wrap">
        <img id="brandbox-logo" class="is-pending" alt="Logo" height="80">
    </div>

    <div id="signup-closed-msg" class="signup-closed-msg" style="display:none;">
        <h2>Signups are closed</h2>
        <p>New registrations aren't open right now. Please contact your administrator for access.</p>
        <a href="login.html" class="signup-closed-back">Back to Sign In</a>
    </div>

    <form novalidate id="regForm">
        <div class="row">
            <div class="group">
                <label for="nick">Nick Name</label>
                <input id="nick" autocomplete="nickname" placeholder="Nick name" required>
            </div>
            <div class="group">
                <label for="emp_id">Employee ID</label>
                <input id="emp_id" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ID001" required>
            </div>
        </div>

        <div class="group">
            <label for="full">Full Name</label>
            <input id="full" autocomplete="name" placeholder="Full name" required>
        </div>

        <div class="group">
            <label for="email_val">Email Address</label>
            <input id="email_val" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="name@company.com" required>
        </div>

        <div class="group">
            <label for="dept_val">Department</label>
            <div class="dept-picker-wrap">
                <select id="dept_val" required>
                    <option value="">Select Department</option>
                </select>
                <button type="button" class="dept-picker-trigger placeholder" id="dept_val-trigger" onclick="openDeptPicker(this)">Select Department</button>
            </div>
        </div>

        <div class="group">
            <label for="pass_val">Password</label>
            <div class="input-wrapper">
                <input id="pass_val" type="password" class="pass-input" autocomplete="new-password" placeholder="Min 6 characters" required minlength="6">
                <button type="button" class="password-toggle-btn" onclick="togglePass('pass_val', this)" aria-label="Show password">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
        </div>

        <div class="group">
            <label for="conf_val">Confirm Password</label>
            <div class="input-wrapper">
                <input id="conf_val" type="password" class="pass-input" autocomplete="new-password" placeholder="Repeat password" required>
                <button type="button" class="password-toggle-btn" onclick="togglePass('conf_val', this)" aria-label="Show password">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
        </div>

        <button class="btn-main" type="submit">Sign Up</button>
    </form>

    <div class="link">Already have an account? <a href="/auth/login.html">Sign in</a></div>
</div>


<script>
    // Branding (logo, theme colours) + the email example from Settings →
    // Signup's domain lock — see initAuthPage() in auth.js.
    initAuthPage({ emailInputId: 'email_val' });

    // Block the form up front when signups are closed, instead of letting
    // someone fill it out and hit the misleading generic error at submit
    // (see isSignupOpen()'s comment in system.js for why that error is
    // misleading).
    isSignupOpen().then(open => {
        if (!open) {
            document.getElementById('regForm').style.display = 'none';
            document.querySelector('.link').style.display = 'none';
            document.getElementById('signup-closed-msg').style.display = 'block';
        }
    });

    // Load departments from DB — only the ones switched on in Settings →
    // Departments, in the order dragged there (same source and order as
    // system/setting.html's loadDepartments()). A null `active` (row from
    // before the column existed) counts as on.
    (async () => {
        let { data, error } = await supabaseClient
            .from('system_department')
            .select('name, active, sort_order')
            .order('sort_order', { ascending: true, nullsFirst: false })
            .order('name', { ascending: true });
        if (error) {
            // Older DB without active/sort_order: fall back to the plain list.
            ({ data } = await supabaseClient.from('system_department').select('name').order('name', { ascending: true }));
        }
        data = (data || []).filter(d => d.active !== false);
        const sel = document.getElementById('dept_val');
        (data || []).forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.name;
            opt.textContent = d.name;
            sel.appendChild(opt);
        });
    })();

    function openDeptPicker(triggerBtn) {
        const select = document.getElementById('dept_val');
        openSelectPicker(triggerBtn, {
            getOptions: () => [...select.options].filter(o => o.value !== '').map(o => ({ value: o.value, label: o.textContent })),
            getValue: () => select.value,
            onSelect: (value) => {
                select.value = value;
                triggerBtn.textContent = value;
                triggerBtn.classList.remove('placeholder');
                select.dispatchEvent(new Event('change')); // clears an inline "required" error
            },
        });
    }

    document.getElementById("regForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const form = e.currentTarget;
        if (!validateAuthForm(form)) return;

        const email = document.getElementById("email_val").value.trim();
        const password = document.getElementById("pass_val").value;
        const confirm = document.getElementById("conf_val").value;

        if (password !== confirm) return setFieldError('conf_val', 'Passwords do not match.');

        // Checked client-side first — the server-side rejection for this
        // gets swallowed into a generic "Database error" before it reaches
        // auth.js's error mapping (see isEmailDomainAllowed()'s own
        // comment), so relying on that round trip shows the wrong message.
        const domainOk = await isEmailDomainAllowed(email);
        if (!domainOk) {
            return setFieldError('email_val', 'This email domain is not allowed to register.');
        }

        const employee_id = document.getElementById("emp_id").value.trim();
        const nick_name = document.getElementById("nick").value.trim();
        const metadata = {
            employee_id,
            nick_name,
            codename: `${nick_name} (${employee_id})`,
            full_name: document.getElementById("full").value.trim(),
            department: document.getElementById("dept_val").value
        };
        await handleSignup(email, password, metadata, form);
    });
</script>

</body>
</html>
