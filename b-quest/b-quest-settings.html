    // ═══════════════════════════════════════════
    // Work Calendar — how much of a day's capacity actually counts, per
    // weekday (0-100%). Feeds the same b-quest-config table as the Day/Max
    // toggles above but through its own staging bucket (calendarChanges),
    // so this box's dirty-dot and the Work List box's don't get confused
    // with each other's pending state.
    // ═══════════════════════════════════════════
    const WEEK_DAYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
    const WORKDAY_DEFAULT = { mon: 100, tue: 100, wed: 100, thu: 100, fri: 100, sat: 100, sun: 100 };

    function calendarConfigBuffer() {
        return { ...originalConfig, ...calendarChanges };
    }

    function renderWorkCalendar() {
        const cfg = calendarConfigBuffer();
        const weights = { ...WORKDAY_DEFAULT, ...(cfg.workday_weight || {}) };
        const mergeEl = document.getElementById('wc-merge-toggle-input');
        if (mergeEl) mergeEl.checked = cfg.merge_company_holidays === true;
        const list = document.getElementById('wc-day-list');
        if (!list) return;
        list.innerHTML = WEEK_DAYS.map(day => {
            const v = weights[day] ?? 100;
            return `
            <div class="wc-day-row ${v < 100 ? 'low' : ''} ${v === 0 ? 'zero' : ''}" data-day="${day}">
                <span class="wc-day-label">${day.toUpperCase()}</span>
                <input type="range" class="wc-slider" min="0" max="100" value="${v}" oninput="onWorkdayPctInput('${day}', this.value)">
                <div class="wc-pct-wrap">
                    <input type="number" class="wc-pct-input" min="0" max="100" value="${v}" oninput="onWorkdayPctInput('${day}', this.value)">
                    <span class="wc-pct-sign">%</span>
                </div>
            </div>`;
        }).join('');
    }

    // Direct DOM sync instead of a full renderWorkCalendar() — dragging the
    // slider fires this continuously, and replacing the row's DOM mid-drag
    // would drop the drag gesture (same reason name-input fields skip
    // re-rendering on every keystroke elsewhere on this page).
    function onWorkdayPctInput(day, rawValue) {
        const v = Math.max(0, Math.min(100, Math.round(Number(rawValue)) || 0));
        const cfg = calendarConfigBuffer();
        calendarChanges.workday_weight = { ...WORKDAY_DEFAULT, ...(cfg.workday_weight || {}), [day]: v };
        markDirty('section-calendar');
        const row = document.querySelector(`.wc-day-row[data-day="${day}"]`);
        if (row) {
            row.querySelector('.wc-slider').value = v;
            row.querySelector('.wc-pct-input').value = v;
            row.classList.toggle('low', v < 100);
            row.classList.toggle('zero', v === 0);
        }
    }

    // Inert until the company holiday list itself exists — staged and
    // saved like everything else here so it's already wired up and ready
    // the moment that feature lands, instead of needing this UI built then.
    function onMergeHolidaysToggle(checked) {
        calendarChanges.merge_company_holidays = checked;
        markDirty('section-calendar');
    }

    // ═══════════════════════════════════════════
    // Notifications & Email — settings only (which recipients a rule
    // resolves to). Turning those rules into an actual deduped send list
    // (matching codenames to real emails, collapsing the same person
    // reached via two different rules, etc.) is separate work for once
    // this is wired to real trigger events — not built here.
    // ═══════════════════════════════════════════
    const NOTIFY_ACTIONS = ['new', 'edit', 'delete', 'assign'];
    const NOTIFY_RULE_DEFAULT = { owner: false, leads: false, assignee: false, departments: [], codenames: [], exclude_codenames: [] };

    function notifyConfigBuffer() {
        return { ...originalConfig, ...notifyChanges };
    }

    function notifyRuleKey(action, channel) {
        return `${channel}_${action}`; // e.g. 'notify_new', 'email_delete'
    }

    function notifyRule(action, channel) {
        const raw = notifyConfigBuffer()[notifyRuleKey(action, channel)] || {};
        return {
            ...NOTIFY_RULE_DEFAULT, ...raw,
            departments: raw.departments || [],
            codenames: raw.codenames || [],
            exclude_codenames: raw.exclude_codenames || []
        };
    }

    function setNotifyRule(action, channel, rule) {
        notifyChanges[notifyRuleKey(action, channel)] = rule;
        markDirty('section-notify');
    }

    function toggleNotifyChannel(channel) {
        notifyChannel = channel;
        renderNotifySection();
    }

    function npBadge(text, removeCall) {
        return `<span class="np-badge">${esc(text)}<button type="button" onclick="${removeCall}" title="Remove"><i class="bi bi-x"></i></button></span>`;
    }

    function renderNotifySection() {
        const tabs = document.getElementById('notify-tabs');
        if (tabs) tabs.querySelectorAll('.np-tab').forEach(b => b.classList.toggle('active', b.dataset.channel === notifyChannel));
        const list = document.getElementById('notify-rows');
        if (!list) return;
        list.innerHTML = NOTIFY_ACTIONS.map(action => renderNotifyRow(action, notifyChannel)).join('');
    }

    function renderNotifyRow(action, channel) {
        const rule = notifyRule(action, channel);
        let badges = '';
        if (rule.owner) badges += npBadge('Owner', `toggleNotifyFlag('${action}','${channel}','owner',false)`);
        if (rule.leads) badges += npBadge('Leads', `toggleNotifyFlag('${action}','${channel}','leads',false)`);
        if (rule.assignee) badges += npBadge('Assignee', `toggleNotifyFlag('${action}','${channel}','assignee',false)`);
        rule.departments.forEach(d => badges += npBadge(d, `toggleNotifyDept('${action}','${channel}','${esc(d)}',false)`));
        rule.codenames.forEach(c => badges += npBadge(c, `toggleNotifyCodename('${action}','${channel}','${esc(c)}',false,false)`));
        let exBadges = '';
        rule.exclude_codenames.forEach(c => exBadges += npBadge(c, `toggleNotifyCodename('${action}','${channel}','${esc(c)}',false,true)`));
        return `
        <div class="np-row">
            <div class="np-row-head">${action.toUpperCase()}</div>
            <div class="np-badges">${badges}<button type="button" class="cfg-btn-add hover-scale" onclick="openNotifyRecipientPicker(event,'${action}','${channel}')"><i class="bi bi-plus-lg"></i> Add</button></div>
            <div class="np-without-row">
                <span class="np-without-label">Without</span>
                ${exBadges}
                <button type="button" class="np-without-add" onclick="openNotifyExcludePicker(event,'${action}','${channel}')"><i class="bi bi-plus"></i> Add</button>
            </div>
        </div>`;
    }

    function toggleNotifyFlag(action, channel, flag, checked) {
        const rule = notifyRule(action, channel);
        setNotifyRule(action, channel, { ...rule, [flag]: checked });
        renderNotifySection();
    }

    function toggleNotifyDept(action, channel, dept, checked) {
        const rule = notifyRule(action, channel);
        const departments = new Set(rule.departments);
        checked ? departments.add(dept) : departments.delete(dept);
        setNotifyRule(action, channel, { ...rule, departments: [...departments] });
        renderNotifySection();
    }

    function toggleNotifyCodename(action, channel, codename, checked, isExclude) {
        const rule = notifyRule(action, channel);
        const field = isExclude ? 'exclude_codenames' : 'codenames';
        const set = new Set(rule[field]);
        checked ? set.add(codename) : set.delete(codename);
        setNotifyRule(action, channel, { ...rule, [field]: [...set] });
        renderNotifySection();
    }

    // "Add recipient" — Owner/Leads/Assignee as quick checkboxes (fixed,
    // no search needed) plus Department and Codename as searchable lists.
    function openNotifyRecipientPicker(evt, action, channel) {
        pickerTarget = { kind: 'notify-add', action, channel };
        const rule = notifyRule(action, channel);
        const panel = document.getElementById('picker-panel');
        panel.classList.remove('medium');
        panel.classList.add('wide');
        panel.innerHTML = `
            <div class="cfg-picker-label">Quick</div>

    // the use case; it's always "this one specific person, regardless of
    // which broad rule would otherwise catch them").
    function openNotifyExcludePicker(evt, action, channel) {

        panel.classList.remove('wide');
        panel.classList.add('medium');
        panel.innerHTML = `
            <div class="cfg-picker-label">Exclude Codename</div>

    function renderNotifyCodenameList(q) {
        const { action, channel, kind } = pickerTarget || {};

        const isExclude = kind === 'notify-exclude';

        `).join('') : '<div class="cfg-empty">No matches</div>';
    }

    function workBuffer() {
        return originalWork.map(w => ({ ...w, ...(workChanges[w.id] || {}), _deleted: workDeletes.has(w.id) }))
            .concat(Object.entries(workChanges).filter(([id]) => id.startsWith('new-')).map(([id, c]) => ({ id, ...c, _new: true })));
    }

    let workDeletes = new Set();

    function renderWork() {
        const container = document.getElementById('work-cols');
        const roles = roleBuffer().filter(r => r.active !== false && !r._deleted);
        const cfg = configBuffer();
        const dayOn = cfg.work_day_enabled !== false;
        const maxOn = cfg.work_max_enabled !== false;
        container.classList.remove('count-1', 'count-2', 'cfg-no-day', 'cfg-no-max');
        if (roles.length === 1) container.classList.add('count-1');
        else if (roles.length === 2) container.classList.add('count-2');
        if (!dayOn) container.classList.add('cfg-no-day');
        if (!maxOn) container.classList.add('cfg-no-max');
        if (!roles.length) { container.innerHTML = '<div class="work-empty">Add a role above first.</div>'; return; }

        const buf = workBuffer();

        container.innerHTML = roles.map(r => {
            const items = buf.filter(w => w.role_id === r.id).sort((a, b) => (a.sort_order ?? 999) - (b.sort_order ?? 999));
            return `
            <div class="work-col">
                <div class="work-col-header" style="background:${r.color}22; border-color:${r.color}55;">
                    <div class="work-col-title-group">
                        <div class="work-col-title" style="color:${r.color}"><i class="bi ${r.icon || 'bi-person-workspace'}"></i> ${esc(r.name) || 'Untitled'}</div>
                        <span class="work-col-count">${items.filter(w => !w._deleted).length}</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:6px;">
                        <button class="work-col-sort" onclick="sortWorkAlpha('${r.id}')" title="Sort A-Z"><i class="bi bi-sort-alpha-down"></i></button>
                        <button class="btn-add-work hover-scale" style="background:${r.color}" onclick="addWork('${r.id}')"><i class="bi bi-plus-lg"></i> Add</button>
                    </div>
                </div>
                <div class="work-col-inner">
                    <div class="work-col-subhead">
                        <span></span><span>Work Name</span><span style="text-align:center;">Weight</span>${dayOn ? '<span style="text-align:center;">Day</span>' : ''}${maxOn ? '<span style="text-align:center;" class="work-col-divider">Max</span>' : ''}<span></span>
                    </div>
                    ${items.length ? items.map((w, i) => `
                        <div class="work-row ${w._new ? 'is-new' : ''} ${w._deleted ? 'is-deleted' : ''}" data-id="${w.id}"
                             draggable="${!w._deleted}"
                             ondragstart="dragStart(event, 'work', '${w.id}', '${r.id}')" ondragend="dragEnd(event)"
                             ondragover="event.preventDefault()" ondragenter="dragEnterRow(event, 'work', '${w.id}', '${r.id}')" ondragleave="dragLeaveRow(event)"
                             ondrop="dropOnRow(event, 'work', '${w.id}', '${r.id}')">
                            <div class="work-drag-handle"><i class="bi bi-grip-vertical"></i></div>
                            <input class="work-input" value="${esc(w.work)}" oninput="onWorkField('${w.id}', 'work', this.value)">
                            <input class="work-weight" type="number" step="0.01" value="${w.weight ?? ''}" oninput="onWorkField('${w.id}', 'weight', this.value === '' ? null : parseFloat(this.value))">
                            ${dayOn ? `<input class="work-weight" type="text" value="${esc(w.day ?? 1)}" oninput="onWorkField('${w.id}', 'day', this.value)">` : ''}
                            ${maxOn ? `<input class="work-weight work-col-divider" type="text" inputmode="decimal" value="${w.max_per_day == null ? '-' : w.max_per_day}" oninput="onWorkField('${w.id}', 'max_per_day', parseMaxPerDay(this.value))">` : ''}
                            ${w._deleted
                                ? `<button class="cfg-btn-undo" onclick="undoRemoveWork('${w.id}')" title="Undo delete"><i class="bi bi-arrow-counterclockwise"></i></button>`
                                : `<button class="btn-work-del" onclick="removeWork('${w.id}')" title="Delete"><i class="bi bi-trash3"></i></button>`}
                        </div>
                    `).join('') : '<div class="work-empty">No items yet</div>'}
                </div>
            </div>`;
        }).join('');
    }

    function onWorkField(id, field, value) {
        if (!workChanges[id]) workChanges[id] = {};
        workChanges[id][field] = value;
        markDirty('section-worklist');
    }

    // "-" (or blank) means unlimited (stored as null); anything else parses
    // as the per-day cap. Typos/non-numeric text also fall back to null
    // rather than throwing, since this field has no strict format.
    function parseMaxPerDay(raw) {
        const v = (raw ?? '').toString().trim();
        if (v === '' || v === '-' || v === '−') return null;
        const n = parseFloat(v);
        return isNaN(n) ? null : n;
    }

    function addWork(roleId) {
        const id = `new-${roleIdSeq--}`;
        const items = workBuffer().filter(w => w.role_id === roleId && !w._deleted);
        const maxOrder = Math.max(0, ...items.map(w => w.sort_order || 0));
        workChanges[id] = { role_id: roleId, work: '', day: '1', weight: 1, max_per_day: null, sort_order: maxOrder + 1 };
        markDirty('section-worklist');
        renderWork();
        focusNewRow(id, '.work-input');
    }

    function removeWork(id) {
        if (id.startsWith('new-')) { delete workChanges[id]; }
        else { workDeletes.add(id); }
        markDirty('section-worklist');
        renderWork();
    }

    function undoRemoveWork(id) {
        workDeletes.delete(id);
        markDirty('section-worklist');
        renderWork();
    }

    // Same "reset to alphabetical" as sortAlpha(), but scoped to one role's
    // work column (work items are grouped by role, not a flat list).
    function sortWorkAlpha(roleId) {
        const list = workBuffer().filter(w => w.role_id === roleId && !w._deleted)
            .sort((a, b) => (a.work || '').localeCompare(b.work || '', undefined, { sensitivity: 'base' }));
        list.forEach((item, i) => { (workChanges[item.id] ||= {}).sort_order = i + 1; });
        markDirty('section-worklist');
        renderWork();
    }

    // ═══════════════════════════════════════════
    // Save All (Roles / Statuses / Work List)
    // ═══════════════════════════════════════════
    // Insert new / update existing / delete removed rows for one table.
    // Skips the UPDATE call entirely for rows also marked for deletion —
    // they're about to be deleted anyway, no point writing to them first.
    // Returns a temp-id -> real-id map for whatever got inserted, so a
    // caller that staged something referencing a 'new-N' id (e.g. Status's
    // default_status_id) can swap in the row's actual id afterward.
    async function saveTable(table, changes, deletes, requiredField, errors, label) {
        const idMap = {};
        for (const [id, ch] of Object.entries(changes)) {
            if (deletes.has(id)) continue;
            if (id.startsWith('new-')) {
                if (!ch[requiredField]?.trim()) continue;
                const { data, error } = await supabaseClient.from(table).insert([{ ...ch, [requiredField]: ch[requiredField].trim() }]).select().single();
                if (error) errors.push(`${label} add "${ch[requiredField]}": ` + error.message);
                else if (data) idMap[id] = data.id;
            } else {
                const { error } = await supabaseClient.from(table).update(ch).eq('id', id);
                if (error) errors.push(`${label} update: ` + error.message);
            }
        }
        for (const id of deletes) {
            const { error } = await supabaseClient.from(table).delete().eq('id', id);
            if (error) {
                // 23503 = foreign key violation — this row (Role/Status) is
                // still referenced by existing tasks. The raw Postgres
                // message is unreadable to a non-technical user; the delete
                // is safely blocked either way (nothing is lost), so just
                // explain the actual reason and the way out.
                errors.push(error.code === '23503'
                    ? `Cannot Delete: ${label} is used by existing tasks. Deactivate it instead.`
                    : `${label} delete: ` + error.message);
            }
        }
        return idMap;
    }

    async function saveAll() {
        try {
            const errors = [];
            const roleIdMap = await saveTable('b_quest_role', roleChanges, roleDeletes, 'name', errors, 'Role');
            // A brand-new Role's Work items / Member grants staged in this
            // SAME save still reference its temp 'new-N' id — swap in the
            // real one now that saveTable above actually inserted it,
            // otherwise their own insert fails (invalid uuid). Also drop
            // those temp ids from roleChanges itself: they're now safely
            // represented by the real reloaded row, so leaving them staged
            // would show the role twice if some LATER step in this same
            // save fails (the error path reloads from DB but never clears
            // already-succeeded entries out of the change buffers).
            Object.values(workChanges).forEach(ch => { if (ch.role_id?.startsWith?.('new-')) ch.role_id = roleIdMap[ch.role_id] || ch.role_id; });
            Object.keys(roleIdMap).forEach(tempId => delete roleChanges[tempId]);

            const statusIdMap = await saveTable('b_quest_status', statusChanges, statusDeletes, 'name', errors, 'Status');
            await saveTable('b_quest_type', typeChanges, typeDeletes, 'name', errors, 'Type');
            await saveTable('b_quest_work', workChanges, workDeletes, 'work', errors, 'Work');

            // Force exactly one Default — if the configured one is no
            // longer valid (deleted/deactivated this session) or was never
            // set, persist the resolved fallback so the DB itself always
            // has an explicit value, not just the UI's live display guess.
            // The resolved id can be a still-unsaved 'new-N' row (e.g. the
            // very first Status ever added) — swap in its real id, now that
            // saveTable above has actually inserted it.
            let resolvedStatusDefault = resolveDefaultStatusId(statusBuffer());
            if (resolvedStatusDefault && resolvedStatusDefault.startsWith('new-')) {
                resolvedStatusDefault = statusIdMap[resolvedStatusDefault] || null;
            }
            if (resolvedStatusDefault && resolvedStatusDefault !== statusConfigBuffer().default_status_id) {
                statusConfigChanges.default_status_id = resolvedStatusDefault;
            }

            for (const [rule, value] of Object.entries({ ...configChanges, ...statusConfigChanges, ...calendarChanges, ...visibilityChanges, ...filterDefaultsChanges, ...notifyChanges })) {
                const { error } = await supabaseClient.from('b_quest_config').upsert({ rule, value });
                if (error) errors.push('Settings update: ' + error.message);
            }

            // Admin Access — same b-quest-member table Members' own page
            // writes to (permissions is a flat array covering dashboard/
            // duplicate/share there and setting/member here), so this is the
            // same insert-if-new-else-update convention as that page uses.
            for (const [codename, ch] of Object.entries(adminAccessChanges)) {
                const isNew = !originalAdminMembers.some(m => m.codename === codename);
                const { error } = isNew
                    ? await supabaseClient.from('b_quest_member').insert([{ codename, permissions: ch.permissions || [] }])
                    : await supabaseClient.from('b_quest_member').update(ch).eq('codename', codename);
                if (error) errors.push(`Admin Access "${codename}": ` + error.message);
            }

            if (errors.length) {
                // Something failed partway through — keep everything staged
                // (including whatever DID succeed, since re-saving those
                // rows again is harmless) so the user can fix and retry
                // instead of silently losing unsaved work.
                const allCannotDelete = errors.every(e => e.startsWith('Cannot Delete:'));
                const title = allCannotDelete ? 'Cannot Delete' : 'Some errors occurred';
                const body = allCannotDelete ? errors.map(e => e.replace('Cannot Delete: ', '')).join('\n') : errors.join('\n');
                Swal.fire(title, body, 'error');
                await Promise.all([loadRoles(), loadStatuses(), loadTypes(), loadConfig(), loadAdminAccess()]);
                renderFilterDefaultsSection();
                await loadWork();
                return;
            }

            Swal.fire({ icon: 'success', title: 'Saved!', showConfirmButton: false, timer: 1200 });
            clearDirty();
            await Promise.all([loadRoles(), loadStatuses(), loadTypes(), loadConfig(), loadAdminAccess()]);
            renderFilterDefaultsSection();
            await loadWork(); // roles feed this

        } catch (e) {
            Swal.fire('Error', e.message, 'error');
        }
    }

    async function loadAllProfiles() {
        const { data } = await supabaseClient.from('profiles').select('codename, nick_name, full_name, employee_id, department, level').neq('level', 'god').order('codename');
        allProfiles = data || [];
    }

    function profileFor(codename) {
        return allProfiles.find(p => p.codename === codename);
    }

    // ═══════════════════════════════════════════
    // Admin Access — who can reach the Setting/Member pages (see the state
    // comment near originalAdminMembers for why this reads/writes the same
    // b-quest-member.permissions array Members' own page does).
    // ═══════════════════════════════════════════
    async function loadAdminAccess() {
        const { data } = await supabaseClient.from('b_quest_member').select('codename, permissions');
        originalAdminMembers = data || [];
        renderAdminAccess();
    }

    function adminAccessBuffer() {
        return originalAdminMembers.map(m => ({ ...m, ...(adminAccessChanges[m.codename] || {}) }))
            .concat(Object.entries(adminAccessChanges)
                .filter(([codename]) => !originalAdminMembers.some(m => m.codename === codename))
                .map(([codename, c]) => ({ codename, permissions: [], ...c })));
    }

    // Only shows people who currently (post-staging) hold Setting or Member
    // — the underlying b-quest-member table has everyone (task-working
    // members too), but this panel is specifically about admin-page access,
    // not the whole roster.
    function visibleAdminRows() {
        return adminAccessBuffer().filter(m => (m.permissions || []).includes('setting') || (m.permissions || []).includes('member'));
    }

    function renderAdminAccess() {
        const rows = visibleAdminRows();
        const list = document.getElementById('aa-list');
        if (!list) return;
        if (!rows.length) { list.innerHTML = '<div class="cfg-empty">No one has Setting or Member access yet</div>'; return; }
        list.innerHTML = rows.map(m => {
            const p = profileFor(m.codename);
            const hasSetting = (m.permissions || []).includes('setting');
            const hasMember = (m.permissions || []).includes('member');
            return `
            <div class="aa-row">
                <div class="am-avatar"><i class="bi bi-person-fill"></i></div>
                <div class="aa-name"><div class="aa-nick">${esc(p?.nick_name || m.codename)}</div></div>
                <label class="aa-toggle-item">
                    <span>Setting</span>
                    <label class="bq-toggle small">
                        <input type="checkbox" ${hasSetting ? 'checked' : ''} onchange="setAdminFlag('${esc(m.codename)}','setting',this.checked)">
                        <span class="bq-slider"></span>
                    </label>
                </label>
                <label class="aa-toggle-item">
                    <span>Member</span>
                    <label class="bq-toggle small">
                        <input type="checkbox" ${hasMember ? 'checked' : ''} onchange="setAdminFlag('${esc(m.codename)}','member',this.checked)">
                        <span class="bq-slider"></span>
                    </label>
                </label>
                <button class="btn-remove" onclick="removeAdminAccess('${esc(m.codename)}')" title="Revoke all admin access"><i class="bi bi-trash3"></i></button>
            </div>`;
        }).join('');
    }

    function setAdminFlag(codename, flag, checked) {
        const m = adminAccessBuffer().find(x => x.codename === codename);
        const permissions = new Set(m?.permissions || []);
        checked ? permissions.add(flag) : permissions.delete(flag);
        if (!adminAccessChanges[codename]) adminAccessChanges[codename] = {};
        adminAccessChanges[codename].permissions = [...permissions];
        markDirty('section-adminaccess');
        renderAdminAccess();
    }

    // Doesn't delete the b-quest-member row — just clears both admin flags,
    // since this person may still hold dashboard/duplicate/share/role
    // grants managed entirely from the Members page.
    function removeAdminAccess(codename) {
        setAdminFlag(codename, 'setting', false);
        setAdminFlag(codename, 'member', false);
    }

    // ── Add Admin Access Modal — same recipe as Members' own Add Member
    // Modal (avatar rows, search, Select All, footer count), just scoped to
    // profiles not already holding Setting/Member.
    let aaModalSelected = new Set();

    function openAdminAddModal() {
        aaModalSelected.clear();
        document.getElementById('aa-add-search').value = '';
        renderAdminAddModalList('');
        updateAdminModalFooter();
        document.getElementById('aa-add-overlay').classList.add('show');
        setTimeout(() => document.getElementById('aa-add-search').focus(), 100);
    }

    function closeAdminAddModal(e) {
        if (e && e.target !== document.getElementById('aa-add-overlay')) return;
        document.getElementById('aa-add-overlay').classList.remove('show');
    }

    function availableAdminProfiles(q = '') {
        const ql = q.toLowerCase();
        const existing = new Set(visibleAdminRows().map(m => m.codename));
        return allProfiles.filter(p =>
            !existing.has(p.codename) &&
            (p.codename.toLowerCase().includes(ql) ||
             (p.nick_name || '').toLowerCase().includes(ql) ||
             (p.full_name || '').toLowerCase().includes(ql) ||
             (p.employee_id || '').toLowerCase().includes(ql) ||
             (p.department || '').toLowerCase().includes(ql))
        );
    }

    function renderAdminAddModalList(q = '') {
        const available = availableAdminProfiles(q);
        const list = document.getElementById('aa-add-list');
        if (!available.length) {
            list.innerHTML = `<div class="am-empty">No one available</div>`;
            return;
        }
        const selectedCount = available.filter(p => aaModalSelected.has(p.codename)).length;
        list.innerHTML = `
            <label class="am-item am-select-all">
                <input type="checkbox" class="modern-checkbox" id="aa-select-all-cb" ${selectedCount === available.length ? 'checked' : ''} onchange="toggleAllAdminModalItems(this.checked)">
                <div class="am-avatar"><i class="bi bi-people-fill"></i></div>
                <div class="am-info am-info-flat">
                    <span class="am-nick">Select All</span>
                    <span class="am-select-count">${available.length} available</span>
                </div>
            </label>
            ${available.map(p => `
                <label class="am-item">
                    <input type="checkbox" class="modern-checkbox" ${aaModalSelected.has(p.codename) ? 'checked' : ''} onchange="toggleAdminModalItem('${esc(p.codename)}', this.checked)">
                    <div class="am-avatar"><i class="bi bi-person-fill"></i></div>
                    <div class="am-info">
                        <span class="am-nick">${esc(p.nick_name || p.codename)}</span>
                        ${p.full_name ? `<span class="am-line2">${esc(p.full_name)}</span>` : ''}
                    </div>
                    ${p.department ? `<span class="am-dept-side">${esc(p.department)}</span>` : ''}
                </label>`).join('')}
        `;
        const selectAllCb = document.getElementById('aa-select-all-cb');
        if (selectAllCb) selectAllCb.indeterminate = selectedCount > 0 && selectedCount < available.length;
    }

    function toggleAdminModalItem(codename, checked) {
        checked ? aaModalSelected.add(codename) : aaModalSelected.delete(codename);
        renderAdminAddModalList(document.getElementById('aa-add-search').value.trim());
        updateAdminModalFooter();
    }

    function toggleAllAdminModalItems(checked) {
        const q = document.getElementById('aa-add-search').value.trim();
        availableAdminProfiles(q).forEach(p => checked ? aaModalSelected.add(p.codename) : aaModalSelected.delete(p.codename));
        renderAdminAddModalList(q);
        updateAdminModalFooter();
    }

    function updateAdminModalFooter() {
        const n = aaModalSelected.size;
        const info = document.getElementById('aa-add-footer-info');
        const btn = document.getElementById('btn-aa-add-confirm');
        info.textContent = n === 0 ? 'No one selected' : `${n} selected`;
        btn.disabled = n === 0;
    }

    function confirmAddAdminAccess() {
        // Merge onto whatever permissions this codename already has (e.g. a
        // working member's dashboard/duplicate/share) — this modal only
        // excludes people already Setting/Member, not people who don't
        // exist as a b-quest-member row yet at all.
        [...aaModalSelected].forEach(codename => {
            const existing = adminAccessBuffer().find(m => m.codename === codename);
            const permissions = new Set(existing?.permissions || []);
            permissions.add('setting');
            adminAccessChanges[codename] = { permissions: [...permissions] };
        });
        document.getElementById('aa-add-overlay').classList.remove('show');
        markDirty('section-adminaccess');
        renderAdminAccess();
    }

    function setupAdminAddSearch() {
        document.getElementById('aa-add-search').addEventListener('input', e => renderAdminAddModalList(e.target.value.trim()));
    }

    function openAdminAccessInfoPopup(evt) {
        const panel = document.getElementById('picker-panel');
        panel.classList.remove('wide');
        panel.classList.add('medium');
        panel.innerHTML = `
            <div class="cfg-info-item divided">
                <div class="cfg-info-title"><i class="bi bi-gear-fill"></i> Setting</div>
                <p>Can open this Setting page — Role/Status/Type/Work List/Daily Capacity/Visibility/Default Filters/Notifications, and this Admin Access panel itself.</p>
            </div>
            <div class="cfg-info-item">
                <div class="cfg-info-title"><i class="bi bi-people-fill"></i> Member</div>
                <p>Can open the Members page and grant/revoke everyone's permissions.</p>
            </div>
            <div class="cfg-info-warning"><i class="bi bi-exclamation-triangle-fill"></i> Setting always implies the power to grant Member too — anyone with Setting can turn their own Member toggle on right here.</div>
        `;
        positionPicker(evt);
    }

    // This page has no <form> anywhere, so pressing Enter in a text/number
    // field normally does nothing — focus just stays stuck. Enter should
    // confirm the value and exit the field instead (there's nothing to
    // "submit" since every field already saves on blur/oninput into the
    // staged buffer).
    document.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        const el = e.target;
        if (el.tagName !== 'INPUT' || el.type === 'checkbox' || el.type === 'radio') return;
        e.preventDefault();
        el.blur();
    });

    loadPage();
</script>
</body>
</html>
