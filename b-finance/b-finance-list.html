<html lang="en">

    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>B-FINANCE</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/system/config.js"></script>
    <script src="/system/system.js"></script>
    <script src="/system/multi-select.js"></script>
    <script src="/system/date-picker.js"></script>
    <script src="b-finance.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>
<body>

<div class="fin-page">

    <!-- Toolbar -->
    <div class="fin-toolbar">
        <div class="fin-toolbar-inner">
            <div class="fin-toolbar-row">
                <button class="fin-sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" title="Pin sidebar open">
                    <i class="bi bi-layout-sidebar"></i>
                </button>
                <div class="fin-search-wrap">
                    <i class="bi bi-search fin-search-icon"></i>
                    <input type="text" id="acctSearch" class="fin-search-input" placeholder="Search...">
                    <button class="flt-search-clear" id="acctSearchClear" onclick="clearAcctSearch()" tabindex="-1"><i class="bi bi-x-lg"></i></button>
                </div>
                <div class="fin-toolbar-spacer"></div>
                <div class="fin-toolbar-right">
                    <div class="flt-date-today-wrap" id="fltDateGroup">
                        <div class="flt-select-box" id="wrap-filterBillDate"></div>
                        <button class="flt-btn-today" id="btnMonth" onclick="setQuickDate('month')">This Month</button>
                    </div>
                    <div class="status-seg-wrap" id="billingSegWrap">
                        <div class="status-seg-slider" id="billingSegSlider"></div>
                        <button class="status-seg-btn active" data-bs="all" onclick="setBillingStatus('all')">All</button>
                        <button class="status-seg-btn" data-bs="pending" onclick="setBillingStatus('pending')">Pending</button>
                        <button class="status-seg-btn" data-bs="billed" onclick="setBillingStatus('billed')">Billed</button>
                    </div>
                    <button class="flt-btn-adv" id="toggleAdvBtn" onclick="toggleAdvanced()" title="Advance Filters"><i class="bi bi-sliders"></i></button>
                    <button class="btn-reset" id="btnReset" onclick="resetAllFilters()" title="Clear all filters"><i class="bi bi-arrow-counterclockwise"></i></button>
                </div>
            </div>
            <div class="flt-advanced-zone" id="advancedFilterZone">
                <div class="flt-advanced-row">
                    <div class="flt-select-box" id="fltCompanyBox"></div>
                    <div class="flt-select-box" id="fltStatusBox"></div>
                    <button class="flt-btn-quick active" id="btnQtDetail" onclick="toggleQtDetail()" title="Show / hide QT detail">
                        <i class="bi bi-table"></i> QT Detail
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="finance-layout sidebar-forced" id="financeLayout">
        <!-- Left Panel -->
        <div class="fin-left" id="finLeft">
            <div class="fin-sidebar-rail"><i class="bi bi-chevron-right"></i></div>
            <div class="fin-tree" id="acctTree">

        <!-- Right Panel -->

            <div class="fin-empty" id="finEmpty">
                <i class="bi bi-wallet2"></i>
                <p>Select a company to view Finance QTs</p>
            </div>
            <div id="finContent" style="display:none">
                <div class="fin-company-hdr" id="finCompanyHdr"></div>
                <div id="acctDetail"></div>
                <div class="fin-opp-title">Opportunities &amp; Billables</div>
                <div id="finOppList"></div>
            </div>
        </div>
    </div>

</div>

<!-- Save Bar -->
<div class="fin-save-bar" id="finSaveBar">
    <div class="save-bar-left">
        <i class="bi bi-pencil-square"></i>
        <div>
            <div class="save-bar-label">Unsaved changes</div>
            <div class="save-bar-sub" id="finSaveCount"></div>
        </div>
    </div>
    <div class="save-bar-btns">
        <button class="btn-save-discard" onclick="discardChanges()">Discard</button>
        <button class="btn-save-confirm" onclick="saveChanges()"><i class="bi bi-check2"></i> Save</button>
    </div>
</div>

<script>
const fNum    = n => (n != null && !isNaN(+n) && +n !== 0) ? fmtMoney(+n) : '—';
const fDate   = d => { if (!d) return ''; try { return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); } catch { return d; } };
const fmtAmt  = v => (v != null && v !== '') ? fmtMoney(+v) : '';
const parseAmt = s => { const n = parseFloat(String(s).replace(/,/g,'')); return isNaN(n) ? null : n; };

let _allAccounts    = [];
let _boxesCollapsed = false;
let _selectedAccId  = null;

let _filterDateFrom = '';
let _filterDateTo   = '';
let _filterBillingStatus = 'all'; // 'all' | 'pending' (no receipt_date yet) | 'billed' (has one)
let _filterCompanyQt = new Set();
let _filterStatus   = new Set();
let _allCompanies   = []; // options for the Company QT multi-select, refreshed by loadLeftPanel()
let _allStatuses    = []; // options for the Status multi-select, refreshed by loadLeftPanel()
let _companyMS = null, _statusMS = null, _billDateFilter = null; // createDatePicker() instance — initialized in initFinanceFilters()
let _qtDetailOpen   = true;
let _cachedOpps     = [];
let _cachedQtByOpp  = new Map();
let _cachedCompanyByOpp = new Map();
let _selectedCoName = '';
let _selectedAcName = '';
let _changes        = new Map();  // id → { field: value }
let _pendingNew     = [];         // new rows not yet in DB
let _pendingDel     = new Set();  // ids to delete
const _qtFinRows    = new Map();  // qtId → DB finRows[] from last render

function toggleAcctBoxes() {
    _boxesCollapsed = !_boxesCollapsed;
    const zone = document.getElementById('acctHdrZone');
    const btn  = document.getElementById('acctBoxToggle');
    if (zone) zone.classList.toggle('boxes-collapsed', _boxesCollapsed);
    if (btn)  btn.querySelector('i').className = `bi bi-chevron-${_boxesCollapsed ? 'down' : 'up'}`;
}

function toggleSidebar() {
    const layout  = document.getElementById('financeLayout');
    const btn     = document.getElementById('sidebarToggle');
    const pinned  = layout.classList.toggle('sidebar-pinned');
    btn.classList.toggle('active', pinned);
    btn.title = pinned ? 'Unpin sidebar' : 'Pin sidebar open';
}

function hasPendingChanges() {
    return _changes.size + _pendingNew.length + _pendingDel.size > 0;
}

function shakeSaveBar() {
    const bar = document.getElementById('finSaveBar');
    if (!bar || !bar.classList.contains('visible')) return;
    bar.classList.remove('shake');
    void bar.offsetHeight;
    bar.classList.add('shake');
    bar.addEventListener('animationend', () => bar.classList.remove('shake'), { once: true });
}

function updateSaveBar() {
    const n = _changes.size + _pendingNew.length + _pendingDel.size;
    const bar = document.getElementById('finSaveBar');
    if (n > 0) {
        bar.classList.add('visible');
        document.getElementById('finSaveCount').textContent = `${n} row${n > 1 ? 's' : ''} pending`;
    } else {
        bar.classList.remove('visible');
    }
}

// Intercept all navigation links — shake save bar if pending
document.addEventListener('click', e => {
    if (!hasPendingChanges()) return;
    const a = e.target.closest('a[href]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (!href || href.startsWith('#') || href.startsWith('javascript')) return;
    e.preventDefault();
    shakeSaveBar();
}, true);

// Detail textareas auto-grow to fit their content between a 2-line floor
// and an 8-line ceiling (see .fin-textarea in b-finance.css) — resetting to
// 'auto' first lets scrollHeight measure the content's real height instead
// of whatever height was previously forced on the element.
const FIN_TEXTAREA_MAX = 160; // px, ~8 lines at this font-size/line-height
function autoResizeTextarea(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, FIN_TEXTAREA_MAX) + 'px';
}
// Delegated so newly-rendered rows (re-render, Add Sub) are covered without
// re-attaching a listener per textarea every time the table is rebuilt.
document.addEventListener('input', e => {
    if (e.target.classList.contains('fin-textarea')) autoResizeTextarea(e.target);
});
// One-time sizing pass for whatever .fin-textarea elements a render just
// introduced — needed because scrollHeight can only be measured once the
// element is actually laid out in the DOM, not from the HTML string alone.
function syncTextareaHeights(container) {
    (container || document).querySelectorAll('.fin-textarea').forEach(autoResizeTextarea);
}

function trackChange(rowId, field, value) {
    if (!_changes.has(rowId)) _changes.set(rowId, {});
    _changes.get(rowId)[field] = value === '' ? null : value;
    const tr = document.querySelector(`[data-fin-id="${rowId}"]`);
    if (tr) tr.classList.add('is-dirty');
    updateSaveBar();
}

function trackNewChange(tempId, field, value) {
    const row = _pendingNew.find(r => r._tempId === tempId);
    if (row) row[field] = value === '' ? null : value;
    updateSaveBar();
}

// ── Left Panel (Finance-first: only accounts with actual b_finance_qt rows) ──
async function loadLeftPanel() {
    const treeEl = document.getElementById('acctTree');
    try {
        // Step 1: Get qt_ids + bill_dates that have finance data
        const { data: finRows, error: e1 } = await supabaseClient
            .from('b_finance_qt')
            .select('qt_id, bill_date, actual_amount, receipt_date, receipt_no');
        if (e1) throw e1;

        const finQtIds = [...new Set((finRows||[]).map(r => r.qt_id).filter(Boolean))];

        // Map qt_id → [{bill_date, receipt_date}] — keeping receipt_date
        // alongside bill_date (not just a flat Set<bill_date>) is what lets
        // the Billing Status filter below check, per entry, whether it's
        // still pending (no receipt_date) or already billed.
        const finRowsByQt = new Map();
        (finRows||[]).forEach(r => {
            if (!r.bill_date) return;
            if (!finRowsByQt.has(r.qt_id)) finRowsByQt.set(r.qt_id, []);
            finRowsByQt.get(r.qt_id).push({ bill_date: r.bill_date, receipt_date: r.receipt_date });
        });
        if (!finQtIds.length) {
            treeEl.innerHTML = '<div style="padding:16px;color:#94a3b8;font-size:0.82rem;text-align:center">No finance data found</div>';
            return;
        }

        // Step 2: Get qt_id + opportunity_ids for those qt_ids (original QTs only)
        // — company_qt lives directly on the QT itself (one per QT, unlike bu
        // which is per line-item), so it comes along for free here with no
        // extra query needed.
        const { data: bqts, error: e2 } = await supabaseClient
            .from('b_opportunity_qt')
            .select('qt_id, opportunity_id, qt_number, company_qt')
            .in('qt_id', finQtIds)
            .eq('qt_type', 'original');
        if (e2) throw e2;

        const oppIds = [...new Set((bqts||[]).map(q => q.opportunity_id).filter(Boolean))];
        if (!oppIds.length) {
            treeEl.innerHTML = '<div style="padding:16px;color:#94a3b8;font-size:0.82rem;text-align:center">No linked opportunities</div>';
            return;
        }

        // Step 3: Get account_ids + status
        const { data: opps, error: e3 } = await supabaseClient
            .from('b_opportunity_list').select('opportunity_id, account_id, status, opportunity_name, owner').in('opportunity_id', oppIds);
        if (e3) throw e3;

        const accIds = [...new Set((opps||[]).map(o => o.account_id).filter(Boolean))];
        if (!accIds.length) {
            treeEl.innerHTML = '<div style="padding:16px;color:#94a3b8;font-size:0.82rem;text-align:center">No accounts found</div>';
            return;
        }

        // Build opportunity_id → Set<company_qt> and [{bill_date, receipt_date}]
        const qtToOpp = new Map((bqts||[]).map(q => [q.qt_id, q.opportunity_id]));
        const companyByOpp   = new Map();
        const finEntriesByOpp = new Map();
        (bqts||[]).forEach(q => {
            if (!q.company_qt || !q.opportunity_id) return;
            if (!companyByOpp.has(q.opportunity_id)) companyByOpp.set(q.opportunity_id, new Set());
            companyByOpp.get(q.opportunity_id).add(q.company_qt);
        });
        finRowsByQt.forEach((entries, qtId) => {
            const oppId = qtToOpp.get(qtId);
            if (!oppId) return;
            if (!finEntriesByOpp.has(oppId)) finEntriesByOpp.set(oppId, []);
            finEntriesByOpp.get(oppId).push(...entries);
        });

        // Build opportunity_id → account_id map
        const oppToAcct = new Map((opps||[]).map(o => [o.opportunity_id, o.account_id]));

        // Build account → {statuses, companies, finEntries, oppNames, oppIds, searchTerms} map
        const acctMeta = new Map();
        const initMeta = () => ({ statuses: new Set(), companies: new Set(), finEntries: [], oppNames: new Set(), oppIds: new Set(), searchTerms: new Set() });
        (opps||[]).forEach(o => {
            if (!acctMeta.has(o.account_id)) acctMeta.set(o.account_id, initMeta());
            if (o.status)           acctMeta.get(o.account_id).statuses.add(o.status);
            if (o.opportunity_name) acctMeta.get(o.account_id).oppNames.add(o.opportunity_name.toLowerCase());
            if (o.opportunity_id)   acctMeta.get(o.account_id).oppIds.add(o.opportunity_id.toLowerCase());
            if (o.owner)            acctMeta.get(o.account_id).searchTerms.add(o.owner.toLowerCase());
            companyByOpp.get(o.opportunity_id)?.forEach(c => acctMeta.get(o.account_id).companies.add(c));
            finEntriesByOpp.get(o.opportunity_id)?.forEach(e => acctMeta.get(o.account_id).finEntries.push(e));
        });
        // Index qt_number per account
        (bqts||[]).forEach(q => {
            const accId = oppToAcct.get(q.opportunity_id);
            if (!accId || !q.qt_number) return;
            acctMeta.get(accId)?.searchTerms.add(q.qt_number.toLowerCase());
        });
        // Index amounts, dates, receipt_no per account
        (finRows||[]).forEach(r => {
            const oppId = qtToOpp.get(r.qt_id);
            const accId = oppToAcct.get(oppId);
            if (!accId) return;
            const m = acctMeta.get(accId);
            if (!m) return;
            if (r.actual_amount) m.searchTerms.add(String(r.actual_amount));
            if (r.bill_date)     m.searchTerms.add(r.bill_date);
            if (r.receipt_date)  m.searchTerms.add(r.receipt_date);
            if (r.receipt_no)    m.searchTerms.add(r.receipt_no.toLowerCase());
        });

        // Step 4: Get account/company info
        const { data: accounts, error: e4 } = await supabaseClient
            .from('b_account_list')
            .select('account_id, account_name, company_name, tax_id, address, contact, document, payment, remark')
            .in('account_id', accIds)
            .order('account_name');
        if (e4) throw e4;

        _allAccounts = (accounts||[]).map(a => {
            const m = acctMeta.get(a.account_id);
            // Append account detail fields into searchTerms
            const extra = [a.tax_id, a.contact, a.document, a.payment, a.remark].filter(Boolean).map(s => s.toLowerCase());
            const searchTerms = m?.searchTerms || new Set();
            extra.forEach(s => searchTerms.add(s));
            return {
                ...a,
                statuses:    m?.statuses    || new Set(),
                companies:   m?.companies   || new Set(),
                finEntries:  m?.finEntries  || [],
                oppNames:    m?.oppNames    || new Set(),
                oppIds:      m?.oppIds      || new Set(),
                searchTerms,
            };
        });

        // Refresh Company QT & Status multi-select options from ALL data —
        // getOptions() reads these live each time either popover opens, so
        // no re-init needed.
        _allCompanies = [...new Set((bqts||[]).map(q => q.company_qt).filter(Boolean))].sort();
        _allStatuses  = [...new Set((opps||[]).map(o => o.status).filter(Boolean))].sort();

        renderTree('');
        document.getElementById('acctSearch').addEventListener('input', e => {
            document.getElementById('acctSearchClear').style.display = e.target.value ? 'block' : 'none';
            updateResetVisibility();
            deselectAccount();
            renderTree(e.target.value.toLowerCase());
        });
    } catch (e) {
        treeEl.innerHTML = `<div style="padding:16px;color:#ef4444;font-size:0.82rem">Error: ${e.message}</div>`;
        console.error('[Finance] loadLeftPanel error:', e);
    }
}

function clearAcctSearch() {
    const inp = document.getElementById('acctSearch');
    inp.value = '';
    document.getElementById('acctSearchClear').style.display = 'none';
    updateResetVisibility();
    deselectAccount();
    renderTree('');
}

function inDateRange(d, from, to) {
    return (!from || d >= from) && (!to || d <= to);
}

// Billing Status — independent of the Bill Date range (works alongside it,
// not instead of it): 'pending' = still needs the billing paperwork done
// (no receipt_date yet), 'billed' = already receipted, 'all' = don't care.
function billingStatusPasses(receiptDate) {
    if (_filterBillingStatus === 'pending') return !receiptDate;
    if (_filterBillingStatus === 'billed')  return !!receiptDate;
    return true;
}

function accountMatchesSearch(a, s) {
    if (!s) return true;
    return a.account_name.toLowerCase().includes(s)
        || (a.company_name||'').toLowerCase().includes(s)
        || a.account_id.toLowerCase().includes(s)
        || [...a.oppNames].some(n => n.includes(s))
        || [...a.oppIds].some(n => n.includes(s))
        || [...a.searchTerms].some(n => n.includes(s));
}

function renderTree(search) {
    const tree = {};
    _allAccounts.forEach(a => {
        if (!accountMatchesSearch(a, search)) return;
        if (_filterCompanyQt.size && ![...a.companies].some(c => _filterCompanyQt.has(c))) return;
        if (_filterStatus.size && ![...a.statuses].some(s => _filterStatus.has(s)))  return;
        if ((_filterDateFrom || _filterDateTo || _filterBillingStatus !== 'all') &&
            !a.finEntries.some(e => inDateRange(e.bill_date, _filterDateFrom, _filterDateTo) && billingStatusPasses(e.receipt_date))) return;
        if (!tree[a.account_name]) tree[a.account_name] = [];
        tree[a.account_name].push(a);
    });

    const html = Object.entries(tree).map(([acName, companies]) => `
        <div class="acct-group">
            <div class="acct-hdr${search ? ' open' : ''}" onclick="this.classList.toggle('open')">
                <i class="bi bi-chevron-right acct-chevron"></i>
                <span class="acct-label">${esc(acName)}</span>
                ${companies.length > 1 ? `<span class="acct-badge">${companies.length}</span>` : ''}
            </div>
            <div class="acct-companies">
                ${companies.map(c => `
                    <div class="company-item${_selectedAccId === c.account_id ? ' active' : ''}"
                         data-acc-id="${esc(c.account_id)}"
                         onclick="selectCompany('${esc(c.account_id)}','${esc(c.company_name||c.account_id)}','${esc(acName)}')">
                        ${esc(c.company_name || c.account_id)}
                    </div>`).join('')}
            </div>
        </div>`).join('');

    document.getElementById('acctTree').innerHTML = html || '<div style="padding:16px;color:#cbd5e1;font-size:0.75rem">No results</div>';
}

// ── Account Detail Card — uses cached _allAccounts (no extra DB call) ────────
function loadAccountDetail(accountId, companyName, accountName) {
    const d = _allAccounts.find(a => a.account_id === accountId) || {};
    const box = (icon, label, val) => val
        ? `<div class="acct-info-box"><span class="acct-box-lbl"><i class="bi ${icon}"></i>${label}</span><span class="acct-box-val">${esc(val)}</span></div>`
        : '';
    const boxes = [
        box('bi-person',         'Contact',   d.contact),
        box('bi-credit-card',    'Payment',   d.payment),
        box('bi-file-earmark',   'Documents', d.document),
        box('bi-chat-left-text', 'Remarks',   d.remark),
    ].join('');

    document.getElementById('acctDetail').innerHTML = `
    <div class="acct-hdr-zone${_boxesCollapsed ? ' boxes-collapsed' : ''}" id="acctHdrZone">
        <div class="acct-hdr-row1">
            <div class="acct-hdr-names">
                <span class="acct-hdr-company">${esc(companyName)}</span>
                <span class="acct-hdr-dot">·</span>
                <span class="acct-hdr-acname">${esc(accountName)}</span>
            </div>
            <div class="acct-hdr-badges">
                ${d.tax_id ? `<span class="acct-taxid-badge"><span class="taxid-lbl">Tax ID</span><span class="taxid-val">${esc(d.tax_id)}</span></span>` : ''}
                <span class="acct-id-badge">${esc(accountId)}</span>
                <button class="acct-edit-btn" onclick="editAccountInBAccount('${esc(accountId)}')" title="Edit Account"><i class="bi bi-pencil"></i></button>
                ${boxes ? `<button class="acct-boxes-toggle" id="acctBoxToggle" onclick="toggleAcctBoxes()" title="Toggle details"><i class="bi bi-chevron-${_boxesCollapsed ? 'down' : 'up'}"></i></button>` : ''}
            </div>
        </div>
        ${d.address ? `<div class="acct-hdr-row2"><span class="acct-hdr-address">${esc(d.address)}</span></div>` : ''}
        ${boxes ? `<div class="acct-info-boxes">${boxes}</div>` : ''}
    </div>`;
}

// ── Right Panel ─────────────────────────────────────────────────────────────
async function selectCompany(accountId, companyName, accountName) {
    document.getElementById('financeLayout').classList.remove('sidebar-forced');
    if (hasPendingChanges()) { shakeSaveBar(); return; }

    _selectedAccId = accountId;
    _selectedCoName = companyName;
    _selectedAcName = accountName;

    // highlight selected
    document.querySelectorAll('.company-item').forEach(el => {
        el.classList.toggle('active', el.dataset.accId === accountId);
    });

    document.getElementById('finEmpty').style.display = 'none';
    document.getElementById('finContent').style.display = 'block';
    document.getElementById('acctDetail').innerHTML = '';
    document.getElementById('finOppList').innerHTML = '<div style="padding:24px;color:#cbd5e1;font-size:0.82rem;text-align:center"><i class="bi bi-arrow-clockwise"></i> Loading...</div>';

    document.getElementById('finCompanyHdr').innerHTML = '';

    loadAccountDetail(accountId, companyName, accountName);
    await loadRightPanel(accountId);
}

async function loadRightPanel(accountId) {
    // Step 1: get opps
    const { data: opps, error: oppErr } = await supabaseClient
        .from('b_opportunity_list')
        .select('opportunity_id, opportunity_name, status, total_amount, total_gp, update_date, owner')
        .eq('account_id', accountId)
        .order('update_date', { ascending: false });

    if (oppErr || !opps?.length) {
        document.getElementById('finOppList').innerHTML = '<div style="padding:32px;text-align:center;color:#cbd5e1;font-size:0.82rem">No opportunities found</div>';
        return;
    }

    const oppIds = opps.map(o => o.opportunity_id);

    // Step 2: get QTs (original only)
    const { data: qts } = await supabaseClient
        .from('b_opportunity_qt')
        .select('qt_id, opportunity_id, qt_number, company_qt')
        .in('opportunity_id', oppIds)
        .eq('qt_type', 'original')
        .order('qt_id');

    const qtIds = (qts||[]).map(q => q.qt_id);

    // Step 3: items + finance rows in parallel
    const [{ data: items }, { data: finRows }] = await Promise.all([
        qtIds.length ? supabaseClient.from('b_opportunity_qt_item').select('qt_id, qty, price, discount, gp, amount').in('qt_id', qtIds) : Promise.resolve({ data: [] }),
        qtIds.length ? supabaseClient.from('b_finance_qt').select('*').in('qt_id', qtIds).order('qt_id').order('sub_index') : Promise.resolve({ data: [] }),
    ]);

    // Build Maps
    const saleMap = new Map();
    (items||[]).forEach(i => {
        const amt = +i.amount || Math.max(0, (+i.qty||1) * (+i.price||0) - (+i.discount||0));
        saleMap.set(i.qt_id, (saleMap.get(i.qt_id)||0) + amt);
    });

    const finMap = new Map();
    (finRows||[]).forEach(r => {
        if (!finMap.has(r.qt_id)) finMap.set(r.qt_id, []);
        finMap.get(r.qt_id).push(r);
    });

    // company_qt lives directly on the QT, not per line-item like bu did —
    // no extra query needed, just group what's already in qts.
    const companyByOpp = new Map();
    (qts||[]).forEach(q => {
        if (!q.company_qt) return;
        if (!companyByOpp.has(q.opportunity_id)) companyByOpp.set(q.opportunity_id, new Set());
        companyByOpp.get(q.opportunity_id).add(q.company_qt);
    });

    const qtByOpp = new Map();
    (qts||[]).forEach(q => {
        if (!qtByOpp.has(q.opportunity_id)) qtByOpp.set(q.opportunity_id, []);
        qtByOpp.get(q.opportunity_id).push({ ...q, saleAmt: saleMap.get(q.qt_id)||0, finRows: finMap.get(q.qt_id)||[] });
    });

    _cachedOpps    = opps;
    _cachedQtByOpp = qtByOpp;
    _cachedCompanyByOpp = companyByOpp;
    applyFinFilters();
}


function deselectAccount() {
    _selectedAccId = null;
    _qtFinRows.clear();
    document.getElementById('finEmpty').style.display   = '';
    document.getElementById('finContent').style.display = 'none';
    document.getElementById('financeLayout').classList.add('sidebar-forced');
}

// Shared tail for every top-filter change (the Bill Date picker's onChange,
// and the Company/Status multi-selects' onChange below) — changing any of
// them always drops back to the unselected-account view, same as before.
function applyTopFilters() {
    syncQuickDateButtons();
    updateResetVisibility();
    deselectAccount();
    renderTree(document.getElementById('acctSearch').value.toLowerCase());
}

// Reset only appears once something is actually filtered — same convention
// as b-opportunity-list.html's updateResetVisibility(). Called after every
// filter change (applyTopFilters' shared tail) and on search text changes,
// which don't otherwise go through applyTopFilters().
function updateResetVisibility() {
    const anyActive = document.getElementById('acctSearch').value ||
        _filterDateFrom || _filterDateTo || _filterBillingStatus !== 'all' ||
        _filterCompanyQt.size || _filterStatus.size;
    document.getElementById('btnReset').classList.toggle('has-filters', !!anyActive);
}

function toggleAdvanced() {
    document.getElementById('advancedFilterZone').classList.toggle('show');
    document.getElementById('toggleAdvBtn').classList.toggle('active');
}

// Sliding-pill position for the Billing Status carousel — measured via
// offsetLeft/offsetWidth (same technique as b-account.js's createSegControl)
// since a 3-option pill's exact widths depend on each label's rendered size.
function repositionBillingSeg() {
    const active = document.querySelector('#billingSegWrap .status-seg-btn.active');
    const slider = document.getElementById('billingSegSlider');
    if (!active || !slider) return;
    slider.style.left  = active.offsetLeft + 'px';
    slider.style.width = active.offsetWidth + 'px';
}

function setBillingStatus(status) {
    _filterBillingStatus = status;
    document.querySelectorAll('#billingSegWrap .status-seg-btn').forEach(b => b.classList.toggle('active', b.dataset.bs === status));
    repositionBillingSeg();
    applyTopFilters();
}

// Company QT/Status dropdown-checkbox popovers (system/multi-select.js) —
// same component used platform-wide instead of native <select> (can't
// multi-select, can't be restyled to match the pill filter-box theme).
// Company QT replaces the old BU filter — BU was never shown anywhere on
// this page's cards (only company_qt is, via the qt-co-badge), so filtering
// by it gave no visible confirmation it was even working; company_qt is
// both visible here and more finance-relevant (billing entity) than BU
// (internal department).
function initFinanceFilters() {
    _companyMS = createMultiSelect({
        trigger: document.getElementById('fltCompanyBox'),
        label: 'Company',
        getOptions: () => _allCompanies.map(c => ({ value: c, label: c })),
        onChange: values => { _filterCompanyQt = new Set(values); applyTopFilters(); }
    });
    _statusMS = createMultiSelect({
        trigger: document.getElementById('fltStatusBox'),
        label: 'Status',
        getOptions: () => _allStatuses.map(s => ({ value: s, label: s })),
        onChange: values => { _filterStatus = new Set(values); applyTopFilters(); }
    });
    // date-picker.js owns its own active-filter tint on #wrap-filterBillDate
    // internally — the fltDateGroup-level toggle in applyTopFilters() below
    // is gone, ref b-quest-list.html's Deadline filter for the same pattern.
    _billDateFilter = createDatePicker({
        trigger: document.getElementById('wrap-filterBillDate'),
        mode: 'range',
        label: 'Bill Date',
        onChange: ({ start, end }) => {
            _filterDateFrom = start || '';
            _filterDateTo   = end || '';
            applyTopFilters();
        }
    });
    repositionBillingSeg(); // initial slider position under the default "All"
}

function resetAllFilters() {
    _billDateFilter.setValue({ start: null, end: null });
    _filterDateFrom  = '';
    _filterDateTo    = '';
    _filterCompanyQt = new Set();
    _filterStatus    = new Set();
    _companyMS?.clear();
    _statusMS?.clear();
    setBillingStatus('all');
}

function setQuickDate(type) {
    if (type === 'month') {
        const active = document.getElementById('btnMonth').classList.contains('active');
        if (active) {
            _billDateFilter.setValue({ start: null, end: null });
        } else {
            const d = new Date();
            const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0');
            const last = new Date(y, d.getMonth() + 1, 0).getDate();
            _billDateFilter.setValue({ start: `${y}-${m}-01`, end: `${y}-${m}-${String(last).padStart(2, '0')}` });
        }
    }
    const { start, end } = _billDateFilter.getValue();
    _filterDateFrom = start || '';
    _filterDateTo   = end || '';
    applyTopFilters();
}

function syncQuickDateButtons() {
    const { start: f, end: t } = _billDateFilter.getValue();
    const d = new Date(), y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0');
    const last = String(new Date(y, d.getMonth() + 1, 0).getDate()).padStart(2, '0');
    document.getElementById('btnMonth').classList.toggle('active', f === `${y}-${m}-01` && t === `${y}-${m}-${last}`);
}

function viewOpp(id) { window.open(`/b-account/b-opportunity-view?id=${encodeURIComponent(id)}`, '_blank'); }
function editAccountInBAccount(accountId) { window.open(`/b-account/b-account-list?edit=${encodeURIComponent(accountId)}`, '_blank'); }

function toggleQtDetail() {
    _qtDetailOpen = !_qtDetailOpen;
    document.getElementById('btnQtDetail').classList.toggle('active', _qtDetailOpen);
    applyFinFilters();
}

function applyFinFilters() {
    let opps = _cachedOpps;

    if (_filterStatus.size)    opps = opps.filter(o => _filterStatus.has(o.status));
    if (_filterCompanyQt.size) opps = opps.filter(o => { const cs = _cachedCompanyByOpp.get(o.opportunity_id); return cs && [...cs].some(c => _filterCompanyQt.has(c)); });

    if (_filterDateFrom || _filterDateTo || _filterBillingStatus !== 'all') {
        opps = opps.filter(opp =>
            (_cachedQtByOpp.get(opp.opportunity_id) || []).some(qt =>
                qt.finRows.some(r => r.bill_date && inDateRange(r.bill_date, _filterDateFrom, _filterDateTo) && billingStatusPasses(r.receipt_date))
            )
        );
    }

    renderRightPanel(opps, _cachedQtByOpp);
}

function oppStatusClass(status) {
    if (!status) return 'pending';
    const s = status.toLowerCase();
    if (s === 'signed' || s === 'active') return 'signed';
    if (s === 'churn') return 'churn';
    return 'pending';
}

function getQtStatus(finRows) {
    if (!finRows.length) return { label: 'Pending', cls: 'pending', dot: '○' };
    if (finRows.every(r => r.receipt_date)) return { label: 'Received', cls: 'received', dot: '●' };
    if (finRows.some(r => r.bill_date))     return { label: 'Invoiced',  cls: 'invoiced',  dot: '◑' };
    return { label: 'Pending', cls: 'pending', dot: '○' };
}

function renderRightPanel(opps, qtByOpp) {
    const html = opps.map(opp => {
        const qts    = qtByOpp.get(opp.opportunity_id) || [];
        const totSale = qts.reduce((s,q) => s + q.saleAmt, 0);
        const totAct  = qts.reduce((s,q) => s + q.finRows.filter(r => r.receipt_no).reduce((ss,r) => ss + (+r.actual_amount||0), 0), 0);
        const stCls   = oppStatusClass(opp.status);

        return `
        <div class="opp-block">
            <div class="opp-hdr open" onclick="this.classList.toggle('open');this.nextElementSibling.style.display=this.classList.contains('open')?'block':'none'">
                <div class="opp-meta">
                    <div class="opp-id-row">
                        <span class="opp-id">${esc(opp.opportunity_id)}</span>
                        <span class="opp-status-badge ${stCls}">${esc(opp.status||'—')}</span>
                        ${opp.owner ? `<span class="opp-owner-badge">${esc(opp.owner)}</span>` : ''}
                        <button class="opp-view-btn" onclick="event.stopPropagation();viewOpp('${esc(opp.opportunity_id)}')" title="View Opportunity"><i class="bi bi-info-circle"></i></button>
                    </div>
                    <div class="opp-name">${esc(opp.opportunity_name||'—')}</div>
                </div>
                <div class="opp-nums">
                    <div class="opp-num-item">
                        <div class="opp-num-val">${fNum(totSale)} ฿</div>
                        <div class="opp-num-label">Sale</div>
                    </div>
                    <div class="opp-num-div"></div>
                    <div class="opp-num-item">
                        <div class="opp-num-val green">${fNum(totAct)} ฿</div>
                        <div class="opp-num-label green">Actual</div>
                    </div>
                    ${totSale > 0 && totAct > 0 ? `<span class="opp-pct-badge">${(totAct/totSale*100).toFixed(1)}%</span>` : ''}
                </div>
                <i class="bi bi-chevron-down opp-chevron"></i>
            </div>
            <div class="opp-body" style="display:block">
                ${qts.length ? qts.map(qt => renderQtBlock(qt, qts.length)).join('') : '<div class="no-finance">No QTs</div>'}
            </div>
        </div>`;
    }).join('');

    document.getElementById('finOppList').innerHTML = html;
    syncTextareaHeights(document.getElementById('finOppList'));
    enhanceFinDateInputs(document.getElementById('finOppList'));
}

function renderQtBlock(qt, qtCount) {
    const qtStatus = getQtStatus(qt.finRows);
    const totAct   = qt.finRows.filter(r => r.receipt_no).reduce((s,r) => s + (+r.actual_amount||0), 0);
    const qtId     = qt.qt_id;

    const autoOpen = _qtDetailOpen;
    return `
    <div class="qt-block">
        <div class="qt-hdr${autoOpen ? ' open' : ''}" onclick="this.classList.toggle('open');const b=this.nextElementSibling;b.style.display=this.classList.contains('open')?'block':'none';if(this.classList.contains('open'))syncTextareaHeights(b)">
            <span class="qt-num">${esc(qt.qt_number||qt.qt_id)}</span>
            ${qt.company_qt ? `<span class="qt-co-badge">${esc(qt.company_qt)}</span>` : ''}
            ${qtCount > 1 ? `<div class="qt-nums">
                <div class="qt-num-item">
                    <div class="qt-num-val">${fNum(qt.saleAmt)} ฿</div>
                    <div class="qt-num-label">Sale</div>
                </div>
                <div class="qt-num-div"></div>
                <div class="qt-num-item">
                    <div class="qt-num-val ${qtStatus.cls}">${fNum(totAct)} ฿</div>
                    <div class="qt-num-label received">Actual</div>
                </div>
                ${qt.saleAmt > 0 && totAct > 0 ? `<span class="qt-pct-badge ${qtStatus.cls}">${(totAct/qt.saleAmt*100).toFixed(1)}%</span>` : ''}
            </div>` : ''}
            <i class="bi bi-chevron-down qt-chevron"></i>
        </div>
        <div class="qt-body" id="qtBody-${esc(qtId)}" style="${autoOpen ? 'display:block' : ''}">
            ${renderFinTable(qt.finRows, qtId, qt.qt_number, qt.saleAmt)}
        </div>
    </div>`;
}

function renderFinTable(finRows, qtId, qtNumber, saleAmt) {
    _qtFinRows.set(qtId, finRows);
    return _buildFinTable(finRows, [], qtId, qtNumber, saleAmt);
}

function _buildFinTable(dbRows, pendingRows, qtId, qtNumber, saleAmt) {
    const canEdit = canFinance('edit');
    const allRows = [...dbRows, ...pendingRows];
    const showSub = allRows.length >= 2;

    const addBtn = canEdit
        ? `<div class="fin-add-row"><button class="btn-add-sub" onclick="addSubRow('${esc(qtId)}','${esc(qtNumber||qtId)}',${saleAmt||0})"><i class="bi bi-plus"></i> Add Sub</button></div>`
        : '';

    if (!allRows.length) return `<div class="fin-empty-sub">${addBtn}</div>`;

    const rowsHtml = allRows.map(r => renderFinRow(r, canEdit, showSub, allRows.length)).join('');

    return `
    <div class="fin-table-wrap">
        <table class="fin-table">
            <colgroup>
                <col style="width:36px">
                ${showSub ? '<col style="width:175px">' : ''}
                <col style="width:135px">
                <col style="width:115px">
                <col style="width:280px">
                <col style="width:125px">
                <col style="width:120px">
                <col style="width:125px">
                <col style="width:155px">
                ${canEdit ? '<col style="width:38px">' : ''}
            </colgroup>
            <thead class="fin-thead">
                <tr>
                    <th>#</th>
                    ${showSub ? '<th>QT Sub</th>' : ''}
                    <th>Invoice</th>
                    <th class="col-num">Actual Amount</th>
                    <th>Detail</th>
                    <th>Bill Date</th>
                    <th>Receipt No</th>
                    <th>Receipt Date</th>
                    <th>Remark</th>
                    ${canEdit ? '<th></th>' : ''}
                </tr>
            </thead>
            <tbody id="finBody-${esc(qtId)}">
                ${rowsHtml}
            </tbody>
        </table>
        ${addBtn}
    </div>`;
}

function renderFinRow(r, canEdit, showSub, totalRows) {
    const isNew = !!r._tempId;
    const id    = isNew ? r._tempId : r.id;
    const ro    = canEdit ? '' : ' readonly';
    const attr  = isNew ? `data-temp-id="${esc(id)}"` : `data-fin-id="${esc(id)}"`;

    const on = (field, extra) => {
        const val = extra || 'this.value';
        return isNew
            ? `oninput="trackNewChange('${esc(id)}','${field}',${val})"`
            : `onchange="trackChange('${esc(id)}','${field}',${val})"`;
    };

    const delBtn = !canEdit ? '' : isNew
        ? `<td class="fin-td-del"><button class="btn-del-row" onclick="cancelNewRow('${esc(id)}',this.closest('tr'))"><i class="bi bi-x"></i></button></td>`
        : (totalRows > 1 ? `<td class="fin-td-del"><button class="btn-del-row" onclick="deleteSubRow('${esc(id)}',this)" title="Delete"><i class="bi bi-trash3"></i></button></td>` : '<td class="fin-td-del"></td>');

    return `
    <tr class="fin-tr${isNew ? ' is-new' : ''}" ${attr}>
        <td class="fin-td-idx">${r.sub_index}</td>
        ${showSub ? `<td class="fin-td"><input class="fin-input" type="text" value="${esc(r.quotation_sub||'')}" placeholder="—" ${ro} ${on('quotation_sub')}></td>` : ''}
        <td class="fin-td"><input class="fin-input" type="text" value="${esc(r.invoice||'')}" placeholder="—" ${ro} ${on('invoice')}></td>
        <td class="fin-td"><input class="fin-input" type="text" value="${fmtAmt(r.actual_amount)}" placeholder="0" inputmode="decimal" ${ro} ${on('actual_amount','parseAmt(this.value)')} onblur="this.value=fmtAmt(parseAmt(this.value))" style="text-align:right"></td>
        <td class="fin-td"><textarea class="fin-input fin-textarea" placeholder="—" ${ro} ${on('detail')}>${esc(r.detail||'')}</textarea></td>
        <td class="fin-td"><input class="fin-input" type="date" value="${r.bill_date||''}" ${ro} ${on('bill_date','this.value||null')}></td>
        <td class="fin-td"><input class="fin-input" type="text" value="${esc(r.receipt_no||'')}" placeholder="—" ${ro} ${on('receipt_no')}></td>
        <td class="fin-td"><input class="fin-input" type="date" value="${r.receipt_date||''}" ${ro} ${on('receipt_date','this.value||null')}></td>
        <td class="fin-td"><input class="fin-input" type="text" value="${esc(r.remark||'')}" placeholder="—" ${ro} ${on('remark')}></td>
        ${delBtn}
    </tr>`;
}

// Bill Date/Receipt Date cells -> the shared day-picker (system/date-picker.js),
// same treatment as every other type="date" field on the platform. Called
// after every fin-table render (both the full right-panel render and
// addSubRow's partial <tbody> patch) — safe to call on already-converted
// rows too, since the [type="date"] selector naturally stops matching an
// input the moment attachDatePicker() flips it to type="hidden".
// No onChange passed: the row's existing inline onchange/oninput attribute
// (trackChange/trackNewChange, written directly into the <input> markup
// above) still fires normally, because attachDatePicker() dispatches real
// 'change'/'input' events on that same original element.
// Read-only tables (view-only permission) are left as plain native
// <input type="date" readonly> — same fallback used everywhere else.
function enhanceFinDateInputs(container) {
    if (!canFinance('edit')) return;
    container.querySelectorAll('.fin-input[type="date"]').forEach(inp => attachDatePicker(inp));
}

// Single unified path — no separate "first split" vs "append" branches.
// Previously the two diverged (the "split" branch hardcoded sub_index=2
// and did a full re-render using only the single newest pending row,
// while "append" incrementally added a <tr> and patched the button's
// onclick with a fresh index). That divergence is what caused Add Sub to
// only ever work once per save: after the first click, _qtFinRows (a
// snapshot of DB-persisted rows only) still showed just 1 row, so a
// second click before saving re-entered the "split" branch again —
// silently dropping the previously-added pending row from the DOM (the
// save bar's count still included it, since it was never removed from
// _pendingNew, just no longer rendered) and re-using sub_index 2 a
// second time. Computing everything fresh from existingRows + this QT's
// *other pending* rows, and always fully re-rendering that combined set,
// removes the divergence entirely — Add Sub can be clicked any number of
// times before saving.
function addSubRow(qtId, qtNumber, saleAmt) {
    if (!canFinance('edit')) return;

    const existingRows = _qtFinRows.get(qtId) || [];
    const pendingForQt = _pendingNew.filter(r => r.qt_id === qtId);
    const allRows = [...existingRows, ...pendingForQt];
    const nextIdx = allRows.length ? Math.max(...allRows.map(r => r.sub_index || 0)) + 1 : 1;

    // quotation_sub left blank — user fills in whatever sub-label makes
    // sense, no auto-generated "-01"/"-02" suffix forced on them.
    const newRow = {
        _tempId: `new-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,
        qt_id: qtId, sub_index: nextIdx, quotation_sub: null,
        invoice: null, actual_amount: null, detail: null, bill_date: null,
        receipt_no: null, receipt_date: null, remark: null
    };
    _pendingNew.push(newRow);

    const qtBody = document.getElementById(`qtBody-${qtId}`);
    if (qtBody) {
        qtBody.innerHTML = _buildFinTable(existingRows, [...pendingForQt, newRow], qtId, qtNumber, saleAmt);
        syncTextareaHeights(qtBody);
        enhanceFinDateInputs(qtBody);
        const newRowEls = qtBody.querySelectorAll('.is-new');
        newRowEls[newRowEls.length - 1]?.querySelector('input')?.focus();
    }
    updateSaveBar();
}

function cancelNewRow(tempId, tr) {
    _pendingNew = _pendingNew.filter(r => r._tempId !== tempId);
    tr.remove();
    updateSaveBar();
}

async function deleteSubRow(id, btn) {
    const { isConfirmed } = await Swal.fire({ title: 'Delete this row?', icon: 'warning', showCancelButton: true, confirmButtonText: 'Delete', confirmButtonColor: '#ef4444', cancelButtonText: 'Cancel' });
    if (!isConfirmed) return;
    _pendingDel.add(id);
    const tr = document.querySelector(`[data-fin-id="${id}"]`);
    if (tr) { tr.style.opacity = '0.3'; tr.style.pointerEvents = 'none'; }
    updateSaveBar();
}

async function saveChanges() {
    try {
        // Delete
        for (const id of _pendingDel) {
            const { error } = await supabaseClient.from('b_finance_qt').delete().eq('id', id);
            if (error) throw error;
        }

        // Insert new — skip rows added via Add Sub but never actually
        // filled in (every editable field still at its blank default),
        // so clicking Add Sub several times and only using some of them
        // doesn't leave empty junk rows in the database.
        const FIN_FIELDS = ['quotation_sub','invoice','actual_amount','detail','bill_date','receipt_no','receipt_date','remark'];
        const isBlankRow = r => FIN_FIELDS.every(f => r[f] === null || r[f] === undefined || r[f] === '');
        const inserts = _pendingNew.filter(r => !isBlankRow(r)).map(r => { const { _tempId, ...clean } = r; return clean; });
        if (inserts.length) {
            const { error } = await supabaseClient.from('b_finance_qt').insert(inserts);
            if (error) throw error;
        }

        // Update changed
        for (const [id, changes] of _changes) {
            const { error } = await supabaseClient.from('b_finance_qt').update(changes).eq('id', id);
            if (error) throw error;
        }

        _changes.clear(); _pendingNew = []; _pendingDel.clear(); updateSaveBar();
        notify('success', 'Saved successfully');
        await loadRightPanel(_selectedAccId);
        return true;
    } catch (err) {
        notify('', err.message || 'Save failed', 'error');
        return false;
    }
}

async function discardChanges() {
    _changes.clear(); _pendingNew = []; _pendingDel.clear(); updateSaveBar();
    if (_selectedAccId) await loadRightPanel(_selectedAccId);
}

// ── Init ───────────────────────────────────────────────────────────────────
async function initPage() {
    sessionStorage.removeItem('bx_perms_bfinance');
    await initLayout(B_FINANCE_CONFIG);
    if (!canFinance('view')) { window.location.replace('/index.html'); return; }
    initFinanceFilters();
    await loadLeftPanel();
}

initPage().catch(e => {
    console.error('[Finance] initPage failed:', e);
    const tree = document.getElementById('acctTree');
    if (tree) tree.innerHTML = `<div style="padding:16px;color:#ef4444;font-size:0.75rem">Init Error: ${e.message}</div>`;
});
</script>
