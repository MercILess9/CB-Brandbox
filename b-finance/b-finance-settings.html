<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>B-FINANCE | Setting</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/system/config.js"></script>
    <script src="/system/system.js"></script>
    <script src="b-finance.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/system/theme.css">
    <link rel="stylesheet" href="b-finance.css">
    <style>
        /* Cross-document View Transitions — clicking the Setting/Member tab
           (a real <a href> navigation between two separate pages, not a JS
           tab switch) crossfades the old/new page instead of a hard flash.
           Needs the same declaration on both pages of the pair to engage;
           no-ops silently in browsers that don't support it yet. */
        @view-transition {
            navigation: auto;
        }
    </style>
</head>
<body>

<div class="settings-wrapper">
    <div class="page-header">
        <h1><i class="bi bi-gear-fill me-2" style="color:var(--c-accent)"></i>B-FINANCE Setting</h1>
    </div>

    <div class="settings-tabnav">
        <a href="b-finance-settings.html" class="settings-tab active"><i class="bi bi-gear-fill"></i> Setting</a>
        <a href="b-finance-members.html" class="settings-tab"><i class="bi bi-people-fill"></i> Member</a>
    </div>

    <div class="section">
        <div class="section-header">
            <div class="section-title"><i class="bi bi-sliders"></i> Configuration</div>
        </div>
        <div class="section-body">
            <div class="settings-empty">
                <i class="bi bi-gear"></i>
                <p>No configurable settings yet for B-Finance.</p>
            </div>
        </div>
    </div>
</div>

<script>
    async function initPage() {
        sessionStorage.removeItem('bx_perms_bfinance');
        await initLayout(B_FINANCE_CONFIG);
        if (!canFinance('setting')) { window.location.replace('b-finance-list.html'); return; }
    }

    initPage();
</script>
</body>
</html>
