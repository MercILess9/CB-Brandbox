<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>B-ACCOUNT | Opportunity View</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="/system/config.js"></script>
    <script src="/system/system.js"></script>
    <script src="b-account.js"></script>
    <link rel="stylesheet" href="/system/theme.css">
    <link rel="stylesheet" href="b-account.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #eef1f5; padding-bottom: 60px; }

        /* ── Toolbar (screen only) ── */
        .ov-toolbar { background: #fff; padding: 12px 20px; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 90; display: flex; justify-content: center; }
        .ov-toolbar-inner { width: 210mm; max-width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .ov-id { font-size: 0.8rem; font-weight: 700; color: #64748b; }
        .ov-toolbar-actions { display: flex; gap: 8px; }
        .ov-tb-btn { display: inline-flex; align-items: center; gap: 7px; border: 1.5px solid #e2e8f0; background: #fff; color: var(--c-slate); border-radius: 10px; padding: 8px 16px; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: 0.15s; font-family: inherit; }
        .ov-tb-btn:hover { border-color: #cbd5e1; background: var(--c-bg); }
        .ov-tb-btn:disabled { opacity: 0.5; cursor: wait; }
        .ov-tb-btn.primary { border: none; background: var(--c-dark); color: #fff; }
        .ov-tb-btn.primary:hover { background: #0f172a; }

        /* ── Page ── */
        .a4-page { width: 210mm; min-height: 297mm; margin: 24px auto; background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 14mm 16mm; box-sizing: border-box; border-top: 6px solid var(--c-accent); }

        /* ── Header ── */
        .ov-logo-row { display: flex; justify-content: flex-end; margin-bottom: 12px; }
        .ov-logo { height: 22px; }
        .ov-head { display: grid; grid-template-columns: 1.7fr 1fr; gap: 26px; align-items: start; border-bottom: 2px solid #eef2f7; padding-bottom: 22px; margin-bottom: 22px; }
        .ov-badge-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        .ov-id-text { font-size: 0.76rem; font-weight: 700; color: #94a3b8; letter-spacing: 0.2px; }
        .ov-type-badge { font-size: 0.64rem; font-weight: 800; border-radius: 20px; padding: 4px 11px; text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; }
        .ov-type-badge.retention { background: #f5f3ff; color: #6d28d9; }
        .ov-type-badge.new-biz   { background: #eff6ff; color: #1d4ed8; }
        .ov-type-badge.upsale    { background: #f0fdfa; color: #0d7a70; }
        .ov-status-badge { font-size: 0.64rem; font-weight: 800; border-radius: 20px; padding: 4px 11px; text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; background: #f0fdf4; color: #15803d; }
        .ov-status-badge.churn  { background: #fff7ed; color: #c2410c; }
        .ov-status-badge.ended  { background: #f1f5f9; color: #475569; }

        .ov-opp-name { font-size: 1.4rem; font-weight: 700; color: var(--c-text-main); line-height: 1.3; letter-spacing: -0.2px; margin-bottom: 16px; }
        .ov-client-lbl { font-size: 0.58rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; color: #94a3b8; margin-bottom: 4px; }
        .ov-client-val { font-size: 0.86rem; font-weight: 600; color: #475569; }

        .ov-pill { display: inline-flex; align-items: center; border: 1px solid #eef2f7; background: #fff; border-radius: 20px; overflow: hidden; font-size: 0.74rem; }
        .ov-pill-tag { padding: 5px 10px; color: #94a3b8; font-size: 0.56rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; border-right: 1px solid #eef2f7; white-space: nowrap; }
        .ov-pill-val { padding: 5px 12px; font-weight: 700; color: #334155; white-space: nowrap; }

        /* ── Summary card ── */
        .ov-sum-card { background: #fafbfc; border: 1px solid #eef2f7; border-left: 3px solid var(--c-accent); border-radius: 12px; padding: 18px 22px; box-shadow: 0 1px 4px rgba(15,23,42,0.04); }
        .ov-sum-lbl { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: #94a3b8; }
        .ov-sum-val { font-size: 1.4rem; font-weight: 800; color: var(--c-text-main); letter-spacing: -0.3px; margin-top: 5px; }
        .ov-sum-val.gp { color: #16a34a; margin-bottom: 8px; }
        .ov-sum-divider { height: 1px; background: #eef2f7; margin: 14px 0; }
        .ov-sum-gp-row { display: flex; justify-content: space-between; align-items: baseline; }
        .ov-sum-gp-pct { font-size: 0.76rem; font-weight: 800; color: #16a34a; }
        .ov-sum-bar-wrap { height: 4px; background: #e2e8f0; border-radius: 99px; overflow: hidden; }
        .ov-sum-bar-fill { height: 100%; background: #16a34a; border-radius: 99px; }

        /* ── Section title (shared: Detail / Quotations) ── */
        .ov-section-title { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; color: #94a3b8; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }

        /* ── Info grid ── */
        .ov-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .ov-info-col { display: flex; flex-direction: column; gap: 8px; background: #fafbfc; border: 1px solid #eef2f7; border-left: 3px solid var(--c-accent); border-radius: 12px; padding: 12px 16px; box-shadow: 0 1px 4px rgba(15,23,42,0.04); }
        .ov-info-row { display: flex; align-items: baseline; gap: 8px; font-size: 0.82rem; }
        .ov-info-lbl { display: inline-flex; align-items: center; gap: 5px; font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; color: #94a3b8; min-width: 84px; flex-shrink: 0; }
        .ov-info-val { font-weight: 700; color: #334155; }
        .ov-info-val.nil { color: #cbd5e1; font-weight: 400; }

        .ov-remark-box { background: #fafbfc; border: 1px solid #eef2f7; border-left: 3px solid var(--c-accent); border-radius: 12px; padding: 12px 16px; margin-bottom: 18px; box-shadow: 0 1px 4px rgba(15,23,42,0.04); }
        .ov-remark-lbl { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; color: #94a3b8; margin-bottom: 6px; }
        .ov-remark-val { font-size: 0.82rem; color: #334155; line-height: 1.6; white-space: pre-line; }

        .ov-links-row { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
        .ov-link-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--c-border); background: #fff; border-radius: 10px; padding: 7px 14px; font-size: 0.78rem; font-weight: 700; color: var(--c-slate); text-decoration: none; }
        .ov-link-btn.disabled { opacity: 1; pointer-events: none; border: 1px dashed #d1d5db; background: #f8fafc; color: #cbd5e1; }

        /* ── QT section ── */
        .ov-qt-card { border: 1px solid #e2e8f0; border-left: 4px solid var(--c-accent); border-radius: 12px; margin-bottom: 12px; overflow: hidden; break-inside: avoid; page-break-inside: avoid; }
        .ov-qt-card:last-child { margin-bottom: 0; }
        .ov-qt-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #f0f1f9; border-bottom: 2px solid #e2e8f0; }
        .ov-qt-num { font-size: 0.82rem; font-weight: 800; color: var(--c-text-main); }
        .ov-qt-totals { margin-left: auto; display: flex; gap: 14px; }
        .ov-qt-stat { display: flex; flex-direction: column; align-items: flex-end; }
        .ov-qt-stat-val { font-size: 0.82rem; font-weight: 800; color: var(--c-text-main); }
        .ov-qt-stat-val.gp { color: #16a34a; }
        .ov-qt-stat-lbl { font-size: 0.55rem; font-weight: 700; text-transform: uppercase; color: #94a3b8; }
        .ov-qt-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        .ov-qt-table th { padding: 7px 10px; text-align: left; font-size: 0.58rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: #94a3b8; background: #f8fafc; border-bottom: 1px solid #f1f5f9; }
        .ov-qt-table th.r, .ov-qt-table td.r { text-align: right; }
        .ov-qt-table th.c, .ov-qt-table td.c { text-align: center; }
        .ov-qt-table td { padding: 7px 10px; color: #334155; border-bottom: 1px solid #f8fafc; }
        .ov-qt-table tr:last-child td { border-bottom: none; }
        .ov-qt-empty { padding: 18px; text-align: center; color: #cbd5e1; font-size: 0.8rem; }

        /* ── Churn / Sign groups ── */
        .ov-churn-wrap, .ov-sign-wrap { border-radius: 14px; padding: 20px 16px 8px; position: relative; margin-bottom: 16px; break-inside: avoid; page-break-inside: avoid; }
        .ov-churn-wrap { border: 1.5px solid rgba(249,115,22,0.5); background: rgba(249,115,22,0.03); }
        .ov-churn-wrap .ov-qt-card { border-left-color: #f97316; }
        .ov-sign-wrap { border: 1px solid #e2e8f0; }
        .ov-churn-label, .ov-sign-label, .ov-churn-date-badge { position: absolute; top: -9px; background: #fff; padding: 0 8px; font-size: 0.64rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
        .ov-churn-label { left: 14px; color: #f97316; }
        .ov-sign-label  { left: 14px; color: #94a3b8; }
        .ov-churn-date-badge { right: 14px; color: #c2410c; font-weight: 700; }

        .ov-footer { margin-top: 24px; padding-top: 10px; border-top: 1px solid #f1f5f9; font-size: 0.65rem; color: #cbd5e1; text-align: center; }

        .ov-error { text-align: center; padding: 100px 20px; color: #94a3b8; }
        .ov-error i { font-size: 2.4rem; display: block; margin-bottom: 12px; }

        /* ── Print ── */
        @media print {
            @page { size: A4; margin: 12mm 14mm; }
            body { background: #fff; padding-bottom: 0; }
            .ov-toolbar { display: none !important; }
            .a4-page { width: auto; min-height: 0; margin: 0; box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>

<div class="ov-toolbar no-print">
    <div class="ov-toolbar-inner">
        <span class="ov-id" id="ov-toolbar-id"></span>
        <div class="ov-toolbar-actions">
            <button class="ov-tb-btn" id="ov-btn-share" onclick="shareLink()"><i class="bi bi-share-fill"></i> Share</button>
            <button class="ov-tb-btn" id="ov-btn-image" onclick="downloadImage()"><i class="bi bi-file-earmark-image-fill"></i> Save Image</button>
            <button class="ov-tb-btn primary" onclick="window.print()"><i class="bi bi-printer-fill"></i> Print / PDF</button>
        </div>
    </div>
</div>

<div id="ov-root"></div>

<script>
    let _oppId = null;

    document.getElementById('ov-root').innerHTML = (typeof bxLoader === 'function') ? bxLoader('Loading...') : 'Loading...';

    async function shareLink() {
        try {
            await navigator.clipboard.writeText(window.location.href);
            notify('', 'Copied link to clipboard', 'success');
        } catch {
            notify('', 'Could not copy link', 'error');
        }
    }

    async function downloadImage() {
        const btn = document.getElementById('ov-btn-image');
        const target = document.querySelector('.a4-page');
        if (!target) return;
        btn.disabled = true;
        btn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Rendering...';
        try {
            const canvas = await html2canvas(target, { useCORS: true, scale: 2, backgroundColor: '#ffffff' });
            const link = document.createElement('a');
            link.download = `${_oppId || 'opportunity'}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
        } catch {
            notify('', 'Could not generate image', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-file-earmark-image-fill"></i> Save Image';
        }
    }

    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    function fmtDate(d) {
        if (!d) return '—';
        const [yr, mo, dy] = String(d).substring(0, 10).split('-');
        return `${+dy} ${MONTHS[+mo - 1]} ${+yr}`;
    }
    function fmtGP(n) { return n != null && !isNaN(+n) ? fmtMoney(n) + ' ฿' : '—'; }
    function typeClass(t) {
        if (t === 'Retention')    return 'retention';
        if (t === 'New Business') return 'new-biz';
        if (t === 'Up Sale')      return 'upsale';
        return '';
    }
    function statusClass(status) {
        if (status === 'Churn')       return ' churn';
        if (status === 'End Contact') return ' ended';
        return '';
    }

    function row(icon, lbl, val) {
        return `<div class="ov-info-row"><span class="ov-info-lbl"><i class="bi ${icon}"></i>${lbl}</span><span class="ov-info-val${val ? '' : ' nil'}">${val ? esc(val) : '—'}</span></div>`;
    }

    function linkBtn(icon, label, url) {
        const href = safeLink(url);
        return `<a href="${href}" target="_blank" rel="noopener" class="ov-link-btn${href === '#' ? ' disabled' : ''}"><i class="bi ${icon}"></i>${label}</a>`;
    }

    function renderQT(qt) {
        const items  = (qt.b_opportunity_qt_item || []).sort((a, b) => (a.no || 0) - (b.no || 0));
        const totAmt = items.reduce((s, i) => s + (+i.amount || 0), 0);
        const totGP  = items.reduce((s, i) => s + (+i.gp  || 0), 0);
        const rows   = items.length
            ? items.map(i => `<tr>
                <td class="r">${i.no ?? ''}</td>
                <td class="c">${esc(i.bu || '')}</td>
                <td>${esc(i.detail || '')}</td>
                <td class="r">${i.qty ?? ''}</td>
                <td class="r">${i.price != null ? fmtNum(i.price) : ''}</td>
                <td class="r">${+i.discount ? fmtNum(i.discount) : '—'}</td>
                <td class="r">${i.amount != null ? fmtNum(i.amount) : ''}</td>
                <td class="r">${i.gp != null && i.gp !== 0 ? fmtNum(i.gp) : '—'}</td>
            </tr>`).join('')
            : `<tr><td colspan="8" class="ov-qt-empty">No items</td></tr>`;
        return `<div class="ov-qt-card">
            <div class="ov-qt-head">
                <span class="ov-qt-num">${esc(qt.qt_number || qt.qt_id)}</span>
                <div class="ov-qt-totals">
                    <div class="ov-qt-stat"><span class="ov-qt-stat-val">${fmtNum(totAmt)}</span><span class="ov-qt-stat-lbl">Amount</span></div>
                    <div class="ov-qt-stat"><span class="ov-qt-stat-val gp">${fmtNum(totGP)}</span><span class="ov-qt-stat-lbl">GP</span></div>
                </div>
            </div>
            <table class="ov-qt-table">
                <thead><tr>
                    <th class="r" style="width:36px">No.</th>
                    <th class="c" style="width:60px">BU</th>
                    <th>Detail</th>
                    <th class="r" style="width:44px">Qty</th>
                    <th class="r" style="width:90px">Price</th>
                    <th class="r" style="width:90px">Discount</th>
                    <th class="r" style="width:96px">Amount</th>
                    <th class="r" style="width:90px">GP</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;
    }

    function renderQTSection(o, qts) {
        const churnQTs = qts.filter(q => q.qt_type === 'churn');
        const signQTs  = qts.filter(q => q.qt_type !== 'churn');

        if (!churnQTs.length) {
            return qts.length ? qts.map(renderQT).join('') : '<div class="ov-qt-empty">No quotations</div>';
        }

        return `
            <div class="ov-churn-wrap">
                <span class="ov-churn-label">Churn</span>
                ${o.churn_date ? `<span class="ov-churn-date-badge">Churn Date: ${fmtDate(o.churn_date)}</span>` : ''}
                ${churnQTs.map(renderQT).join('')}
            </div>
            <div class="ov-sign-wrap">
                <span class="ov-sign-label">Sign</span>
                ${signQTs.length ? signQTs.map(renderQT).join('') : '<div class="ov-qt-empty">No sign quotations</div>'}
            </div>`;
    }

    function renderPage(o, qts) {
        const sub = o._company_name
            ? `${esc(o._account_name)} <span style="color:#e2e8f0">|</span> ${esc(o._company_name)}`
            : esc(o._account_name);
        const pct = gpPct(o.total_gp, o.total_amount);

        _oppId = o.opportunity_id;
        document.getElementById('ov-toolbar-id').textContent = o.opportunity_id;
        document.title = `${o.opportunity_id} | ${o.opportunity_name || ''}`;

        const pctNum = o.total_amount > 0 && o.total_gp > 0 ? Math.min(+o.total_gp / +o.total_amount * 100, 100).toFixed(1) : 0;

        document.getElementById('ov-root').innerHTML = `
        <div class="a4-page">
            <div class="ov-logo-row">
                <img src="${LOGO_URL}" class="ov-logo" onerror="this.style.display='none'">
            </div>

            <div class="ov-head">
                <div>
                    <div class="ov-badge-row">
                        ${o.business_type ? `<span class="ov-type-badge ${typeClass(o.business_type)}">${esc(o.business_type)}</span>` : ''}
                        <span class="ov-id-text">#${esc(o.opportunity_id)}</span>
                        <span class="ov-status-badge${statusClass(o.status)}">${esc(o.status || '')}</span>
                    </div>
                    <div class="ov-opp-name">${esc(o.opportunity_name || '')}</div>
                    <div class="ov-client-lbl">Client / Company</div>
                    <div class="ov-client-val">${sub}</div>
                </div>
                <div class="ov-sum-card">
                    <div class="ov-sum-lbl">Total Quotation Amount</div>
                    <div class="ov-sum-val">${fmtAmt(o.total_amount)}</div>
                    <div class="ov-sum-divider"></div>
                    <div class="ov-sum-gp-row">
                        <span class="ov-sum-lbl">Project GP</span>
                        ${pct ? `<span class="ov-sum-gp-pct">${pct}</span>` : ''}
                    </div>
                    <div class="ov-sum-val gp">${fmtGP(o.total_gp)}</div>
                    <div class="ov-sum-bar-wrap"><div class="ov-sum-bar-fill" style="width:${pctNum}%"></div></div>
                </div>
            </div>

            <div class="ov-section-title"><i class="bi bi-info-circle"></i> Detail</div>
            <div class="ov-info-grid">
                <div class="ov-info-col">
                    ${row('bi-person-fill', 'Owner', o.owner)}
                    ${row('bi-person-badge', 'AM', o.am)}
                    ${row('bi-person', 'Sub AM', o.sub_am)}
                    ${row('bi-signpost-split', 'Lead', o.lead_source)}
                </div>
                <div class="ov-info-col">
                    ${row('bi-person-plus', 'Create By', o.create_by)}
                    ${row('bi-calendar-plus', 'Create Date', o.create_date ? fmtDate(o.create_date) : null)}
                    ${row('bi-calendar-check', 'Signed', o.signed_date ? fmtDate(o.signed_date) : null)}
                    ${row('bi-rocket-takeoff', 'Launch', o.launch_date ? fmtDate(o.launch_date) : null)}
                    ${o.churn_date ? row('bi-calendar-x', 'Churn Date', fmtDate(o.churn_date)) : ''}
                </div>
            </div>

            <div class="ov-remark-box">
                <div class="ov-remark-lbl">Remark</div>
                <div class="ov-remark-val">${o.remark ? esc(o.remark) : '<span style="color:#cbd5e1">No remark</span>'}</div>
            </div>

            <div class="ov-links-row">
                ${linkBtn('bi-cloud-fill', 'Materials', o.materials)}
                ${linkBtn('bi-file-earmark-text-fill', 'Proposal', o.proposal)}
                ${linkBtn('bi-megaphone-fill', 'Campaign', o.campaign)}
            </div>

            <div class="ov-section-title"><i class="bi bi-file-earmark-text"></i> Quotations</div>
            ${renderQTSection(o, qts)}

            <div class="ov-footer">Generated from Brandbox X Portal — ${esc(o.opportunity_id)}</div>
        </div>`;
    }

    function renderError(msg) {
        document.getElementById('ov-root').innerHTML = `<div class="ov-error"><i class="bi bi-exclamation-triangle"></i>${esc(msg)}</div>`;
    }

    async function loadOpportunity() {
        const id = new URLSearchParams(window.location.search).get('id');
        if (!id) { renderError('Missing opportunity id'); return; }

        const { data: o, error } = await supabaseClient
            .from('b_opportunity_list')
            .select('*')
            .eq('opportunity_id', id)
            .single();
        if (error || !o) { renderError('Opportunity not found'); return; }

        if (o.account_id) {
            const { data: acc } = await supabaseClient
                .from('b_account_list')
                .select('account_name, company_name')
                .eq('account_id', o.account_id)
                .single();
            o._account_name = acc?.account_name || o.account_id;
            o._company_name = acc?.company_name || '';
        } else {
            o._account_name = '';
            o._company_name = '';
        }

        const { data: qts } = await supabaseClient
            .from('b_opportunity_qt')
            .select('*, b_opportunity_qt_item(*)')
            .eq('opportunity_id', id)
            .order('qt_number');

        renderPage(o, qts || []);
    }

    async function initPage() {
        await initAuthGuard();
        await loadOpportunity();
    }

    initPage();
</script>
</body>
</html>
