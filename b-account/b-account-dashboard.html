// ── Monthly Trend ─────────────────────────────────────────────────────────────
// Always plots Jan-Dec of a calendar year (zero-filled), never a rolling
// window and never narrowed by data presence. One selected year → that
// year's 12 months; 2+ selected years → their Jan-Dec ranges chained in
// order for a multi-year overview; none selected → the current year.
function trend12MonthKeys() {
    const years = _yearFilters.size ? [..._yearFilters].sort((a, b) => a - b) : [new Date().getFullYear()];
    const keys = [];
    years.forEach(year => {
        for (let m = 1; m <= 12; m++) keys.push(`${year}-${String(m).padStart(2, '0')}`);
    });
    return keys;
}

// 'YYYY-MM' → 'Mon YY' — shared by the chart and the detail table below it
// so both read the exact same labels off the exact same keys.
function trendLabels(keys) {
    return keys.map(m => {
        const [y, mo] = m.split('-');
        return MONTHS[+mo - 1] + ' ' + y.slice(2);
    });
}

// Same "always the full year(s), zero-filled" philosophy as
// trend12MonthKeys, just bucketed by quarter instead of month.
function trend4QuarterKeys() {
    const years = _yearFilters.size ? [..._yearFilters].sort((a, b) => a - b) : [new Date().getFullYear()];
    const keys = [];
    years.forEach(year => {
        for (let q = 1; q <= 4; q++) keys.push(`${year}-Q${q}`);
    });
    return keys;
}

// 'YYYY-Q1' → 'Q1 YY'
function trendQuarterLabels(keys) {
    return keys.map(k => {
        const [y, q] = k.split('-');
        return q + ' ' + y.slice(2);
    });
}

function monthKeyToQuarterKey(monthKey) {
    const [y, m] = monthKey.split('-');
    return `${y}-Q${Math.ceil(+m / 3)}`;
}

// month -> {amt,gp,opps,accounts} rolled up into their quarter —
// computeTrendMonthMap itself stays month-keyed always; this is purely a
// display-time regroup, so the underlying data-scan logic never has to
// know about granularity. amt/gp sum normally; opps/accounts UNION their
// Sets instead (see computeTrendMonthMap's comment for why a straight sum
// would double-count).
function aggregateToQuarters(monthMap) {
    const out = new Map();
    for (const [month, rec] of monthMap) {
        const qKey = monthKeyToQuarterKey(month);
        if (!out.has(qKey)) out.set(qKey, { amt: 0, gp: 0, opps: new Set(), accounts: new Set() });
        const q = out.get(qKey);
        q.amt += rec.amt;
        q.gp  += rec.gp;
        for (const id of rec.opps) q.opps.add(id);
        for (const id of rec.accounts) q.accounts.add(id);
    }
    return out;
}

// Same regroup as aggregateToQuarters, one level deeper (month -> BU -> {amt,gp}).
function aggregateBUToQuarters(buMonthMap) {
    const out = new Map();
    for (const [month, byBu] of buMonthMap) {
        const qKey = monthKeyToQuarterKey(month);
        if (!out.has(qKey)) out.set(qKey, new Map());
        const qByBu = out.get(qKey);
        for (const [bu, rec] of byBu) {
            if (!qByBu.has(bu)) qByBu.set(bu, { amt: 0, gp: 0 });
            const q = qByBu.get(bu);
            q.amt += rec.amt;
            q.gp  += rec.gp;
        }
    }
    return out;
}

// Bundles everything that depends on the Month/Quarter toggle — keys,
// display labels, and a "hasn't happened yet" check — computed once per
// render and threaded through, instead of each render function re-deriving
// (and re-diverging) its own copy the way trend12MonthKeys/trendLabels/
// nowKey used to be recomputed separately in each of the 3 render/table
// functions below.
function trendAxis() {
    const isQuarter = _trendGranularity === 'quarter';
    const keys = isQuarter ? trend4QuarterKeys() : trend12MonthKeys();
    const labels = isQuarter ? trendQuarterLabels(keys) : trendLabels(keys);
    const now = new Date();
    const nowKey = isQuarter
        ? `${now.getFullYear()}-Q${Math.ceil((now.getMonth() + 1) / 3)}`
        : `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    return { keys, labels, isQuarter, isFuture: k => k > nowKey };
}

// ── Compare mode ─────────────────────────────────────────────────────────────
// Unlike every other trend mode (always the full year(s), independent of
// the top filter), Compare deliberately DOES respect the top Month filter
// — "which months" comes from _monthFilters as usual, "which years" comes
// from _compareYears, so picking Q1 up top + years {2025,2026} compares
// Jan-Mar 2025 vs Jan-Mar 2026, not full calendar years.
function compareMonthKeys() {
    return [...(_monthFilters.size ? _monthFilters : ytdMonths())].sort();
}
function monthNumToQuarter(m) { return 'Q' + Math.ceil(+m / 3); }

// keys/labels for the period axis (X-axis in Overview/BU compare, column
// groups in every compare Detail table) — quarters only include a quarter
// if at least one of its months is in the current selection.
function compareAxisKeys() {
    const months = compareMonthKeys();
    if (_trendGranularity !== 'quarter') {
        return { keys: months, labels: months.map(m => MONTHS[+m - 1]) };
    }
    const keys = [...new Set(months.map(monthNumToQuarter))].sort();
    return { keys, labels: keys };
}

// 'MM' → year → {amt, gp}
function computeCompareMonthMap(years) {
    const map = new Map();
    const months = new Set(compareMonthKeys());
    for (const opp of _opps) {
        const y = +(opp.signed_date || '').slice(0, 4);
        const m = (opp.signed_date || '').slice(5, 7);
        if (!years.has(y) || !months.has(m)) continue;
        const qts = _qtMap.get(opp.opportunity_id) || [];
        for (const qt of qts) {
            if (qt.qt_type === 'churn') continue;
            const items = (qt.b_opportunity_qt_item || []).filter(i => buPasses(i.bu || 'Other'));
            for (const item of items) {
                const amt = Math.max(0, (+(item.qty) || 0) * (+(item.price) || 0) - (+(item.discount) || 0));
                const gp  = +(item.gp) || 0;
                if (!map.has(m)) map.set(m, new Map());
                const byYear = map.get(m);
                if (!byYear.has(y)) byYear.set(y, { amt: 0, gp: 0 });
                byYear.get(y).amt += amt;
                byYear.get(y).gp  += gp;
            }
        }
    }
    return map;
}

// 'MM' → year → bu → {amt, gp} — same scope as computeCompareMonthMap, one
// level deeper for BU mode's stacked-per-year bars.
function computeCompareBUMap(years) {
    const map = new Map();
    const months = new Set(compareMonthKeys());
    for (const opp of _opps) {
        const y = +(opp.signed_date || '').slice(0, 4);
        const m = (opp.signed_date || '').slice(5, 7);
        if (!years.has(y) || !months.has(m)) continue;
        const qts = _qtMap.get(opp.opportunity_id) || [];
        for (const qt of qts) {

            const items = (qt.b_opportunity_qt_item || []).filter(i => buPasses(i.bu || 'Other'));
            for (const item of items) {
                const amt = Math.max(0, (+(item.qty) || 0) * (+(item.price) || 0) - (+(item.discount) || 0));
                const gp  = +(item.gp) || 0;
                const bu  = item.bu || 'Other';
                if (!map.has(m)) map.set(m, new Map());
                const byYear = map.get(m);
                if (!byYear.has(y)) byYear.set(y, new Map());
                const byBu = byYear.get(y);
                if (!byBu.has(bu)) byBu.set(bu, { amt: 0, gp: 0 });
                byBu.get(bu).amt += amt;
                byBu.get(bu).gp  += gp;
            }
        }
    }
    return map;
}

// owner → year → {amt, gp} — Sales Rep compare has no period axis (same
// snapshot nature as its non-compare mode, see computeTrendRepSnapshotMap),
// just one total per rep per selected year.
function computeCompareRepMap(years) {
    const map = new Map();
    const months = new Set(compareMonthKeys());
    for (const opp of _opps) {
        const y = +(opp.signed_date || '').slice(0, 4);
        const m = (opp.signed_date || '').slice(5, 7);
        if (!years.has(y) || !months.has(m)) continue;
        const owner = opp.owner || 'Unknown';

            for (const item of items) {

                byYear.get(y).amt += amt;
                byYear.get(y).gp  += gp;
            }
        }
    }
    return map;
}

function aggregateCompareToQuarters(monthMap) {
    const out = new Map();
    for (const [m, byYear] of monthMap) {
        const q = monthNumToQuarter(m);
        if (!out.has(q)) out.set(q, new Map());
        const qByYear = out.get(q);
        for (const [y, rec] of byYear) {

            qByYear.get(y).amt += rec.amt;

function aggregateCompareBUToQuarters(buMonthMap) {

// Computes each mode's month map exactly once per render cycle and hands it
// to both the chart and the detail table below — they used to each call
// computeTrendMonthMap()/computeTrendBUMap() independently, silently
// running the same full scan over _opps/_qtMap/items twice per render.
// Aggregation to quarters (when the Month/Quarter toggle is on Quarter)
// happens once here too, on top of the always-month-keyed compute — see
// trendAxis()/aggregateToQuarters().
function renderTrendChart() {
    // Keep all three toggles' active button in sync with state on every
    // render — not just when their own button is clicked. _trendGranularity
    // gets set from several other places now (range chips, the range
    // picker, Reset), and _trendChartType now rides along with it too (see
    // setTrendGranularityState) — without this, a toggle can freeze on a
    // stale button (e.g. still showing "Month"/"Line" active after a Q1
    // chip auto-switched to Quarter/Bar).
    document.querySelectorAll('#trendGranularityGroup .trend-type-btn').forEach(b => b.classList.toggle('active', b.dataset.g === _trendGranularity));
    document.querySelectorAll('#trendChartTypeGroup .trend-type-btn').forEach(b => b.classList.toggle('active', b.dataset.ct === _trendChartType));
    document.querySelectorAll('#trendBreakdownGroup .trend-mode-btn').forEach(b => b.classList.toggle('active', b.dataset.bd === _trendBreakdown));
    document.getElementById('trendCompareGroup').classList.toggle('active', _trendCompare);
    document.getElementById('trendCompareLabel').style.display = _trendCompare ? 'none' : '';
    repositionTrendBreakdownSlider();

    // Sales Rep mode has no time axis (see computeTrendRepSnapshotMap) —
    // the Month/Quarter toggle would have zero effect there, so hide it
    // rather than leave a control that looks live but silently does
    // nothing. The Trend Detail table stays visible in every mode, just
    // with a different shape for Sales Rep (see renderTrendRepTable).
    document.getElementById('trendGranularityGroup').style.display = _trendBreakdown === 'rep' ? 'none' : 'flex';
    // Compare is always bars (no meaningful "Compare line chart") — dimmed
    // in place rather than hidden, so nothing else in the row shifts when
    // Compare toggles on/off (see the HTML comment on #trendCompareGroup).
    document.getElementById('trendChartTypeGroup').classList.toggle('is-disabled', _trendCompare);
    document.getElementById('wrap-compareYears').style.display = _trendCompare ? 'flex' : 'none';

    if (_trendCompare) {
        renderTrendCompare();
        return;
    }

    renderTrendLegend();

    if (_trendBreakdown === 'rep') {
        const repMap = computeTrendRepSnapshotMap();
        const reps = [...repMap.keys()].sort((a, b) => repMap.get(b).amt - repMap.get(a).amt);
        renderTrendAmtGP(reps, reps.map(r => repMap.get(r).amt), reps.map(r => repMap.get(r).gp));
        const repYear = _yearFilters.size === 1 ? [..._yearFilters][0] : new Date().getFullYear();
        const repMonthKeys = [..._monthFilters].sort().map(mo => `${repYear}-${mo}`);
        renderTrendRepTable(reps, computeTrendRepMonthMap(), repMonthKeys);
        return;
    }

    const axis = trendAxis();
    if (_trendBreakdown === 'bu') {
        let buMonthMap = computeTrendBUMap();
        if (axis.isQuarter) buMonthMap = aggregateBUToQuarters(buMonthMap);
        renderTrendByBU(buMonthMap, axis);
        renderTrendRawTable('bu', buMonthMap, axis);
    } else {
        let monthMap = computeTrendMonthMap();
        if (axis.isQuarter) monthMap = aggregateToQuarters(monthMap);
        const { keys, labels, isFuture } = axis;
        const amts = keys.map(m => isFuture(m) ? null : (monthMap.get(m)?.amt ?? 0));
        const gps  = keys.map(m => isFuture(m) ? null : (monthMap.get(m)?.gp ?? 0));
        renderTrendAmtGP(labels, amts, gps);
        renderTrendRawTable('amtgp', monthMap, axis);
    }
}

// Custom HTML legend living in the section header (next to the mode
// toggle) — replaces Chart.js's own built-in legend so both can share one
// row. Shown in every mode now, always the same click-to-toggle behavior
// (toggleTrendSeries by dataset index) regardless of what the datasets
// actually are — this is a LOCAL, chart-only visibility toggle (declutter
// this one chart), separate from the top Filter Bar's BU chips (a real
// data filter affecting the whole dashboard, not just this chart) — same
// relationship the Amount/GP legend already had to any other filter.
// BU mode gets a colored dot per active BU; Overview AND Sales Rep mode
// both fall back to the plain Amount/GP legend — Sales Rep isn't grouped
// by category the way BU is, it's the same two series (Amount, GP) just
// snapshotted per rep instead of per month.
function renderTrendLegend() {
    const el = document.getElementById('trendLegend');
    if (_trendBreakdown === 'bu') {
        const activeBUs = _cfgBU.filter(bu => buPasses(bu));
        el.innerHTML = activeBUs.map((bu, i) =>
            `<span class="trend-legend-item" onclick="toggleTrendSeries(${i}, this)"><span class="trend-legend-dot" style="background:${buColor(bu)}"></span>${esc(bu)}</span>`
        ).join('');
    } else {
        el.innerHTML = `
            <span class="trend-legend-item" onclick="toggleTrendSeries(0, this)"><span class="trend-legend-dot" style="background:#3b82f6"></span>Amount</span>
            <span class="trend-legend-item" onclick="toggleTrendSeries(1, this)"><span class="trend-legend-dot" style="background:#16a34a"></span>GP</span>
        `;
    }
}

// Click-to-toggle a series, same as Chart.js's own built-in legend used to
// give for free before it got swapped out for the custom HTML one above.
function toggleTrendSeries(index, el) {
    if (!_chartMonthly) return;
    const wasVisible = _chartMonthly.isDatasetVisible(index);
    _chartMonthly.setDatasetVisibility(index, !wasVisible);
    _chartMonthly.update();
    el.classList.toggle('is-hidden', wasVisible);
}

// Compact value label above every point/bar, in each dataset's own color —
// for Overview (Amount/GP), works the same in both Line and Bar since it's
// per-element, not a stacked total like trendTotalLabelPlugin (Amount and
// GP aren't additive, so a combined "total" wouldn't mean anything here;
// this labels each series' own value instead).
const trendValueLabelPlugin = {
    id: 'trendValueLabel',
    afterDatasetsDraw(chart) {
        const { ctx, data } = chart;
        ctx.save();
        ctx.font = "700 10px 'Inter', sans-serif";
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        data.datasets.forEach((ds, dsIndex) => {
            if (!chart.isDatasetVisible(dsIndex)) return; // respects the click-to-hide legend
            const meta = chart.getDatasetMeta(dsIndex);
            ds.data.forEach((val, i) => {
                if (val == null || val === 0) return;
                const el = meta.data[i];
                if (!el) return;
                ctx.fillStyle = ds.borderColor;
                ctx.fillText(fmtK(val), el.x, el.y - 6);
            });
        });
        ctx.restore();
    }
};

// Two-series Amount/GP bar or line chart — shared by Overview mode (a real
// time series: labels are month/quarter keys, amts/gps built by the caller
// with future periods nulled out) and Sales Rep mode (a snapshot: labels
// are rep names sorted by amount, nothing nulled since there's no
// "hasn't happened yet" concept for a person). Either way this function
// only ever sees three plain arrays, not what they represent.
function renderTrendAmtGP(labels, amts, gps) {
    const isBar = _trendChartType === 'bar';
    const ctx = document.getElementById('monthlyChart').getContext('2d');
    if (_chartMonthly) _chartMonthly.destroy();
    _chartMonthly = new Chart(ctx, {
        type: _trendChartType,
        plugins: [trendValueLabelPlugin],
        data: {
            labels,
            datasets: [
                {
                    label: 'Amount',
                    data: amts,
                    borderColor: '#3b82f6',
                    backgroundColor: isBar ? 'rgba(59,130,246,0.75)' : 'rgba(59,130,246,0.08)',
                    borderWidth: isBar ? 0 : 2.5,
                    borderRadius: isBar ? 4 : 0,
                    pointRadius: 4,
                    pointBackgroundColor: '#3b82f6',
                    tension: 0.35,
                    fill: true,
                    spanGaps: false,
                    yAxisID: 'y'
                },
                {
                    label: 'GP',
                    data: gps,
                    borderColor: '#16a34a',
                    backgroundColor: isBar ? 'rgba(22,163,74,0.75)' : 'rgba(22,163,74,0.08)',
                    borderWidth: isBar ? 0 : 2.5,
                    borderRadius: isBar ? 4 : 0,
                    pointRadius: 4,
                    pointBackgroundColor: '#16a34a',
                    tension: 0.35,
                    fill: false,
                    spanGaps: false,
                    yAxisID: 'y'
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { intersect: false, mode: 'index' },
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: '#1e293b',
                    cornerRadius: 10,
                    padding: 12,
                    boxPadding: 4,
                    bodySpacing: 6,
                    bodyAlign: 'right',
                    displayColors: true,
                    titleColor: '#fff',
                    titleFont: { size: 13, weight: '700' },
                    bodyColor: '#e2e8f0',
                    bodyFont: { size: 12 },
                    callbacks: {
                        // Solid swatch colors — the datasets' own backgroundColor
                        // is a near-transparent area fill (for the chart itself),
                        // which would render as an invisible tooltip color box.
                        labelColor: c => ({
                            borderColor: c.datasetIndex === 0 ? '#3b82f6' : '#16a34a',
                            backgroundColor: c.datasetIndex === 0 ? '#3b82f6' : '#16a34a',
                            borderRadius: 3
                        }),
                        label: c => c.raw == null ? null : ` ${c.dataset.label}: ${Math.round(c.raw).toLocaleString('en-US')} ฿`,
                        // GP% as its own plain line under Amount/GP — kept
                        // separate from momGrowth's period-over-period % (which
                        // read as noisy/hard to parse and was dropped) so the
                        // tooltip is just the 3 numbers: Amount, GP, GP%.
                        afterBody: items => {
                            const i = items[0]?.dataIndex;
                            if (i == null) return [];
                            const pct = pctStr(gps[i], amts[i]);
                            return pct ? [` GP%: ${pct}`] : [];
                        }
                    }
                }
            },
            // Headroom for trendValueLabelPlugin's labels sitting just
            // above each point/bar — without it, a month near the chart's
            // top edge clips its own label off the canvas.
            layout: { padding: { top: 20 } },
            scales: {
                x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#94a3b8' } },
                y: {
                    grid: { color: '#f1f5f9' },
                    ticks: { font: { size: 10 }, color: '#94a3b8', callback: v => fmtK(v) },
                    beginAtZero: true
                }
            }
        }
    });
}

// Draws each month's stacked total just above its tallest segment — the
// one thing a stacked bar is otherwise bad at showing at a glance (a
// middle segment's own height reads fine, but the grand total needs
// mentally adding up all of them). Line mode has no "top of stack" to
// anchor this to and doesn't need it anyway (each BU's already its own
// full-height line), so this plugin is only ever attached to the Bar chart.
const trendTotalLabelPlugin = {
    id: 'trendTotalLabel',
    afterDatasetsDraw(chart) {
        const { ctx, data } = chart;
        ctx.save();
        ctx.font = "700 11px 'Inter', sans-serif";
        ctx.fillStyle = '#475569';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        data.labels.forEach((_, i) => {
            let total = 0, topY = Infinity, x = null;
            data.datasets.forEach((ds, dsIndex) => {
                if (!chart.isDatasetVisible(dsIndex)) return; // hidden via the legend — leave it out of the total too
                const val = ds.data[i] || 0;
                total += val;
                if (val > 0) {
                    const bar = chart.getDatasetMeta(dsIndex).data[i];
                    if (bar) { topY = Math.min(topY, bar.y); x = bar.x; }
                }
            });
            if (total <= 0 || x == null) return;
            ctx.fillText(fmtK(total), x, topY - 6);
        });
        ctx.restore();
    }
};

// Stacked bar: one bar per period, one colored segment per BU. Only stacks
// whichever BUs currently pass the BU chip filter (buPasses), same colors
// as the BU cards/chips (buColor) so the two views read as one system.
function renderTrendByBU(buMonthMap, axis) {
    const { keys, labels } = axis;
    const activeBUs = _cfgBU.filter(bu => buPasses(bu));

    // Bar = stacked segments (one bar per period, one BU per segment).
    // Line = one line per BU, not stacked — stacking lines on top of each
    // other reads as area-chart clutter, not "compare BUs over time",
    // which is what picking Line here is for.
    const isBar = _trendChartType === 'bar';
    const datasets = activeBUs.map(bu => {
        const c = buColor(bu);
        const data = keys.map(m => buMonthMap.get(m)?.get(bu)?.amt || 0);
        return isBar
            ? { label: bu, data, backgroundColor: c, borderRadius: 3, stack: 'trend' }
            : { label: bu, data, borderColor: c, backgroundColor: c, borderWidth: 2.5, pointRadius: 3, pointBackgroundColor: c, tension: 0.35, fill: false, spanGaps: false };
    });

    const ctx = document.getElementById('monthlyChart').getContext('2d');
    if (_chartMonthly) _chartMonthly.destroy();
    _chartMonthly = new Chart(ctx, {
        type: _trendChartType,
        data: { labels, datasets },
        // Top-level plugins array (registers the custom total-label plugin
        // itself), not to be confused with options.plugins below (which
        // configures built-in plugins like legend/tooltip) — only attached
        // in Bar mode, see trendTotalLabelPlugin's own comment for why.
        plugins: isBar ? [trendTotalLabelPlugin] : [],
        options: {
            responsive: true,
            maintainAspectRatio: false,
            // 'index' so hovering anywhere on a bar shows every BU stacked
            // into it at once, not just the single segment under the
            // cursor — that's what made the old tooltip look incomplete.
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: '#1e293b',
                    cornerRadius: 10,
                    padding: 12,
                    boxPadding: 4,
                    bodySpacing: 5,
                    bodyAlign: 'right',
                    titleColor: '#fff',
                    titleFont: { size: 13, weight: '700' },
                    bodyColor: '#e2e8f0',
                    bodyFont: { size: 12 },
                    footerColor: cssVar('--c-accent'),
                    footerFont: { size: 12, weight: '700' },
                    footerMarginTop: 6,
                    itemSort: (a, b) => b.raw - a.raw, // biggest BU first, regardless of stack order
                    callbacks: {
                        label: c => c.raw === 0 ? null : ` ${c.dataset.label}: ${Math.round(c.raw).toLocaleString('en-US')} ฿`,
                        // The "All BUs" total the old single-segment tooltip
                        // was missing — per-BU Amount/GP/GP% breakdown lives in
                        // the Trend Detail table below instead of being crammed
                        // into the hover tooltip (up to 7 BUs × 3 lines each
                        // would be unreadable there).
                        footer: items => {
                            const total = items.reduce((s, it) => s + (it.raw || 0), 0);
                            return total ? `Total: ${Math.round(total).toLocaleString('en-US')} ฿` : '';
                        }
                    }
                }
            },
            // Headroom for the total label sitting just above the tallest
            // bar — without it, a month that already reaches near the top
            // of the chart clips its own total off the canvas.
            layout: isBar ? { padding: { top: 20 } } : {},
            scales: {
                x: { stacked: isBar, grid: { display: false }, ticks: { font: { size: 11 }, color: '#94a3b8' } },
                y: {
                    stacked: isBar,
                    grid: { color: '#f1f5f9' },
                    ticks: { font: { size: 10 }, color: '#94a3b8', callback: v => fmtK(v) },
                    beginAtZero: true
                }
            }
        }
    });
}

function toggleTrendDetail() {
    document.getElementById('trendDetailAccordion').classList.toggle('open');
}

// ── Compare charts ───────────────────────────────────────────────────────────
// Year-by-year color — no fixed meaning per year (unlike BU, which has a
// stable config order), so it's just position-in-the-sorted-years-array
// indexed into the same palette BU uses.
function compareYearColor(years, y) {
    const idx = years.indexOf(y);
    return CAT_PALETTE[(idx >= 0 ? idx : 0) % CAT_PALETTE.length];
}

// Overview/Sales Rep compare share this: one dataset per year, grouped
// (not stacked) bars, X-axis is periods for Overview or rep names for
// Sales Rep — the function doesn't care which, it's just given labels/a
// value-lookup callback.
function renderCompareGroupedChart(keys, labels, years, getVal) {
    const datasets = years.map(y => ({
        label: String(y),
        data: keys.map(k => getVal(k, y)),
        backgroundColor: compareYearColor(years, y),
        borderRadius: 3
    }));
    const ctx = document.getElementById('monthlyChart').getContext('2d');
    if (_chartMonthly) _chartMonthly.destroy();
    _chartMonthly = new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: '#1e293b', cornerRadius: 10, padding: 12, boxPadding: 4,
                    bodySpacing: 5, bodyAlign: 'right', titleColor: '#fff', titleFont: { size: 13, weight: '700' },
                    bodyColor: '#e2e8f0', bodyFont: { size: 12 },
                    callbacks: { label: c => c.raw === 0 ? null : ` ${c.dataset.label}: ${Math.round(c.raw).toLocaleString('en-US')} ฿` }
                }
            },
            scales: {
                x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#94a3b8' } },
                y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 }, color: '#94a3b8', callback: v => fmtK(v) }, beginAtZero: true }
            }
        }
    });
}

// BU compare: same grouped-by-year bars as above, but each year's bar is
// itself stacked by BU (reusing the same stacked-by-BU-color convention as
// non-compare BU mode) — one dataset per (BU, year) pair, grouped via a
// per-year `stack` id so Chart.js groups the years side by side and stacks
// each year's BUs within it.
function renderCompareBUChart(keys, labels, years, buMonthMap) {
    const activeBUs = _cfgBU.filter(bu => buPasses(bu));
    const datasets = years.flatMap(y => activeBUs.map(bu => ({
        label: bu,
        data: keys.map(k => buMonthMap.get(k)?.get(y)?.get(bu)?.amt || 0),
        backgroundColor: buColor(bu),
        stack: `y${y}`,
        borderRadius: 3,
        // Only used by the tooltip below — Chart.js datasets don't carry
        // arbitrary metadata natively past what callbacks can already see
        // via context, but stack id alone doesn't say the year in plain
        // text, so stash it directly on the dataset.
        _year: y
    })));
    const ctx = document.getElementById('monthlyChart').getContext('2d');
    if (_chartMonthly) _chartMonthly.destroy();
    _chartMonthly = new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: '#1e293b', cornerRadius: 10, padding: 12, boxPadding: 4,
                    bodySpacing: 5, bodyAlign: 'right', titleColor: '#fff', titleFont: { size: 13, weight: '700' },
                    bodyColor: '#e2e8f0', bodyFont: { size: 12 },
                    callbacks: {
                        label: c => c.raw === 0 ? null : ` ${c.dataset.label} ${c.dataset._year}: ${Math.round(c.raw).toLocaleString('en-US')} ฿`
                    }
                }
            },
            scales: {
                x: { stacked: true, grid: { display: false }, ticks: { font: { size: 11 }, color: '#94a3b8' } },
                y: { stacked: true, grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 }, color: '#94a3b8', callback: v => fmtK(v) }, beginAtZero: true }
            }
        }
    });
}

// Shared by Overview/Sales Rep compare — a plain year color-dot legend
// (BU compare keeps its own per-BU legend instead, via renderTrendLegend).
function renderCompareYearLegend(years) {
    document.getElementById('trendLegend').innerHTML = years.map(y =>
        `<span class="trend-legend-item"><span class="trend-legend-dot" style="background:${compareYearColor(years, y)}"></span>${y}</span>`
    ).join('');
}

// Head (earliest selected) vs tail (latest selected) year, summed across
// whatever's on screen — same definition regardless of breakdown mode.
function renderCompareGrowthBadge(years, totalByYear) {
    const el = document.getElementById('trendLegend');
    if (years.length < 2) return; // nothing to compare with just one year
    const headTotal = totalByYear(years[0]);
    const tailTotal = totalByYear(years[years.length - 1]);
    const growth = headTotal > 0 ? (tailTotal - headTotal) / headTotal * 100 : null;
    if (growth == null) return;
    const up = growth >= 0;
    el.insertAdjacentHTML('afterbegin',
        `<span class="trend-growth-badge ${up ? 'up' : 'down'}"><i class="bi bi-arrow-${up ? 'up' : 'down'}-short"></i>${Math.abs(growth).toFixed(1)}%</span>`);
}

function toggleTrendCompare() {
    _trendCompare = !_trendCompare;
    if (_trendCompare) {
        // Reset to this year + last year on every open, not just the
        // first ever one — otherwise reopening after a close-triggered
        // revert to Normal would reopen stuck on that leftover 0/1-year
        // selection instead of a sane default.
        const thisYear = new Date().getFullYear();
        _compareYears = new Set([thisYear - 1, thisYear]);
        if (!_compareYearPicker) {
            _compareYearPicker = createMultiSelect({
                trigger: document.getElementById('wrap-compareYears'),
                label: 'Years',
                showTag: false,
                selectedLabel: 'years',
                getOptions: () => {
                    const known = new Set([...new Set(_opps.map(o => +(o.signed_date || '').slice(0, 4)))].filter(Boolean));
                    known.add(thisYear); known.add(thisYear - 1);
                    return [...known].sort((a, b) => b - a).map(y => ({ value: String(y), label: String(y) }));
                },
                // Live per click — just records the selection and redraws
                // the chart. Safe to call renderTrendChart() straight from
                // here since it only reads _compareYears/_trendCompare and
                // never touches the picker's own state/DOM; calling back
                // into the picker itself (e.g. setValues()) from inside
                // its own checkbox 'change' handler re-enters that handler
                // mid-dispatch and breaks checking/unchecking — don't.
                onChange: values => {
                    _compareYears = new Set(values.map(Number));
                    renderTrendChart();
                },
                // Fires once, on actual panel close (a separate click/
                // scroll event, never mid checkbox-click) — the only place
                // Normal vs Compare gets decided, derived fresh from the
                // count every time rather than nudged one direction (which
                // gets permanently stuck once flipped): >=2 years selected
                // stays in Compare, 0 or 1 reverts to Normal.
                onClose: () => {
                    _trendCompare = _compareYears.size >= 2;
                    renderTrendChart();
                }
            });
        }
        _compareYearPicker.setValues([...(_compareYears)].map(String));
    }
    renderTrendChart();
}

// Shared by every Compare breakdown mode — rowKeys/rowLabels are periods
// for Overview/BU or rep names for Sales Rep, getYearData(key, year)
// looks up {amt, gp} for that row's year column. Growth% (head vs tail
// selected year) is per-row here, same head/tail definition as the
// header badge (see renderCompareGrowthBadge) which shows the same thing
// totaled across every row.
function renderCompareDetailTable(rowKeys, rowLabels, years, rowColLabel, getYearData) {
    const NAME_COL = 100, AMT_COL = 110, GP_COL = 110, GROWTH_COL = 90;
    const colWidths = NAME_COL + years.length * (AMT_COL + GP_COL) + GROWTH_COL;
    const thead = `
        <tr>
            <th rowspan="2" style="width:${NAME_COL}px">${rowColLabel}</th>
            ${years.map(y => `<th colspan="2" class="c" style="border-left:2px solid #e2e8f0">${y}</th>`).join('')}
            <th rowspan="2" class="r" style="width:${GROWTH_COL}px">Growth%</th>
        </tr>
        <tr>
            ${years.map(() => `
                <th class="r" style="width:${AMT_COL}px;border-left:2px solid #e2e8f0">Amount</th>
                <th class="r" style="width:${GP_COL}px">GP</th>
            `).join('')}
        </tr>
    `;
    const rows = rowKeys.map((k, i) => {
        const cells = years.map(y => {
            const d = getYearData(k, y);
            return `
                <td class="r" style="border-left:2px solid #f1f5f9">${d.amt ? fmtN(d.amt) + ' ฿' : '—'}</td>
                <td class="r amt-green">${d.gp ? fmtN(d.gp) + ' ฿' : '—'}</td>
            `;
        }).join('');
        let growthCell = '—';
        if (years.length >= 2) {
            const headAmt = getYearData(k, years[0]).amt, tailAmt = getYearData(k, years[years.length - 1]).amt;
            if (headAmt > 0) {
                const growth = (tailAmt - headAmt) / headAmt * 100;
                growthCell = `<span class="${growth >= 0 ? 'amt-green' : 'amt-red'}">${growth >= 0 ? '+' : ''}${growth.toFixed(1)}%</span>`;
            }
        }
        return `<tr><td class="strong">${esc(rowLabels[i])}</td>${cells}<td class="r">${growthCell}</td></tr>`;
    }).join('');

    document.getElementById('trendTableWrap').innerHTML = `
        <div style="overflow-x:auto">
            <table class="dash-tbl" style="width:${colWidths}px;table-layout:fixed">
                <thead>${thead}</thead>
                <tbody>${rows}</tbody>
            </table>
        </div>
    `;
    document.getElementById('trendDetailCount').textContent = `(${rowKeys.length})`;
}

// BU compare's own legend — plain color dots, not clickable. The normal
// BU-mode legend's toggleTrendSeries(index) assumes one dataset per BU;
// compare mode has one dataset per (BU, year) pair, so a legend index
// would only ever hide the first year's copy of that BU — wrong. Kept
// simple/static here rather than write a toggle that finds every year's
// copy of one BU, until this mode actually needs the hide/show feature.
function renderCompareBULegend() {
    const activeBUs = _cfgBU.filter(bu => buPasses(bu));
    document.getElementById('trendLegend').innerHTML = activeBUs.map(bu =>
        `<span class="trend-legend-item"><span class="trend-legend-dot" style="background:${buColor(bu)}"></span>${esc(bu)}</span>`
    ).join('');
}

// Orchestrates all three breakdown modes under Compare — mirrors
// renderTrendChart's own if/else-if shape below, just for the Compare
// data/chart/table variants.
function renderTrendCompare() {
    // No minimum enforced here — renders whatever's currently selected
    // (0/1/2/3+ years), so the chart just smoothly tracks each click
    // instead of swapping to a placeholder mid-selection. Whether that's
    // enough to stay in Compare mode is decided separately, only once the
    // years picker closes (see toggleTrendCompare's onClose).
    const years = [...(_compareYears)].sort();
    const yearSet = new Set(years);

    if (_trendBreakdown === 'rep') {
        const repMap = computeCompareRepMap(yearSet);
        const total = (rep, y) => repMap.get(rep)?.get(y)?.amt || 0;
        const reps = [...repMap.keys()].sort((a, b) =>
            years.reduce((s, y) => s + total(b, y), 0) - years.reduce((s, y) => s + total(a, y), 0));
        renderCompareYearLegend(years);
        renderCompareGroupedChart(reps, reps, years, total);
        renderCompareGrowthBadge(years, y => reps.reduce((s, rep) => s + total(rep, y), 0));
        renderCompareDetailTable(reps, reps, years, 'Sales Rep', (rep, y) => repMap.get(rep)?.get(y) || { amt: 0, gp: 0 });
        return;
    }

    const { keys, labels } = compareAxisKeys();
    const periodLabel = _trendGranularity === 'quarter' ? 'Quarter' : 'Month';

    if (_trendBreakdown === 'bu') {
        let buMonthMap = computeCompareBUMap(yearSet);
        if (_trendGranularity === 'quarter') buMonthMap = aggregateCompareBUToQuarters(buMonthMap);
        const yearTotal = (k, y) => {
            const byBu = buMonthMap.get(k)?.get(y);
            if (!byBu) return { amt: 0, gp: 0 };
            let amt = 0, gp = 0;
            byBu.forEach(r => { amt += r.amt; gp += r.gp; });
            return { amt, gp };
        };
        renderCompareBULegend();
        renderCompareBUChart(keys, labels, years, buMonthMap);
        renderCompareGrowthBadge(years, y => keys.reduce((s, k) => s + yearTotal(k, y).amt, 0));
        renderCompareDetailTable(keys, labels, years, periodLabel, yearTotal);
        return;
    }

    let monthMap = computeCompareMonthMap(yearSet);
    if (_trendGranularity === 'quarter') monthMap = aggregateCompareToQuarters(monthMap);
    renderCompareYearLegend(years);
    renderCompareGroupedChart(keys, labels, years, (k, y) => monthMap.get(k)?.get(y)?.amt || 0);
    renderCompareGrowthBadge(years, y => keys.reduce((s, k) => s + (monthMap.get(k)?.get(y)?.amt || 0), 0));
    renderCompareDetailTable(keys, labels, years, periodLabel, (k, y) => monthMap.get(k)?.get(y) || { amt: 0, gp: 0 });
}

// Plain values table under the Amount/GP and By BU charts — same periods
// (and future-period "—") as whichever chart is showing, just laid out so
// exact numbers are readable without hovering every point.
function renderTrendRawTable(kind, monthMap, axis) {
    const { keys, labels, isQuarter, isFuture } = axis;
    const periodColLabel = isQuarter ? 'Quarter' : 'Month';

    // Fixed per-column widths (table-layout:fixed) instead of the browser's
    // auto layout stretching sparse "—" columns to fill 100% — that made
    // columns land at wildly uneven widths depending on which months had
    // real numbers. A predictable grid that overflows into its own
    // horizontal scrollbar (see wrapper below) reads far more organized
    // than a full-width table with awkward gaps.
    const MONTH_COL = 90;
    let thead, rows, colWidths;
    if (kind === 'bu') {
        const buMonthMap = monthMap;
        const activeBUs = _cfgBU.filter(bu => buPasses(bu));
        // Each BU gets its own Amount/GP/GP% trio, not just a bare amount —
        // a grouped 2-row header (BU name spanning 3, then the sub-labels)
        // makes clear which three columns belong to which BU.
        const AMT_COL = 120, GP_COL = 120, PCT_COL = 70;
        const groupWidth = AMT_COL + GP_COL + PCT_COL;
        colWidths = MONTH_COL + activeBUs.length * groupWidth;

        thead = `
            <tr>
                <th rowspan="2" style="width:${MONTH_COL}px">${periodColLabel}</th>
                ${activeBUs.map(bu => `<th colspan="3" class="c" style="border-left:2px solid #e2e8f0">${esc(bu)}</th>`).join('')}
            </tr>
            <tr>
                ${activeBUs.map(() => `
                    <th class="r" style="width:${AMT_COL}px;border-left:2px solid #e2e8f0">Amount</th>
                    <th class="r" style="width:${GP_COL}px">GP</th>
                    <th class="r" style="width:${PCT_COL}px">GP%</th>
                `).join('')}
            </tr>
        `;
        rows = keys.map((m, i) => {
            const future = isFuture(m);
            const cells = activeBUs.map(bu => {
                const rec = future ? null : buMonthMap.get(m)?.get(bu);
                const pct = rec && rec.amt ? pctStr(rec.gp, rec.amt) : null;
                return `
                    <td class="r" style="border-left:2px solid #f1f5f9">${rec?.amt ? fmtN(rec.amt) + ' ฿' : '—'}</td>
                    <td class="r amt-green">${rec?.gp ? fmtN(rec.gp) + ' ฿' : '—'}</td>
                    <td class="r">${pct || '—'}</td>
                `;
            }).join('');
            return `<tr><td class="strong">${esc(labels[i])}</td>${cells}</tr>`;
        }).join('');
    } else {
        const CNT_COL = 90, VAL_COL = 170, PCT_COL = 90;
        colWidths = MONTH_COL + CNT_COL * 2 + VAL_COL * 2 + PCT_COL;
        thead = `<tr>
            <th style="width:${MONTH_COL}px">${periodColLabel}</th>
            <th class="r" style="width:${CNT_COL}px">Account</th>
            <th class="r" style="width:${CNT_COL}px">Opportunity</th>
            <th class="r" style="width:${VAL_COL}px">Amount</th>
            <th class="r" style="width:${VAL_COL}px">GP</th>
            <th class="r" style="width:${PCT_COL}px">GP%</th>
        </tr>`;
        rows = keys.map((m, i) => {
            const future = isFuture(m);
            const rec = future ? null : monthMap.get(m);
            const amt = rec ? rec.amt : null;
            const gp  = rec ? rec.gp : null;
            return `<tr>
                <td class="strong">${esc(labels[i])}</td>
                <td class="r">${rec?.accounts?.size ? rec.accounts.size.toLocaleString('en-US') : '—'}</td>
                <td class="r">${rec?.opps?.size ? rec.opps.size.toLocaleString('en-US') : '—'}</td>
                <td class="r">${amt == null ? '—' : fmtN(amt) + ' ฿'}</td>
                <td class="r amt-green">${gp == null ? '—' : fmtN(gp) + ' ฿'}</td>
                <td class="r">${amt == null || gp == null ? '—' : (pctStr(gp, amt) || '—')}</td>
            </tr>`;
        }).join('');
    }

    document.getElementById('trendTableWrap').innerHTML = `
        <div style="overflow-x:auto">
            <table class="dash-tbl" style="width:${colWidths}px;table-layout:fixed">
                <thead>${thead}</thead>
                <tbody>${rows}</tbody>
            </table>
        </div>
    `;
    document.getElementById('trendDetailCount').textContent = `(${keys.length})`;
}

// Sales Rep mode's own Trend Detail — kept separate from renderTrendRawTable
// since that one is built entirely around trendAxis()'s period keys/
// isFuture, neither of which apply to a rep snapshot.
// Rows = reps (same order as the chart), columns = grouped by month with
// its own Amount/GP/GP% trio — the exact transpose of 'bu' mode's table
// (there: rows=period, column-groups=BU; here: rows=rep, column-groups=
// month), same grouped-header pattern. Unlike the chart above (one
// snapshot total per rep for the whole filtered range), this breaks that
// same total down by month so its makeup is visible — but still only the
// months actually in the current Year/Month filter, not a full calendar
// year like Overview/BU's independent axis.
function renderTrendRepTable(reps, repMonthMap, monthKeys) {
    const NAME_COL = 140;
    const AMT_COL = 110, GP_COL = 110, PCT_COL = 60;
    const groupWidth = AMT_COL + GP_COL + PCT_COL;
    const colWidths = NAME_COL + monthKeys.length * groupWidth;
    const monthLabels = trendLabels(monthKeys);

    const thead = `
        <tr>
            <th rowspan="2" style="width:${NAME_COL}px">Sales Rep</th>
            ${monthLabels.map(lbl => `<th colspan="3" class="c" style="border-left:2px solid #e2e8f0">${lbl}</th>`).join('')}
        </tr>
        <tr>
            ${monthKeys.map(() => `
                <th class="r" style="width:${AMT_COL}px;border-left:2px solid #e2e8f0">Amount</th>
                <th class="r" style="width:${GP_COL}px">GP</th>
                <th class="r" style="width:${PCT_COL}px">GP%</th>
            `).join('')}
        </tr>
    `;
    const rows = reps.map(rep => {
        const cells = monthKeys.map(mk => {
            const rec = repMonthMap.get(mk)?.get(rep);
            const pct = rec && rec.amt ? pctStr(rec.gp, rec.amt) : null;

                <td class="r" style="border-left:2px solid #f1f5f9">${rec?.amt ? fmtN(rec.amt) + ' ฿' : '—'}</td>
                <td class="r amt-green">${rec?.gp ? fmtN(rec.gp) + ' ฿' : '—'}</td>
                <td class="r">${pct || '—'}</td>
            `;
        }).join('');
        return `<tr><td class="strong">${esc(rep)}</td>${cells}</tr>`;
    }).join('');

    document.getElementById('trendTableWrap').innerHTML = `
        <div style="overflow-x:auto">
            <table class="dash-tbl" style="width:${colWidths}px;table-layout:fixed">
                <thead>${thead}</thead>
                <tbody>${rows}</tbody>
            </table>
        </div>
    `;
    document.getElementById('trendDetailCount').textContent = `(${reps.length})`;
}

// ── Churn Analysis ────────────────────────────────────────────────────────────
// r.date is ISO (YYYY-MM-DD) — sort stays on that raw form (lexicographic ==
// chronological for ISO), only the displayed cell is reformatted to dd-mm-yyyy.
const fmtChurnDate = d => {
    if (!d) return '';
    const [y, m, day] = String(d).split('-');
    return (y && m && day) ? `${day}-${m}-${y}` : d;
};

// ── Churned Opportunity table: sort + column filter state. Every column
// is sortable/filterable (per the Member-tab pattern this was asked to
// match) — CHURN_FIELD_VALUE is each field's display/filter-match string,
// CHURN_FIELD_SORTVAL its underlying sort value (raw number for amount
// columns, not the formatted "1,234.00 ฿" text). ──
const CHURN_FIELDS = ['opportunity_id','opportunity','bu','owner','date','origAmt','amt','pctVal','remainAmt'];
const CHURN_FIELD_NUMERIC = new Set(['origAmt','amt','pctVal','remainAmt']);
const CHURN_FIELD_VALUE = {
    opportunity_id: r => r.opportunity_id || '—',
    opportunity:    r => r.opportunity || '—',
    bu:             r => r.bu || '—',
    owner:          r => r.owner || '—',
    date:           r => fmtChurnDate(r.date) || '—',
    origAmt:        r => `${fmtN(r.origAmt)} ฿`,
    amt:            r => `-${fmtN(r.amt)} ฿`,
    pctVal:         r => r.pctVal ? `-${r.pctVal.toFixed(1)}%` : '—',
    remainAmt:      r => `${fmtN(r.remainAmt)} ฿`,
};
const CHURN_FIELD_SORTVAL = {
    opportunity_id: r => (r.opportunity_id || '').toLowerCase(),
    opportunity:    r => (r.opportunity || '').toLowerCase(),
    bu:             r => (r.bu || '').toLowerCase(),
    owner:          r => (r.owner || '').toLowerCase(),
    date:           r => r.date || '',
    origAmt:        r => +r.origAmt || 0,
    amt:            r => +r.amt || 0,
    pctVal:         r => +r.pctVal || 0,
    remainAmt:      r => +r.remainAmt || 0,
};
let churnSort = { field: null, dir: 'asc' }; // null field = default (newest churn_date first)
let churnColumnFilters = {}; // field -> Set of allowed display-values, or absent/null = no filter
let churnFilterField = null; // which column's popup is currently open
let _allChurnRows = []; // unfiltered rows from the last computeData(), re-filtered/sorted locally on every interaction
let _chfVisibleValues = []; // current popup's visible (search-matched) value list — toggleChurnFilterValue() indexes into this instead of re-embedding the string in onclick (avoids quote-escaping issues with values like an opportunity name containing an apostrophe)
let _chfAllValues = []; // current popup's full (unfiltered-by-search) distinct value list — computed once when the popup opens and reused by every render/toggle while it's open, instead of re-deriving it from _allChurnRows on every single checkbox click

function renderChurnSection({ churnRows, grandChurnAmt, grandOrigAmt, grandChurnGP, grandOrigGP }) {
    const rate   = pctStr(grandChurnAmt, grandOrigAmt + grandChurnAmt);
    const gpRate = pctStr(grandChurnGP, grandOrigGP + grandChurnGP);
    document.getElementById('churnKpiRow').innerHTML = `
        <div class="churn-hero-row">
            <div class="churn-hero">
                <div class="churn-hero-label">Rate</div>
                <div class="churn-hero-val">${rate || '0%'}</div>
            </div>
            <div class="churn-stat-list">
                <div class="churn-stat-item">
                    <span class="churn-stat-label">Churned Opportunity</span>
                    <span class="churn-stat-val">${churnRows.length}</span>
                </div>
                <div class="churn-stat-item">
                    <span class="churn-stat-label">Churn Amount</span>
                    <span class="churn-stat-val">${fmtN(grandChurnAmt)} ฿</span>
                </div>
                <div class="churn-stat-item">
                    <span class="churn-stat-label">Churned GP</span>
                    <span class="churn-stat-val">${fmtN(grandChurnGP)} ฿${gpRate ? `<span class="churn-stat-badge">${gpRate}</span>` : ''}</span>
                </div>
            </div>
        </div>
    `;

    _allChurnRows = churnRows;
    if (!churnRows.length) {
        document.getElementById('churnTableWrap').innerHTML = '<div class="dash-empty">No churned deals in this range</div>';
        return;
    }
    renderChurnTable();
}

function churnFilteredSortedRows() {
    let rows = _allChurnRows.filter(r =>
        CHURN_FIELDS.every(f => !churnColumnFilters[f] || churnColumnFilters[f].has(CHURN_FIELD_VALUE[f](r)))
    );
    if (churnSort.field) {
        const f = churnSort.field, numeric = CHURN_FIELD_NUMERIC.has(f);
        rows = [...rows].sort((a, b) => {
            const va = CHURN_FIELD_SORTVAL[f](a), vb = CHURN_FIELD_SORTVAL[f](b);
            const cmp = numeric ? (va - vb) : va.localeCompare(vb);
            return churnSort.dir === 'asc' ? cmp : -cmp;
        });
    } else {
        rows = [...rows].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    }
    return rows;
}

function updateChurnSortIcons() {
    CHURN_FIELDS.forEach(field => {
        const el = document.getElementById(`chf-sort-${field}`);
        if (!el) return;
        if (churnSort.field !== field) { el.innerHTML = '<i class="bi bi-chevron-expand chf-sort-icon"></i>'; return; }
        el.innerHTML = churnSort.dir === 'asc'
            ? '<i class="bi bi-chevron-up chf-sort-icon active"></i>'
            : '<i class="bi bi-chevron-down chf-sort-icon active"></i>';
    });
}

function updateChurnFilterIcons() {
    CHURN_FIELDS.forEach(field => {
        const el = document.getElementById(`chf-filter-${field}`);
        if (!el) return;
        const active = !!churnColumnFilters[field];
        el.innerHTML = `<i class="bi ${active ? 'bi-funnel-fill' : 'bi-funnel'} chf-filter-icon ${active ? 'active' : ''}"></i>`;
    });
}

function setChurnSortDirect(field, dir) {
    churnSort = { field, dir };
    closeChurnFilterPopup();
    renderChurnTable();
}

// ── Column filter popup (same Excel-style recipe as system/setting.html's
// Member tab — search + Select All + checkbox list, applied immediately). ──
function churnColumnValues(field) {
    return [...new Set(_allChurnRows.map(r => CHURN_FIELD_VALUE[field](r)))].sort();
}

function openChurnFilterPopup(field, label) {
    churnFilterField = field;
    _chfAllValues = churnColumnValues(field);
    document.getElementById('chf-title').textContent = label;
    document.getElementById('chf-search').value = '';
    toggleChurnSearchClearBtn('');
    renderChurnFilterList('');
    document.getElementById('chf-overlay').classList.add('show');
    lockBodyScroll();
    setTimeout(() => document.getElementById('chf-search').focus(), 100);
}

function closeChurnFilterPopup(e) {
    if (e && e.target !== document.getElementById('chf-overlay')) return;
    document.getElementById('chf-overlay').classList.remove('show');
    unlockBodyScroll();
}

function toggleChurnSearchClearBtn(val) {
    const btn = document.getElementById('chf-search-clear');
    if (btn) btn.style.display = val ? 'flex' : 'none';
}

function clearChurnFilterSearch() {
    const input = document.getElementById('chf-search');
    input.value = '';
    input.focus();
    toggleChurnSearchClearBtn('');
    renderChurnFilterList('');
}

function renderChurnFilterList(searchQ) {
    const field = churnFilterField;
    const all = _chfAllValues;
    const ql = searchQ.trim().toLowerCase();
    const visible = ql ? all.filter(v => v.toLowerCase().includes(ql)) : all;
    _chfVisibleValues = visible;
    const selected = churnColumnFilters[field];
    const list = document.getElementById('chf-list');

    const selectedTotal = selected ? selected.size : all.length;
    document.getElementById('chf-count').textContent = selectedTotal === all.length ? '' : `${selectedTotal}/${all.length} selected`;
    document.getElementById('chf-reset-btn')?.classList.toggle('active', !!selected);

    if (!visible.length) { list.innerHTML = '<div class="chf-empty">No matches</div>'; return; }
    const checkedCount = visible.filter(v => !selected || selected.has(v)).length;
    list.innerHTML = `
        <label class="chf-item chf-select-all">
            <input type="checkbox" class="modern-checkbox" id="chf-select-all-cb" ${checkedCount === visible.length ? 'checked' : ''} onchange="toggleAllChurnVisible(this.checked)">
            <span>Select All${ql ? ` (${visible.length} matching)` : ''}</span>
        </label>
        ${visible.map((v, i) => `
        <label class="chf-item">
            <input type="checkbox" class="modern-checkbox" ${!selected || selected.has(v) ? 'checked' : ''} onchange="toggleChurnFilterValue(${i}, this.checked)">
            <span>${esc(v)}</span>
        </label>`).join('')}
    `;
    const selectAllCb = document.getElementById('chf-select-all-cb');
    if (selectAllCb) selectAllCb.indeterminate = checkedCount > 0 && checkedCount < visible.length;
}

function toggleChurnFilterValue(idx, checked) {
    const field = churnFilterField;
    const value = _chfVisibleValues[idx];
    if (!churnColumnFilters[field]) churnColumnFilters[field] = new Set(_chfAllValues);
    checked ? churnColumnFilters[field].add(value) : churnColumnFilters[field].delete(value);
    if (churnColumnFilters[field].size === _chfAllValues.length) churnColumnFilters[field] = null;
    renderChurnTable();
    renderChurnFilterList(document.getElementById('chf-search')?.value || '');
}

function toggleAllChurnVisible(checked) {
    const field = churnFilterField;
    const ql = (document.getElementById('chf-search')?.value || '').trim().toLowerCase();
    const all = _chfAllValues;
    const visible = ql ? all.filter(v => v.toLowerCase().includes(ql)) : all;
    if (!churnColumnFilters[field]) churnColumnFilters[field] = new Set(all);
    visible.forEach(v => checked ? churnColumnFilters[field].add(v) : churnColumnFilters[field].delete(v));
    if (churnColumnFilters[field].size === all.length) churnColumnFilters[field] = null;
    renderChurnTable();
    renderChurnFilterList(document.getElementById('chf-search')?.value || '');
}

function resetChurnFilter() {
    churnColumnFilters[churnFilterField] = null;
    document.getElementById('chf-search').value = '';
    toggleChurnSearchClearBtn('');
    renderChurnTable();
    renderChurnFilterList('');
}

// ── Lead Source ───────────────────────────────────────────────────────────────
function renderLeadSource({ leadMap }) {
    const rows = [...leadMap.entries()].sort((a, b) => b[1].amt - a[1].amt);
    if (!rows.length) {
        document.getElementById('leadTableWrap').innerHTML = '<div class="dash-empty">No data</div>';
        if (_chartLead) { _chartLead.destroy(); _chartLead = null; }
        return;
    }

    const labels = rows.map(([s]) => s);
    const amts   = rows.map(([,d]) => d.amt);
    const total  = amts.reduce((s,a) => s+a, 0);

    const ctx = document.getElementById('leadChart').getContext('2d');
    if (_chartLead) _chartLead.destroy();
    _chartLead = new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets: [{ data: amts, backgroundColor: '#6d9eeb', borderRadius: 4, maxBarThickness: 22 }] },
        options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: c => ` ${fmtN(c.raw)} ฿` } }
            },
            scales: {
                x: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 }, color: '#94a3b8', callback: v => fmtK(v) }, beginAtZero: true },
                y: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#475569' } }
            }
        }
    });

    document.getElementById('leadTableWrap').innerHTML = `
        <table class="dash-tbl">
            <thead><tr><th>Source</th><th class="r">Amount</th><th class="r">Opportunity</th><th class="r">Share%</th></tr></thead>
            <tbody>
                ${rows.map(([s, d]) => {
                    const pct = total ? (d.amt / total * 100).toFixed(1) : '0.0';
                    return `<tr>
                        <td class="strong">${esc(s)}</td>
                        <td class="r">${fmtN(d.amt)} ฿</td>
                        <td class="r">${d.count}</td>
                        <td class="r"><span class="share-badge">${pct}%</span></td>
                    </tr>`;
                }).join('')}
            </tbody>
        </table>
    `;
}

// ── Sales Performance ─────────────────────────────────────────────────────
function rankBadge(i) {
    if (i === 0) return '<span class="rank-badge r1">1</span>';
    if (i === 1) return '<span class="rank-badge r2">2</span>';
    if (i === 2) return '<span class="rank-badge r3">3</span>';
    return `<span class="rank-plain">${i+1}</span>`;
}

// Click a column header to sort by it — no toggle, every column has one
// fixed direction: value columns always biggest-first (this is a
// leaderboard, "who's worst" isn't a reading anyone needs), Rep always
// A-Z since "descending" doesn't mean anything for a name. That keeps #1
// always meaning "the top performer by whatever's currently sorted" with
// no ambiguity about which direction is active.
// Share% = amt / grandTotal, a constant divisor — sorting by it always
// produces the exact same row order as sorting by 'amt'. Kept as its own
// sort key anyway (not just reusing 'amt') purely so the active-sort
// highlight/arrow lands on the Share% header the user actually clicked,
// instead of silently lighting up Amount instead. Shared by both
// REP_SORT_FIELDS and CLIENT_SORT_FIELDS below — identical in both tables.
const SHARE_SORT_FIELD = { label: 'Share%', get: (key, d) => d.amt, type: 'number' };

const REP_SORT_FIELDS = {
    rep:     { label: 'Codename',    get: (owner, d) => owner,          type: 'string' },
    amt:     { label: 'Amount',      get: (owner, d) => d.amt,          type: 'number' },
    gp:      { label: 'GP',          get: (owner, d) => d.gp,           type: 'number' },
    gpPct:   { label: 'GP%',         get: (owner, d) => d.amt ? d.gp / d.amt : -1, type: 'number' },
    account: { label: 'Account',     get: (owner, d) => d.accountCount, type: 'number' },
    opp:     { label: 'Opportunity', get: (owner, d) => d.count,        type: 'number' },
    share:   SHARE_SORT_FIELD,
};
let _repSortKey = 'amt';
let _repOwnerMap = null; // last-rendered data, so a sort click can re-render without recomputing the whole dashboard
let _repGrandAmt = 0;
let _repExpanded = new Set(); // codenames currently showing their per-BU breakdown

function toggleRepRow(owner) {
    if (_repExpanded.has(owner)) _repExpanded.delete(owner);
    else _repExpanded.add(owner);
    renderRepTable({ ownerMap: _repOwnerMap, grandOrigAmt: _repGrandAmt });
}

function setRepSort(key) {
    _repSortKey = key;
    renderRepTable({ ownerMap: _repOwnerMap, grandOrigAmt: _repGrandAmt });
}

// Shared by Sales Performance and Top Partner's click-to-sort tables —
// sorts [key, data] entries (as from a Map's .entries()) by one field's
// own fixed direction (see field.type in *_SORT_FIELDS above).
function sortTableRows(entries, field) {
    const dir = field.type === 'string' ? 1 : -1;
    return entries.sort((a, b) => {
        const av = field.get(...a), bv = field.get(...b);
        return field.type === 'string' ? dir * av.localeCompare(bv) : dir * (av - bv);
    });
}

function renderRepTable({ ownerMap, grandOrigAmt }) {
    _repOwnerMap = ownerMap;
    _repGrandAmt = grandOrigAmt;
    const field = REP_SORT_FIELDS[_repSortKey];
    const rows = sortTableRows([...ownerMap.entries()], field);
    if (!rows.length) { document.getElementById('repTableWrap').innerHTML = '<div class="dash-empty">No data</div>'; return; }

    document.getElementById('repSortLabel').textContent = `Top of ${field.label}`;
    const arrow = key => _repSortKey === key ? (REP_SORT_FIELDS[key].type === 'string' ? ' ▴' : ' ▾') : '';
    const th = (key, cls) => `<th class="${cls || ''} sortable" onclick="setRepSort('${key}')">${REP_SORT_FIELDS[key].label}${arrow(key)}</th>`;

    document.getElementById('repTableWrap').innerHTML = `
        <div class="dash-tbl-scroll">
        <table class="dash-tbl">
            <thead><tr>
                <th class="c">#</th>
                ${th('rep')}
                ${th('share', 'r')}
                ${th('amt', 'r')}
                ${th('gp', 'r')}
                ${th('gpPct', 'r')}
                ${th('account', 'r')}
                ${th('opp', 'r')}
            </tr></thead>
            <tbody>
                ${rows.map(([owner, d], i) => {
                    const margin = pctStr(d.gp, d.amt);
                    // % of TOTAL revenue across every rep — same definition
                    // as Lead Source Detail's own Share column, not "% of
                    // whoever's on top" (that was the confusing version,
                    // see the column's earlier "Top of Amount" naming).
                    const pct = grandOrigAmt > 0 ? (d.amt / grandOrigAmt * 100).toFixed(1) : '0.0';
                    const isOpen = _repExpanded.has(owner);
                    // Per-BU breakdown, only built when actually expanded —
                    // Share% still has no per-BU meaning (it's "of company
                    // total", not "of this BU"), so that cell stays blank;
                    // Account now does (see ownerBU's own accounts Set above).
                    const buRows = !isOpen ? '' : [...d.byBU.entries()]
                        .sort((a, b) => b[1].amt - a[1].amt)
                        .map(([bu, bd]) => {
                            const buMargin = pctStr(bd.gp, bd.amt);
                            return `<tr class="rep-bu-row">
                                <td></td>
                                <td><span class="bu-mini-badge" style="color:${buColor(bu)}">${esc(bu)}</span></td>
                                <td></td>
                                <td class="r">${fmtN(bd.amt)} ฿</td>
                                <td class="r amt-green">${fmtN(bd.gp)} ฿</td>
                                <td class="r">${buMargin || '—'}</td>
                                <td class="r">${bd.accountCount}</td>
                                <td class="r">${bd.count}</td>
                            </tr>`;
                        }).join('');
                    return `<tr class="rep-row${isOpen ? ' open' : ''}" onclick="toggleRepRow('${esc(owner).replace(/'/g, "\\'")}')">
                        <td class="c">${rankBadge(i)}</td>
                        <td class="strong"><i class="bi bi-chevron-right rep-chevron"></i>${(() => {
                            const op = _profileMap.get(owner);
                            const avatar = op?.avatar_url
                                ? `<img src="${esc(op.avatar_url)}" alt="">`
                                : `<span>${esc(getInitials((op?.nick_name || owner || '').replace(/\s*\(.*$/, '')))}</span>`;
                            return `<span class="rep-avatar">${avatar}</span>`;
                        })()}${esc(owner)}</td>
                        <td class="r"><span class="share-badge">${pct}%</span></td>
                        <td class="r strong">${fmtN(d.amt)} ฿</td>
                        <td class="r amt-green">${fmtN(d.gp)} ฿</td>
                        <td class="r">${margin || '—'}</td>
                        <td class="r">${d.accountCount}</td>
                        <td class="r">${d.count}</td>
                    </tr>${buRows}`;
                }).join('')}
            </tbody>
        </table>
        </div>
    `;
}

// ── Top Partner ───────────────────────────────────────────────────────────────
// Same sortable/scrollable pattern as Sales Performance — click a
// header to sort by it (fixed direction per column, no toggle), max ~10
// rows visible with the rest reachable by scroll instead of a hard
// slice(0, 10) cutoff.
const CLIENT_SORT_FIELDS = {
    name:  { label: 'Partner',     get: (key, d) => d.name, type: 'string' },
    opp:   { label: 'Opportunity', get: (key, d) => d.count, type: 'number' },
    amt:   { label: 'Amount',      get: (key, d) => d.amt,  type: 'number' },
    gp:    { label: 'GP',          get: (key, d) => d.gp,   type: 'number' },
    gpPct: { label: 'GP%',         get: (key, d) => d.amt ? d.gp / d.amt : -1, type: 'number' },
    share: SHARE_SORT_FIELD,
};
let _clientSortKey = 'gp';
let _clientAccountMap = null;
let _clientGrandAmt = 0;

function setClientSort(key) {
    _clientSortKey = key;
    renderClientTable({ accountMap: _clientAccountMap, grandOrigAmt: _clientGrandAmt });
}

function renderClientTable({ accountMap, grandOrigAmt }) {
    _clientAccountMap = accountMap;
    _clientGrandAmt = grandOrigAmt;
    const field = CLIENT_SORT_FIELDS[_clientSortKey];
    const rows = sortTableRows([...accountMap.entries()], field);
    if (!rows.length) { document.getElementById('clientTableWrap').innerHTML = '<div class="dash-empty">No data</div>'; return; }

    document.getElementById('clientSortLabel').textContent = `Top of ${field.label}`;
    const arrow = key => _clientSortKey === key ? (CLIENT_SORT_FIELDS[key].type === 'string' ? ' ▴' : ' ▾') : '';
    const th = (key, cls) => `<th class="${cls || ''} sortable" onclick="setClientSort('${key}')">${CLIENT_SORT_FIELDS[key].label}${arrow(key)}</th>`;

    document.getElementById('clientTableWrap').innerHTML = `
        <div class="dash-tbl-scroll">
        <table class="dash-tbl">
            <thead><tr>
                <th class="c">#</th>
                ${th('name')}
                ${th('amt', 'r')}
                ${th('gp', 'r')}
                ${th('gpPct', 'r')}
                ${th('opp', 'r')}
                ${th('share', 'r')}
            </tr></thead>
            <tbody>
                ${rows.map(([, d], i) => {
                    const margin = pctStr(d.gp, d.amt);
                    const pct = grandOrigAmt > 0 ? (d.amt / grandOrigAmt * 100).toFixed(1) : '0.0';
                    return `<tr>
                        <td class="c">${rankBadge(i)}</td>
                        <td class="strong">${esc(d.name)}</td>
                        <td class="r strong">${fmtN(d.amt)} ฿</td>
                        <td class="r amt-green">${fmtN(d.gp)} ฿</td>
                        <td class="r">${margin || '—'}</td>
                        <td class="r">${d.count}</td>
                        <td class="r"><span class="share-badge">${pct}%</span></td>
                    </tr>`;
                }).join('')}
            </tbody>
        </table>
        </div>
    `;
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function initPage() {
    sessionStorage.removeItem('bx_perms_baccount');
    await initLayout(B_ACCOUNT_CONFIG);
    if (!canBaccount('dashboard')) { window.location.replace('b-opportunity-list.html'); return; }
    initFilterDropdowns();
    await loadData();
    createPullToRefresh({
        container: document.getElementById('dashContainer'),
        track: document.querySelector('.dash-wrap'),
        onRefresh: loadData
    });
}
initPage();
</script>
