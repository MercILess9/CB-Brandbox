<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>B-ACCOUNT | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="/system/config.js"></script>
    <script src="/system/system.js"></script>
    <script src="/system/pull-refresh.js"></script>
    <script src="/system/multi-select.js"></script>
    <script src="b-account.js"></script>
    <link rel="stylesheet" href="/system/theme.css">
    <link rel="stylesheet" href="b-account.css">
    <style>
        body { padding-bottom: 80px; }

        /* ── Filter bar ── */
        /* top:64px, not 0 — the shared system header (system/header.html)
           is position:fixed, 64px tall, z-index:1000. A sticky top:0 bar
           would end up stuck at the exact same screen position once
           scrolled, and the header's much higher z-index paints over it
           completely (looks like the filter bar just vanishes). */
        .dash-ctrl { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 10px 20px; position: sticky; top: 64px; z-index: 100; }
        .dash-ctrl-inner { max-width: 1320px; margin: 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .dash-updated { font-size: 0.7rem; color: #94a3b8; white-space: nowrap; flex-shrink: 0; margin-left: auto; display: inline-flex; align-items: center; gap: 5px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── BU chips — pushed to the opposite edge from Year/Month ── */
        .bu-chip-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }
        .bu-chip-reset { border: 1px solid #e2e8f0; background: #fff; color: #94a3b8; border-radius: 50%; width: 34px; height: 34px; font-size: 0.95rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .bu-chip-reset:hover { background: var(--c-bg); color: var(--c-accent-dark); border-color: #cbd5e1; }
        .bu-chip { border: 1.5px solid; border-radius: 20px; padding: 0 14px; height: 34px; font-size: 0.75rem; font-weight: 800; cursor: pointer; font-family: inherit; white-space: nowrap; transition: 0.2s; background: #fff; opacity: 0.45; }
        .bu-chip.active { opacity: 1; }

        /* ── Wrap ── */
        .dash-wrap { max-width: 1320px; margin: 0 auto; padding: 18px 20px 0; position: relative; z-index: 1; }

        /* ── KPI Row ── */
        .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
        @media (max-width: 900px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
        .kpi-card { background: #fff; border: 1px solid #eef2f7; border-radius: 16px; padding: 15px 18px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
        .kpi-label { font-size: 0.65rem; font-weight: 800; color: var(--c-slate); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; display: flex; align-items: center; gap: 7px; }
        .kpi-icon-chip { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.68rem; flex-shrink: 0; }
        .kpi-icon-chip.blue   { background: rgba(59,130,246,0.12);  color: #3b82f6; }
        .kpi-icon-chip.accent { background: rgba(189,196,50,0.2);   color: #7a8500; }
        .kpi-icon-chip.green  { background: rgba(22,163,74,0.12);   color: #16a34a; }
        .kpi-icon-chip.warn   { background: rgba(245,158,11,0.14);  color: #b45309; }
        /* Every headline number shares one neutral ink color — color lives
           only in the icon chip + % badge now, not painted across the whole
           card, per the "one accent at a time" premium-dashboard note. */
        .kpi-val { font-size: 1.45rem; font-weight: 800; color: #1e293b; line-height: 1.1; letter-spacing: -0.5px; }
        .kpi-sub { font-size: 0.8rem; color: #94a3b8; margin-top: 3px; }
        .kpi-val-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .kpi-status-rows { display: flex; flex-direction: column; gap: 4px; }
        .kpi-status-row { display: flex; align-items: center; gap: 6px; font-size: 0.74rem; color: var(--c-slate); font-weight: 600; }
        .kpi-status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .kpi-status-cnt { margin-left: auto; font-weight: 800; color: #1e293b; }
        .kpi-badge { display: inline-flex; align-items: center; flex-shrink: 0; font-size: 0.85rem; font-weight: 800; padding: 3px 11px; border-radius: 20px; background: rgba(22,163,74,0.1); border: 1px solid rgba(22,163,74,0.35); color: #16a34a; text-transform: none; letter-spacing: normal; }
        .kpi-badge.warn { background: rgba(245,158,11,0.12); border-color: rgba(245,158,11,0.35); color: #b45309; }

        /* ── Section header ── */
        .sec-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
        .sec-hd-bar { width: 4px; height: 18px; background: #bdc432; border-radius: 2px; flex-shrink: 0; }
        .sec-hd-bar.c-red { background: #ef4444; }
        .sec-hd-title { font-size: 0.75rem; font-weight: 800; color: #1e293b; text-transform: uppercase; letter-spacing: 0.5px; }
        /* The page's own name/identity, not just a section label — allowed
           to stand out a bit more than the plain section headers below it. */
        .sec-hd-title-main { font-size: 1.05rem; display: inline-flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: normal; }
        .sec-hd-sub { font-size: 0.68rem; color: #94a3b8; margin-left: auto; }
        .sec-block { margin-bottom: 34px; }

        /* ── Cards ── */
        .dash-card { background: #fff; border: 1px solid #eef2f7; border-radius: 16px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }

        /* ── BU breakdown cards ── */
        .bu-card-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        @media (max-width: 900px) { .bu-card-row { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 560px) { .bu-card-row { grid-template-columns: 1fr; } }
        .bu-card { background: #fff; border: 1px solid #eef2f7; border-left: 4px solid; border-radius: 16px; padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
        .bu-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 8px; }
        .bu-card-name { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bu-card-pct { font-size: 0.72rem; font-weight: 800; color: #1e293b; flex-shrink: 0; }
        .bu-card-amt { font-size: 1.15rem; font-weight: 800; color: #1e293b; margin-bottom: 4px; }
        .bu-card-gp-row { display: flex; align-items: center; gap: 6px; font-size: 0.68rem; color: #94a3b8; margin-bottom: 3px; }
        .bu-card-gp-badge { display: inline-flex; align-items: center; font-size: 0.65rem; font-weight: 800; padding: 1px 8px; border-radius: 20px; background: rgba(22,163,74,0.1); border: 1px solid rgba(22,163,74,0.35); color: #16a34a; }
        .bu-card-deals { font-size: 0.68rem; color: #94a3b8; margin-bottom: 9px; }
        .bu-card-bar { height: 4px; background: #f1f5f9; border-radius: 99px; overflow: hidden; }
        .bu-card-bar-fill { height: 100%; border-radius: 99px; }

        /* ── Main grid: Lead Source (chart | detail table) ── */
        .split-grid { display: grid; grid-template-columns: 1fr 560px; gap: 14px; align-items: start; }
        @media (max-width: 900px) { .split-grid { grid-template-columns: 1fr; } }

        /* ── Two self-contained donut cards side by side (BU share | Business
           Type share) — each card carries its own chart + legend together,
           no separate detail-list card. ── */
        .donut-split-grid { display: grid; grid-template-columns: 30% 70%; gap: 14px; align-items: start; }
        @media (max-width: 900px) { .donut-split-grid { grid-template-columns: 1fr; } }
        .donut-combo { display: flex; align-items: center; gap: 20px; }
        @media (max-width: 560px) { .donut-combo { flex-direction: column; } }

        /* ── Donut + legend (Status / Business Type) — 30/70 split so the
           legend column always gets the lion's share of the card width. ── */
        .donut-wrap { display: flex; align-items: center; justify-content: center; padding: 4px 0 8px; flex: 0 1 30%; }
        .status-legend { display: flex; flex-direction: column; gap: 7px; flex: 0 1 70%; min-width: 0; }
        .leg-row { display: flex; align-items: center; gap: 8px; }
        .leg-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
        .leg-name { font-size: 0.74rem; font-weight: 600; color: #475569; flex: 1; }
        .leg-pct  { font-size: 0.65rem; color: #94a3b8; width: 34px; text-align: right; }
        /* BU legend dropped the count column — % should sit right next to
           the name instead of being stranded at the far right edge, and
           read clearly since it's now the only secondary value in the row. */
        #buChartLegend .leg-name { flex: 0 0 auto; }
        #buChartLegend .leg-pct { width: auto; margin-left: 8px; font-size: 0.85rem; font-weight: 800; color: #1e293b; }

        /* ── Monthly chart ── */
        .monthly-wrap { height: 320px; }
        .lead-chart-wrap { height: 280px; }
        /* Own header variant — wraps to a 2nd line instead of overflowing
           when By BU mode's legend has too many items (up to 7 BUs) to sit
           next to the title + toggle on one row. */
        .sec-hd-trend { flex-wrap: wrap; row-gap: 8px; }
        .trend-legend { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-left: auto; }
        .trend-legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; font-weight: 700; color: #475569; white-space: nowrap; cursor: pointer; user-select: none; transition: opacity 0.15s; }
        .trend-legend-item:hover { opacity: 0.75; }
        .trend-legend-item.is-hidden { opacity: 0.4; text-decoration: line-through; }
        .trend-legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
        /* Sliding-pill toggle — exact recipe as .sort-seg-wrap/-slider above
           (2-way, fixed 50/50 split via flex:1 + translateX(100%)), not a
           hand-rolled bordered-box segmented control. */
        .trend-mode-toggle { display: flex; flex-shrink: 0; }
        .trend-toggle-group { position: relative; display: flex; align-items: center; background: var(--c-bg); border: 1px solid #e2e8f0; border-radius: 20px; height: 38px; padding: 3px; }
        .trend-toggle-slider { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); background: var(--c-accent-light); border: 1px solid var(--c-accent); border-radius: 17px; transition: transform 0.25s cubic-bezier(.4,0,.2,1); z-index: 0; }
        .trend-toggle-group:has(.trend-mode-btn:last-child.active) .trend-toggle-slider { transform: translateX(100%); }
        .trend-mode-btn { position: relative; z-index: 1; flex: 1; height: 100%; border: none; background: transparent; padding: 0 16px; font-size: 0.74rem; font-weight: 700; color: var(--c-slate); cursor: pointer; white-space: nowrap; transition: color 0.2s; font-family: inherit; outline: none; }
        .trend-mode-btn.active { color: var(--c-accent-dark); }
        .trend-mode-btn:not(.active):hover { color: var(--c-accent); }

        /* ── Churn KPIs ── */
        .churn-kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
        @media (max-width: 900px) { .churn-kpi-row { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 560px) { .churn-kpi-row { grid-template-columns: 1fr; } }
        .churn-kpi-card { background: #fef2f2; border: 1px solid #fecaca; border-radius: 16px; padding: 15px 18px; }
        .churn-kpi-label { font-size: 0.6rem; font-weight: 800; color: #b91c1c; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
        .churn-kpi-val { font-size: 1.3rem; font-weight: 800; color: #991b1b; }
        .churn-kpi-sub { font-size: 0.68rem; color: #b91c1c; opacity: 0.75; margin-top: 3px; }

        /* ── Generic dashboard table (Churn deals / Lead Source / Sales Rep / Top Clients) ── */
        .dash-tbl { width: 100%; border-collapse: collapse; }
        .dash-tbl th { font-size: 0.6rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.6px; padding: 0 10px 10px; border-bottom: 2px solid #f1f5f9; white-space: nowrap; text-align: left; }
        .dash-tbl th.r, .dash-tbl td.r { text-align: right; }
        .dash-tbl th.c, .dash-tbl td.c { text-align: center; }
        .dash-tbl td { padding: 9px 10px; border-bottom: 1px solid #f8fafc; font-size: 0.79rem; vertical-align: middle; color: #475569; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .dash-tbl td:first-child { font-variant-numeric: normal; }
        .dash-tbl tr:last-child td { border-bottom: none; }
        .dash-tbl tbody tr:hover td { background: #f8fafc; }
        .dash-tbl .strong { font-weight: 700; color: #1e293b; }
        .dash-tbl .amt-red { color: #dc2626; font-weight: 700; }
        .dash-tbl .amt-green { color: #16a34a; font-weight: 700; }
        .bu-mini-badge { background: #f1f5f9; color: #64748b; font-size: 0.66rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; }

        /* ── Rank badges (Sales Rep / Top Clients) ── */
        .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; font-size: 0.72rem; font-weight: 800; color: #fff; }
        .rank-badge.r1 { background: #f59e0b; }
        .rank-badge.r2 { background: #94a3b8; }
        .rank-badge.r3 { background: #c2703d; }
        .rank-plain { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; font-size: 0.75rem; font-weight: 700; color: #94a3b8; }

        /* ── Inline mini share bar (table cells) ── */
        .cell-bar-row { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
        .cell-bar-track { width: 60px; height: 5px; background: #f1f5f9; border-radius: 99px; overflow: hidden; flex-shrink: 0; }
        .cell-bar-fill { height: 100%; border-radius: 99px; background: #1e293b; }
        .cell-bar-pct { font-size: 0.7rem; color: #94a3b8; width: 36px; text-align: right; flex-shrink: 0; }

        /* ── Empty / loading ── */
        .dash-empty { display: flex; align-items: center; justify-content: center; height: 100px; color: #94a3b8; font-size: 0.78rem; gap: 7px; }
        .dash-spinner { animation: spin 1s linear infinite; }
    </style>
</head>
<body>

<div class="dash-ctrl">
    <div class="dash-ctrl-inner">
        <div class="flt-select-box" id="wrap-filterYear" style="width:150px"></div>
        <div class="flt-select-box" id="wrap-filterMonth" style="width:160px"></div>
        <div class="bu-chip-row" id="buChipRow"></div>
    </div>
</div>

<div id="dashContainer" style="position:relative;">
<div class="dash-wrap">

    <!-- KPIs -->
    <div class="sec-hd">
        <span class="sec-hd-title sec-hd-title-main"><i class="bi bi-bar-chart-fill" style="color:var(--c-accent)"></i> B-ACCOUNT Dashboard</span>
        <span class="dash-updated" id="dashUpdated"></span>
    </div>
    <div class="kpi-row" id="kpiRow">
        <div class="kpi-card"><div class="dash-empty dash-spinner" style="height:50px"><i class="bi bi-arrow-repeat"></i></div></div>
        <div class="kpi-card"></div>
        <div class="kpi-card"></div>
        <div class="kpi-card"></div>
    </div>

    <!-- Monthly Trend -->
    <div class="dash-card sec-block">
        <div class="sec-hd sec-hd-trend">
            <div class="sec-hd-bar"></div>
            <span class="sec-hd-title">Sales Trend</span>
            <div class="trend-legend" id="trendLegend"></div>
            <div class="trend-mode-toggle">
                <div class="trend-toggle-group" id="trendBreakdownGroup">
                    <div class="trend-toggle-slider"></div>
                    <button class="trend-mode-btn active" data-bd="amtgp" onclick="setTrendBreakdown('amtgp')">Amount/GP</button>
                    <button class="trend-mode-btn" data-bd="bu" onclick="setTrendBreakdown('bu')">By BU</button>
                </div>
            </div>
        </div>
        <div class="monthly-wrap" id="monthlyWrap"><canvas id="monthlyChart"></canvas></div>
    </div>

    <!-- Sales Trend — plain values table, its own card so the chart card
         above doesn't grow tall/scrollable when there's 12+ rows to show. -->
    <div class="dash-card sec-block">
        <div class="sec-hd">
            <div class="sec-hd-bar"></div>
            <span class="sec-hd-title">Trend Detail</span>
        </div>
        <div id="trendTableWrap"></div>
    </div>

    <!-- BU Breakdown -->
    <div class="sec-block">
        <div class="sec-hd">
            <div class="sec-hd-bar"></div>
            <span class="sec-hd-title">Sales by Business Unit</span>
            <span class="sec-hd-sub" id="buCount"></span>
        </div>
        <div class="bu-card-row" id="buCardRow">
            <div class="dash-empty"><i class="bi bi-arrow-repeat dash-spinner"></i> Loading…</div>
        </div>
    </div>

    <!-- Business Type: donut + list -->
    <div class="donut-split-grid sec-block">
        <div class="dash-card">
            <div class="sec-hd">
                <div class="sec-hd-bar"></div>
                <span class="sec-hd-title">Sales by Business Unit · Share</span>
            </div>
            <div class="donut-combo">
                <div class="donut-wrap"><canvas id="buChart" width="160" height="160"></canvas></div>
                <div class="status-legend" id="buChartLegend"></div>
            </div>
        </div>
        <div class="dash-card">
            <div class="sec-hd">
                <div class="sec-hd-bar"></div>
                <span class="sec-hd-title">Business Type · Share of Sales</span>
            </div>
            <div class="donut-combo">
                <div class="donut-wrap"><canvas id="typeChart" width="160" height="160"></canvas></div>
                <div class="status-legend" id="typeLegend"></div>
            </div>
        </div>
    </div>

    <!-- Churn Analysis -->
    <div class="sec-block">
        <div class="sec-hd">
            <div class="sec-hd-bar c-red"></div>
            <span class="sec-hd-title">Churn Analysis</span>
        </div>
        <div class="churn-kpi-row" id="churnKpiRow"></div>
        <div class="dash-card">
            <div class="sec-hd">
                <span class="sec-hd-title" style="text-transform:none;font-size:0.78rem">Churned Deals</span>
                <span class="sec-hd-sub" id="churnCount"></span>
            </div>
            <div id="churnTableWrap"><div class="dash-empty"><i class="bi bi-arrow-repeat dash-spinner"></i></div></div>
        </div>
    </div>

    <!-- Lead Source -->
    <div class="split-grid sec-block">
        <div class="dash-card">
            <div class="sec-hd">
                <div class="sec-hd-bar"></div>
                <span class="sec-hd-title">Revenue by Lead Source</span>
            </div>
            <div class="lead-chart-wrap"><canvas id="leadChart"></canvas></div>
        </div>
        <div class="dash-card">
            <div class="sec-hd">
                <div class="sec-hd-bar"></div>
                <span class="sec-hd-title">Lead Source Detail</span>
            </div>
            <div id="leadTableWrap"><div class="dash-empty"><i class="bi bi-arrow-repeat dash-spinner"></i></div></div>
        </div>
    </div>

    <!-- Sales Rep Performance -->
    <div class="dash-card sec-block">
        <div class="sec-hd">
            <div class="sec-hd-bar"></div>
            <span class="sec-hd-title">Sales Rep Performance</span>
            <span class="sec-hd-sub">Ranked by Amount</span>
        </div>
        <div id="repTableWrap"><div class="dash-empty"><i class="bi bi-arrow-repeat dash-spinner"></i></div></div>
    </div>

    <!-- Top Clients -->
    <div class="dash-card sec-block">
        <div class="sec-hd">
            <div class="sec-hd-bar"></div>
            <span class="sec-hd-title">Top Clients</span>
            <span class="sec-hd-sub">Ranked by Amount</span>
        </div>
        <div id="clientTableWrap"><div class="dash-empty"><i class="bi bi-arrow-repeat dash-spinner"></i></div></div>
    </div>

</div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let _opps  = [];
let _qtMap = new Map(); // oppId → [{qt_type, b_opportunity_qt_item:[{bu,qty,price,discount,gp}]}]
let _accMap = new Map(); // account_id → {account_name}
let _cfgBU  = []; // ordered list of BU values from config — drives chip order + stable color assignment
let _yearFilters  = new Set(); // empty = default (current year); multi-select supported
let _monthFilters = new Set(); // '01'..'12', empty = all months
let _buFilters    = new Set(); // empty = all BUs
let _chartMonthly = null;
let _chartType    = null;
let _chartBU      = null;
let _chartLead    = null;
let _trendBreakdown = 'amtgp'; // 'amtgp' | 'bu'
// A year-over-year Compare mode (MoM/QoQ, with its own Normal/Compare and
// granularity toggles) was built and rolled back for being confusing —
// keeping this section to the plain trend only, on purpose, for now.

const TYPE_CLR = { 'New Business': '#1d4ed8', 'Retention': '#6d28d9', 'Up Sale': '#0d7a70' }; // ref .op-type badge colors in b-opportunity-list.html
const STATUS_CLR = { 'Churn': '#f97316', 'End Contact': '#64748b' }; // ref .op-card.churn/.ended — everything else uses the brand accent
const CAT_PALETTE = ['#3b82f6','#8b5cf6','#f97316','#0ea5e9','#ec4899','#14b8a6','#eab308','#6366f1'];
const MONTHS   = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function buColor(bu) {
    const idx = _cfgBU.indexOf(bu);
    return CAT_PALETTE[(idx >= 0 ? idx : 0) % CAT_PALETTE.length];
}
function statusColor(s) { return STATUS_CLR[s] || '#bdc432'; }

// ── Format helpers ─────────────────────────────────────────────────────────────
function fmtK(n) {
    if (!n || isNaN(+n) || +n === 0) return '—';
    const v = +n;
    if (v >= 1e6) return (v/1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (v >= 1e3) return (v/1e3).toFixed(1).replace(/\.0$/, '') + 'K';
    return v.toLocaleString('en-US');
}
function fmtN(n) {
    if (!n || isNaN(+n) || +n === 0) return '—';
    return fmtMoney(n);
}
function pctStr(a, b) {
    if (!a || !b || +b === 0) return null;
    return (+a / +b * 100).toFixed(1) + '%';
}

// ── Year tabs ─────────────────────────────────────────────────────────────────
// Dropdown-checkbox popovers (system/multi-select.js) — same component the
// Opportunity/Account List filter bars already use, instead of a fixed row
// of year-tab buttons (doesn't scale) or a native single-select <select>
// (can't multi-select at all).
let _yearMS = null, _monthMS = null;

function initFilterDropdowns() {
    const cur = new Date().getFullYear();
    const years = [];
    for (let y = cur; y >= 2024; y--) years.push(y); // newest first in the checklist

    _yearMS = createMultiSelect({
        trigger: document.getElementById('wrap-filterYear'),
        label: 'Year',
        getOptions: () => years.map(y => ({ value: String(y), label: String(y) })),
        onChange: values => { _yearFilters = new Set(values.map(Number)); render(); }
    });

    _monthMS = createMultiSelect({
        trigger: document.getElementById('wrap-filterMonth'),
        label: 'Month',
        getOptions: () => MONTHS.map((m, i) => ({ value: String(i + 1).padStart(2, '0'), label: m })),
        onChange: values => { _monthFilters = new Set(values); render(); }
    });

    // Default to "this month, this year" on first load — same as what the
    // Reset button snaps back to — instead of an all-time view. setValues()
    // doesn't fire onChange, so the app-state Sets are set directly here too.
    const now = new Date();
    _yearFilters = new Set([now.getFullYear()]);
    _monthFilters = new Set([String(now.getMonth() + 1).padStart(2, '0')]);
    _yearMS.setValues([String(now.getFullYear())]);
    _monthMS.setValues([String(now.getMonth() + 1).padStart(2, '0')]);
}

// ── BU chips ──────────────────────────────────────────────────────────────────
function renderBuChips() {
    const resetBtn = `<button class="bu-chip-reset" onclick="resetAllFilters()" title="Reset to this month, all BUs"><i class="bi bi-arrow-counterclockwise"></i></button>`;
    const chips = _cfgBU.map(bu => {
        const active = _buFilters.size === 0 || _buFilters.has(bu);
        const c = buColor(bu);
        return `<button class="bu-chip${active ? ' active' : ''}" style="border-color:${c};color:${c}" onclick="toggleBuChip('${esc(bu)}')">${esc(bu)}</button>`;
    }).join('');
    document.getElementById('buChipRow').innerHTML = chips + resetBtn;
}

function toggleBuChip(bu) {
    // _buFilters holds the set of currently-INCLUDED BUs; empty means "all
    // included" (the sentinel/default state). Clicking a chip while every BU
    // is implicitly included first expands the set to everyone else, which
    // switches this one chip off while leaving the rest on.
    if (_buFilters.size === 0) {
        _cfgBU.forEach(b => { if (b !== bu) _buFilters.add(b); });
    } else if (_buFilters.has(bu)) {
        // Refuse to shrink to zero — an empty Set is the sentinel for "all
        // included" (see buPasses), so deleting the last remaining BU would
        // silently flip back to showing everything instead of showing
        // nothing, the opposite of what turning off the last chip should do.
        if (_buFilters.size === 1) return;
        _buFilters.delete(bu);
    } else {
        _buFilters.add(bu);
    }
    // Every BU included again → collapse back to the empty "all" sentinel.
    if (_buFilters.size >= _cfgBU.length) _buFilters.clear();
    renderBuChips();
    render();
}

// Reset icon — not just BU: snaps the whole filter bar back to "this
// month, every BU" (the sensible default view), not just clearing BU alone.
function resetAllFilters() {
    _buFilters.clear();
    const now = new Date();
    _yearFilters = new Set([now.getFullYear()]);
    _monthFilters = new Set([String(now.getMonth() + 1).padStart(2, '0')]);
    _yearMS?.setValues([String(now.getFullYear())]);
    _monthMS?.setValues([String(now.getMonth() + 1).padStart(2, '0')]);
    renderBuChips();
    render();
}

function buPasses(bu) {
    return _buFilters.size === 0 || _buFilters.has(bu);
}

// ── Load data ─────────────────────────────────────────────────────────────────
async function loadData() {
    const [
        { data: opps,     error: e1 },
        { data: qts,      error: e2 },
        { data: items,    error: e3 },
        { data: accs,     error: e4 },
        { data: cfgBU }
    ] = await Promise.all([
        supabaseClient.from('b_opportunity_list')
            // total_amount/total_gp not selected — every aggregate on this page
            // is derived from b_opportunity_qt_item line items instead.
            .select('opportunity_id, opportunity_name, account_id, status, business_type, lead_source, create_date, churn_date, owner')
            .limit(3000),
        supabaseClient.from('b_opportunity_qt')
            .select('qt_id, opportunity_id, qt_type')
            .limit(5000),
        supabaseClient.from('b_opportunity_qt_item')
            .select('qt_id, bu, qty, price, discount, gp')
            .limit(20000),
        supabaseClient.from('b_account_list').select('account_id, account_name'),
        supabaseClient.from('b_opportunity_config').select('value').eq('type','bu').order('value')
    ]);

    if (e1 || e2 || e3 || e4) { console.error('[dash]', e1 || e2 || e3 || e4); return; }

    _opps = opps || [];
    _accMap = new Map((accs || []).map(a => [a.account_id, a]));
    _cfgBU = (cfgBU || []).map(c => c.value);
    _buFilters.clear();
    renderBuChips();

    // Build qtMap: oppId → [{qt_type, b_opportunity_qt_item:[]}]
    const itemsByQT = new Map();
    (items || []).forEach(item => {
        if (!itemsByQT.has(item.qt_id)) itemsByQT.set(item.qt_id, []);
        itemsByQT.get(item.qt_id).push(item);
    });

    _qtMap.clear();
    (qts || []).forEach(qt => {
        if (!_qtMap.has(qt.opportunity_id)) _qtMap.set(qt.opportunity_id, []);
        _qtMap.get(qt.opportunity_id).push({
            qt_type: qt.qt_type,
            b_opportunity_qt_item: itemsByQT.get(qt.qt_id) || []
        });
    });

    const _now = new Date();
    document.getElementById('dashUpdated').innerHTML = `<i class="bi bi-clock-history"></i> Last Update : `
        + _now.toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric' })
        + ' ' + _now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

    render();
}

// ── Compute aggregates ─────────────────────────────────────────────────────────
function yearPasses(createDate) {
    if (_yearFilters.size === 0) return true;
    return _yearFilters.has(+(createDate || '').slice(0, 4));
}

function computeData() {
    const filtered = _opps.filter(o => {
        if (!yearPasses(o.create_date)) return false;
        if (_monthFilters.size && !_monthFilters.has((o.create_date || '').slice(5,7))) return false;
        return true;
    });

    let totalDeals = 0;
    let grandOrigAmt = 0, grandOrigGP = 0, grandChurnAmt = 0, grandChurnGP = 0;

    const buMap      = new Map(); // bu     → { deals:Set, origAmt, origGP, churnAmt }
    const typeMap    = new Map(); // type   → { count, amt, gp }
    const leadMap    = new Map(); // lead_source → { count, amt, gp }
    const ownerMap   = new Map(); // owner  → { count, amt, gp }
    const accountMap = new Map(); // account_id → { count, amt, gp }
    const statusMap  = new Map(); // status → count
    const churnRows  = []; // { account, opportunity, bu, amt, owner, date }

    for (const opp of filtered) {
        const qts = _qtMap.get(opp.opportunity_id) || [];
        // Opportunity/Status now respect the BU filter too — an opportunity
        // only counts here if it has at least one line item in a BU that's
        // currently included (an opportunity can span multiple BUs across
        // its QT items, so "included" means "has any", not "only"). When no
        // BU filter is active (_buFilters empty) every opportunity counts,
        // same as before.
        const hasPassingBU = _buFilters.size === 0 || qts.some(qt => (qt.b_opportunity_qt_item || []).some(i => buPasses(i.bu || 'Other')));
        if (!hasPassingBU) continue;

        totalDeals++;
        const st = opp.status || 'Unknown';
        statusMap.set(st, (statusMap.get(st) || 0) + 1);

        const type   = opp.business_type || 'Other';
        const owner  = opp.owner         || 'Unknown';
        const lead   = opp.lead_source   || 'Unknown';
        const accKey = opp.account_id || 'Unknown';
        const accName = _accMap.get(opp.account_id)?.account_name || 'Unknown';

        for (const qt of qts) {
            const rawItems = (qt.b_opportunity_qt_item || []).filter(i => buPasses(i.bu || 'Other'));
            if (!rawItems.length) continue;

            if (qt.qt_type === 'churn') {
                let churnAmtQT = 0, churnGPQT = 0;
                const busInQT = new Set();
                for (const item of rawItems) {
                    const amt = Math.max(0, (+(item.qty) || 0) * (+(item.price) || 0) - (+(item.discount) || 0));
                    const gp  = +(item.gp) || 0;
                    const bu  = item.bu || 'Other';
                    churnAmtQT += amt;
                    churnGPQT  += gp;
                    grandChurnAmt += amt;
                    grandChurnGP  += gp;
                    busInQT.add(bu);
                    if (!buMap.has(bu)) buMap.set(bu, { deals: new Set(), origAmt: 0, origGP: 0, churnAmt: 0 });
                    buMap.get(bu).deals.add(opp.opportunity_id);
                    buMap.get(bu).churnAmt += amt;
                }
                if (churnAmtQT > 0) {
                    churnRows.push({
                        account: accName,
                        opportunity: opp.opportunity_name || opp.opportunity_id,
                        bu: [...busInQT].join(', '),
                        amt: churnAmtQT,
                        gp: churnGPQT,
                        owner,
                        date: opp.churn_date
                    });
                }
                continue;
            }

            for (const item of rawItems) {
                const amt = Math.max(0, (+(item.qty) || 0) * (+(item.price) || 0) - (+(item.discount) || 0));
                const gp  = +(item.gp) || 0;
                const bu  = item.bu || 'Other';

                if (!buMap.has(bu)) buMap.set(bu, { deals: new Set(), origAmt: 0, origGP: 0, churnAmt: 0 });
                buMap.get(bu).deals.add(opp.opportunity_id);
                buMap.get(bu).origAmt += amt;
                buMap.get(bu).origGP  += gp;

                grandOrigAmt += amt;
                grandOrigGP  += gp;

                if (!typeMap.has(type)) typeMap.set(type, { count: 0, amt: 0, gp: 0, deals: new Set() });
                typeMap.get(type).amt += amt; typeMap.get(type).gp += gp; typeMap.get(type).deals.add(opp.opportunity_id);

                if (!ownerMap.has(owner)) ownerMap.set(owner, { count: 0, amt: 0, gp: 0, deals: new Set() });
                ownerMap.get(owner).amt += amt; ownerMap.get(owner).gp += gp; ownerMap.get(owner).deals.add(opp.opportunity_id);

                if (!leadMap.has(lead)) leadMap.set(lead, { count: 0, amt: 0, gp: 0, deals: new Set() });
                leadMap.get(lead).amt += amt; leadMap.get(lead).gp += gp; leadMap.get(lead).deals.add(opp.opportunity_id);

                if (!accountMap.has(accKey)) accountMap.set(accKey, { name: accName, amt: 0, gp: 0, deals: new Set() });
                accountMap.get(accKey).amt += amt; accountMap.get(accKey).gp += gp; accountMap.get(accKey).deals.add(opp.opportunity_id);
            }
        }
    }

    // Finalize deal counts from the Sets built above
    typeMap.forEach(d => { d.count = d.deals.size; });
    ownerMap.forEach(d => { d.count = d.deals.size; });
    leadMap.forEach(d => { d.count = d.deals.size; });
    accountMap.forEach(d => { d.count = d.deals.size; });

    return { totalDeals, grandOrigAmt, grandOrigGP, grandChurnAmt, grandChurnGP, buMap, typeMap, leadMap, ownerMap, accountMap, statusMap, churnRows };
}

// Sales Trend's own filtered set — deliberately ignores the Month dropdown
// filter (that filter narrows every other section, but the trend chart's
// whole point is to show the full year's shape) while still respecting
// Year like everything else. BU is applied per-item below (via buPasses)
// since it's the axis the "By BU" mode breaks out by.
function trendFilteredOpps() {
    return _opps.filter(o => yearPasses(o.create_date));
}

function computeTrendMonthMap() {
    const monthMap = new Map();
    for (const opp of trendFilteredOpps()) {
        const month = (opp.create_date || '').slice(0, 7);
        if (!month) continue;
        const qts = _qtMap.get(opp.opportunity_id) || [];
        for (const qt of qts) {
            if (qt.qt_type === 'churn') continue;
            const items = (qt.b_opportunity_qt_item || []).filter(i => buPasses(i.bu || 'Other'));
            for (const item of items) {
                const amt = Math.max(0, (+(item.qty) || 0) * (+(item.price) || 0) - (+(item.discount) || 0));
                const gp  = +(item.gp) || 0;
                if (!monthMap.has(month)) monthMap.set(month, { amt: 0, gp: 0 });
                monthMap.get(month).amt += amt;
                monthMap.get(month).gp  += gp;
            }
        }
    }
    return monthMap;
}

// month → Map(bu → amt) — only counts BUs that currently pass the BU chip
// filter, so "By BU" mode stacks exactly whichever BUs are selected there.
function computeTrendBUMap() {
    const map = new Map();
    for (const opp of trendFilteredOpps()) {
        const month = (opp.create_date || '').slice(0, 7);
        if (!month) continue;
        const qts = _qtMap.get(opp.opportunity_id) || [];
        for (const qt of qts) {
            if (qt.qt_type === 'churn') continue;
            const items = (qt.b_opportunity_qt_item || []).filter(i => buPasses(i.bu || 'Other'));
            for (const item of items) {
                const bu  = item.bu || 'Other';
                const amt = Math.max(0, (+(item.qty) || 0) * (+(item.price) || 0) - (+(item.discount) || 0));
                const gp  = +(item.gp) || 0;
                if (!map.has(month)) map.set(month, new Map());
                const byBu = map.get(month);
                if (!byBu.has(bu)) byBu.set(bu, { amt: 0, gp: 0 });
                const rec = byBu.get(bu);
                rec.amt += amt;
                rec.gp  += gp;
            }
        }
    }
    return map;
}

// ── Render all ────────────────────────────────────────────────────────────────
function render() {
    const d = computeData();
    renderKPIs(d);
    renderBUCards(d);
    renderTrendChart();
    renderBUDonut(d);
    renderTypeDonut(d);
    renderChurnSection(d);
    renderLeadSource(d);
    renderRepTable(d);
    renderClientTable(d);
}

// ── KPIs ──────────────────────────────────────────────────────────────────────
function fmtKPI(n) {
    if (!n || isNaN(+n) || +n === 0) return '฿0';
    const v = +n;
    if (v >= 1e6) return '฿' + (v/1e6).toFixed(2) + 'M';
    if (v >= 1e3) return '฿' + (v/1e3).toFixed(2) + 'K';
    return '฿' + v.toLocaleString('en-US');
}
function fmtWhole(n) {
    if (!n || isNaN(+n) || +n === 0) return '—';
    return Math.round(+n).toLocaleString('en-US') + ' ฿';
}

function renderKPIs({ totalDeals, grandOrigAmt, grandOrigGP, grandChurnAmt, statusMap }) {
    const gpP = pctStr(grandOrigGP, grandOrigAmt);
    const churnRate = pctStr(grandChurnAmt, grandOrigAmt + grandChurnAmt);
    const statusRows = [...statusMap.entries()].sort((a, b) => b[1] - a[1]).map(([s, c]) =>
        `<div class="kpi-status-row"><span class="kpi-status-dot" style="background:${statusColor(s)}"></span>${esc(s)}<span class="kpi-status-cnt">${c}</span></div>`
    ).join('');
    document.getElementById('kpiRow').innerHTML = `
        <div class="kpi-card">
            <div class="kpi-label"><span class="kpi-icon-chip blue"><i class="bi bi-currency-exchange"></i></span> Amount</div>
            <div class="kpi-val">${fmtKPI(grandOrigAmt)}</div>
            <div class="kpi-sub">${fmtWhole(grandOrigAmt)}</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label"><span class="kpi-icon-chip green"><i class="bi bi-graph-up-arrow"></i></span> Gross Profit</div>
            <div class="kpi-val-row">
                <div class="kpi-val">${fmtKPI(grandOrigGP)}</div>
                ${gpP ? `<span class="kpi-badge">${gpP}</span>` : ''}
            </div>
            <div class="kpi-sub">${fmtWhole(grandOrigGP)}</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label"><span class="kpi-icon-chip warn"><i class="bi bi-arrow-down-circle-fill"></i></span> Churn</div>
            <div class="kpi-val-row">
                <div class="kpi-val">${fmtKPI(grandChurnAmt)}</div>
                ${churnRate ? `<span class="kpi-badge warn">${churnRate}</span>` : ''}
            </div>
            <div class="kpi-sub">${fmtWhole(grandChurnAmt)}</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label"><span class="kpi-icon-chip accent"><i class="bi bi-briefcase-fill"></i></span> Opportunity</div>
            <div class="kpi-val-row">
                <div class="kpi-val">${totalDeals}</div>
                <div class="kpi-status-rows">${statusRows}</div>
            </div>
        </div>
    `;
}

// ── BU Cards ──────────────────────────────────────────────────────────────────
function renderBUCards({ buMap, grandOrigAmt }) {
    // Only the BUs configured in b_opportunity_config get their own card —
    // items with no/unmapped bu value used to fall into a catch-all "Other"
    // bucket, which just hid data-quality issues behind a fake category
    // instead of surfacing them. Skip those instead of card-ifying them.
    const rows = [...buMap.entries()]
        .filter(([bu]) => _cfgBU.includes(bu))
        .sort((a, b) => b[1].origAmt - a[1].origAmt);
    document.getElementById('buCount').textContent = rows.length + (rows.length === 1 ? ' BU' : ' BUs');

    if (!rows.length) {
        document.getElementById('buCardRow').innerHTML = '<div class="dash-empty">No data</div>';
        return;
    }

    document.getElementById('buCardRow').innerHTML = rows.map(([bu, d]) => {
        const gPct = pctStr(d.origGP, d.origAmt);
        const share = grandOrigAmt > 0 ? pctStr(d.origAmt, grandOrigAmt) : null;
        const barW = grandOrigAmt > 0 ? Math.min(100, Math.round(d.origAmt / grandOrigAmt * 100)) : 0;
        const c = buColor(bu);
        return `<div class="bu-card" style="border-left-color:${c}">
            <div class="bu-card-top">
                <span class="bu-card-name" style="color:${c}">${esc(bu)}</span>
                <span class="bu-card-pct">${share || '—'}</span>
            </div>
            <div class="bu-card-amt">${fmtN(d.origAmt)} ฿</div>
            <div class="bu-card-gp-row">
                <span>GP ${fmtN(d.origGP)} ฿</span>
                ${gPct ? `<span class="bu-card-gp-badge">${gPct}</span>` : ''}
            </div>
            <div class="bu-card-deals">Opportunity : ${d.deals.size}</div>
            <div class="bu-card-bar"><div class="bu-card-bar-fill" style="width:${barW}%;background:${c}"></div></div>
        </div>`;
    }).join('');
}

// ── Monthly Trend ─────────────────────────────────────────────────────────────
// Always plots Jan-Dec of a calendar year (zero-filled), never a rolling
// window and never narrowed by data presence. One selected year → that
// year's 12 months; 2+ selected years → their Jan-Dec ranges chained in
// order for a multi-year overview; none selected → the current year.
function trend12MonthKeys() {
    const years = _yearFilters.size ? [..._yearFilters].sort((a, b) => a - b) : [new Date().getFullYear()];
    const keys = [];
    years.forEach(year => {
        for (let m = 1; m <= 12; m++) keys.push(`${year}-${String(m).padStart(2, '0')}`);
    });
    return keys;
}

// 'YYYY-MM' → 'Mon YY' — shared by the chart and the detail table below it
// so both read the exact same labels off the exact same keys.
function trendLabels(keys) {
    return keys.map(m => {
        const [y, mo] = m.split('-');
        return MONTHS[+mo - 1] + ' ' + y.slice(2);
    });
}

function setTrendBreakdown(bd) {
    _trendBreakdown = bd;
    document.querySelectorAll('#trendBreakdownGroup .trend-mode-btn').forEach(b => b.classList.toggle('active', b.dataset.bd === bd));
    renderTrendChart();
}

// Computes each mode's month map exactly once per render cycle and hands it
// to both the chart and the detail table below — they used to each call
// computeTrendMonthMap()/computeTrendBUMap() independently, silently
// running the same full scan over _opps/_qtMap/items twice per render.
function renderTrendChart() {
    renderTrendLegend();
    if (_trendBreakdown === 'bu') {
        const buMonthMap = computeTrendBUMap();
        renderTrendByBU(buMonthMap);
        renderTrendRawTable('bu', buMonthMap);
    } else {
        const monthMap = computeTrendMonthMap();
        renderTrendAmtGP(monthMap);
        renderTrendRawTable('amtgp', monthMap);
    }
}

// Custom HTML legend living in the section header (next to the mode
// toggle) — replaces Chart.js's own built-in legend so both can share one
// row. By BU's own color key already lives in the top Filter Bar's BU
// chips (that's the one place BU gets filtered from), so no second
// interactive legend here — it would just be a redundant, confusing
// duplicate "filter BU" control living in two different rows.
function renderTrendLegend() {
    const el = document.getElementById('trendLegend');
    if (_trendBreakdown === 'bu') {
        el.innerHTML = '';
    } else {
        el.innerHTML = `
            <span class="trend-legend-item" onclick="toggleTrendSeries(0, this)"><span class="trend-legend-dot" style="background:#3b82f6"></span>Amount</span>
            <span class="trend-legend-item" onclick="toggleTrendSeries(1, this)"><span class="trend-legend-dot" style="background:#16a34a"></span>GP</span>
        `;
    }
}

// Click-to-toggle a series, same as Chart.js's own built-in legend used to
// give for free before it got swapped out for the custom HTML one above.
function toggleTrendSeries(index, el) {
    if (!_chartMonthly) return;
    const wasVisible = _chartMonthly.isDatasetVisible(index);
    _chartMonthly.setDatasetVisibility(index, !wasVisible);
    _chartMonthly.update();
    el.classList.toggle('is-hidden', wasVisible);
}

function renderTrendAmtGP(monthMap) {
    const keys = trend12MonthKeys();
    const labels = trendLabels(keys);
    // Months that haven't happened yet get a null value (a real gap in the
    // line, not a misleading zero) but their label still shows on the axis.
    const now = new Date();
    const nowKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const amts = keys.map(m => m > nowKey ? null : (monthMap.get(m)?.amt ?? 0));
    const gps  = keys.map(m => m > nowKey ? null : (monthMap.get(m)?.gp ?? 0));

    const ctx = document.getElementById('monthlyChart').getContext('2d');
    if (_chartMonthly) _chartMonthly.destroy();
    _chartMonthly = new Chart(ctx, {
        type: 'line',
        data: {
            labels,
            datasets: [
                {
                    label: 'Amount',
                    data: amts,
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59,130,246,0.08)',
                    borderWidth: 2.5,
                    pointRadius: 4,
                    pointBackgroundColor: '#3b82f6',
                    tension: 0.35,
                    fill: true,
                    spanGaps: false,
                    yAxisID: 'y'
                },
                {
                    label: 'GP',
                    data: gps,
                    borderColor: '#16a34a',
                    backgroundColor: 'rgba(22,163,74,0.08)',
                    borderWidth: 2.5,
                    pointRadius: 4,
                    pointBackgroundColor: '#16a34a',
                    tension: 0.35,
                    fill: false,
                    spanGaps: false,
                    yAxisID: 'y'
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { intersect: false, mode: 'index' },
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: '#1e293b',
                    cornerRadius: 10,
                    padding: 12,
                    boxPadding: 4,
                    bodySpacing: 6,
                    bodyAlign: 'right',
                    displayColors: true,
                    titleColor: '#fff',
                    titleFont: { size: 13, weight: '700' },
                    bodyColor: '#e2e8f0',
                    bodyFont: { size: 12 },
                    callbacks: {
                        // Solid swatch colors — the datasets' own backgroundColor
                        // is a near-transparent area fill (for the chart itself),
                        // which would render as an invisible tooltip color box.
                        labelColor: c => ({
                            borderColor: c.datasetIndex === 0 ? '#3b82f6' : '#16a34a',
                            backgroundColor: c.datasetIndex === 0 ? '#3b82f6' : '#16a34a',
                            borderRadius: 3
                        }),
                        label: c => c.raw == null ? null : ` ${c.dataset.label}: ${Math.round(c.raw).toLocaleString('en-US')} ฿`,
                        // GP% as its own plain line under Amount/GP — kept
                        // separate from momGrowth's period-over-period % (which
                        // read as noisy/hard to parse and was dropped) so the
                        // tooltip is just the 3 numbers: Amount, GP, GP%.
                        afterBody: items => {
                            const i = items[0]?.dataIndex;
                            if (i == null) return [];
                            const pct = pctStr(gps[i], amts[i]);
                            return pct ? [` GP%: ${pct}`] : [];
                        }
                    }
                }
            },
            scales: {
                x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#94a3b8' } },
                y: {
                    grid: { color: '#f1f5f9' },
                    ticks: { font: { size: 10 }, color: '#94a3b8', callback: v => fmtK(v) },
                    beginAtZero: true
                }
            }
        }
    });
}

// Stacked bar: one bar per month, one colored segment per BU. Only stacks
// whichever BUs currently pass the BU chip filter (buPasses), same colors
// as the BU cards/chips (buColor) so the two views read as one system.
function renderTrendByBU(buMonthMap) {
    const keys = trend12MonthKeys();
    const labels = trendLabels(keys);
    const activeBUs = _cfgBU.filter(bu => buPasses(bu));

    const datasets = activeBUs.map(bu => ({
        label: bu,
        data: keys.map(m => buMonthMap.get(m)?.get(bu)?.amt || 0),
        backgroundColor: buColor(bu),
        borderRadius: 3,
        stack: 'trend'
    }));

    const ctx = document.getElementById('monthlyChart').getContext('2d');
    if (_chartMonthly) _chartMonthly.destroy();
    _chartMonthly = new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            // 'index' so hovering anywhere on a bar shows every BU stacked
            // into it at once, not just the single segment under the
            // cursor — that's what made the old tooltip look incomplete.
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: '#1e293b',
                    cornerRadius: 10,
                    padding: 12,
                    boxPadding: 4,
                    bodySpacing: 5,
                    bodyAlign: 'right',
                    titleColor: '#fff',
                    titleFont: { size: 13, weight: '700' },
                    bodyColor: '#e2e8f0',
                    bodyFont: { size: 12 },
                    footerColor: '#bdc432',
                    footerFont: { size: 12, weight: '700' },
                    footerMarginTop: 6,
                    itemSort: (a, b) => b.raw - a.raw, // biggest BU first, regardless of stack order
                    callbacks: {
                        label: c => c.raw === 0 ? null : ` ${c.dataset.label}: ${Math.round(c.raw).toLocaleString('en-US')} ฿`,
                        // The "All BUs" total the old single-segment tooltip
                        // was missing — per-BU Amount/GP/GP% breakdown lives in
                        // the Trend Detail table below instead of being crammed
                        // into the hover tooltip (up to 7 BUs × 3 lines each
                        // would be unreadable there).
                        footer: items => {
                            const total = items.reduce((s, it) => s + (it.raw || 0), 0);
                            return total ? `Total: ${Math.round(total).toLocaleString('en-US')} ฿` : '';
                        }
                    }
                }
            },
            scales: {
                x: { stacked: true, grid: { display: false }, ticks: { font: { size: 11 }, color: '#94a3b8' } },
                y: {
                    stacked: true,
                    grid: { color: '#f1f5f9' },
                    ticks: { font: { size: 10 }, color: '#94a3b8', callback: v => fmtK(v) },
                    beginAtZero: true
                }
            }
        }
    });
}

// Plain values table under the Amount/GP and By BU charts — same months
// (and future-month "—") as whichever chart is showing, just laid out so
// exact numbers are readable without hovering every point.
function renderTrendRawTable(kind, monthMap) {
    const keys = trend12MonthKeys();
    const now = new Date();
    const nowKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const labels = trendLabels(keys);

    // Fixed per-column widths (table-layout:fixed) instead of the browser's
    // auto layout stretching sparse "—" columns to fill 100% — that made
    // columns land at wildly uneven widths depending on which months had
    // real numbers. A predictable grid that overflows into its own
    // horizontal scrollbar (see wrapper below) reads far more organized
    // than a full-width table with awkward gaps.
    const MONTH_COL = 90;
    let thead, rows, colWidths;
    if (kind === 'bu') {
        const buMonthMap = monthMap;
        const activeBUs = _cfgBU.filter(bu => buPasses(bu));
        // Each BU gets its own Amount/GP/GP% trio, not just a bare amount —
        // a grouped 2-row header (BU name spanning 3, then the sub-labels)
        // makes clear which three columns belong to which BU.
        const AMT_COL = 120, GP_COL = 120, PCT_COL = 70;
        const groupWidth = AMT_COL + GP_COL + PCT_COL;
        colWidths = MONTH_COL + activeBUs.length * groupWidth;

        thead = `
            <tr>
                <th rowspan="2" style="width:${MONTH_COL}px">Month</th>
                ${activeBUs.map(bu => `<th colspan="3" class="c" style="border-left:2px solid #e2e8f0">${esc(bu)}</th>`).join('')}
            </tr>
            <tr>
                ${activeBUs.map(() => `
                    <th class="r" style="width:${AMT_COL}px;border-left:2px solid #e2e8f0">Amount</th>
                    <th class="r" style="width:${GP_COL}px">GP</th>
                    <th class="r" style="width:${PCT_COL}px">GP%</th>
                `).join('')}
            </tr>
        `;
        rows = keys.map((m, i) => {
            const future = m > nowKey;
            const cells = activeBUs.map(bu => {
                const rec = future ? null : buMonthMap.get(m)?.get(bu);
                const pct = rec && rec.amt ? pctStr(rec.gp, rec.amt) : null;
                return `
                    <td class="r" style="border-left:2px solid #f1f5f9">${rec?.amt ? fmtN(rec.amt) + ' ฿' : '—'}</td>
                    <td class="r amt-green">${rec?.gp ? fmtN(rec.gp) + ' ฿' : '—'}</td>
                    <td class="r">${pct || '—'}</td>
                `;
            }).join('');
            return `<tr><td class="strong">${esc(labels[i])}</td>${cells}</tr>`;
        }).join('');
    } else {
        const VAL_COL = 170, PCT_COL = 90;
        colWidths = MONTH_COL + VAL_COL * 2 + PCT_COL;
        thead = `<tr>
            <th style="width:${MONTH_COL}px">Month</th>
            <th class="r" style="width:${VAL_COL}px">Amount</th>
            <th class="r" style="width:${VAL_COL}px">GP</th>
            <th class="r" style="width:${PCT_COL}px">GP%</th>
        </tr>`;
        rows = keys.map((m, i) => {
            const future = m > nowKey;
            const amt = future ? null : (monthMap.get(m)?.amt ?? 0);
            const gp  = future ? null : (monthMap.get(m)?.gp ?? 0);
            return `<tr>
                <td class="strong">${esc(labels[i])}</td>
                <td class="r">${amt == null ? '—' : fmtN(amt) + ' ฿'}</td>
                <td class="r amt-green">${gp == null ? '—' : fmtN(gp) + ' ฿'}</td>
                <td class="r">${amt == null || gp == null ? '—' : (pctStr(gp, amt) || '—')}</td>
            </tr>`;
        }).join('');
    }

    document.getElementById('trendTableWrap').innerHTML = `
        <div style="overflow-x:auto">
            <table class="dash-tbl" style="width:${colWidths}px;table-layout:fixed">
                <thead>${thead}</thead>
                <tbody>${rows}</tbody>
            </table>
        </div>
    `;
}

// ── Sales by Business Unit: donut + legend, self-contained in one card ────────
// Only the BUs configured in b_opportunity_config get a slice, matching the
// "no fake Other bucket" fix already applied to the BU cards above.
function renderBUDonut({ buMap }) {
    const entries = [...buMap.entries()]
        .filter(([bu]) => _cfgBU.includes(bu))
        .sort((a, b) => b[1].origAmt - a[1].origAmt);
    const labels = entries.map(([bu]) => bu);
    const amts   = entries.map(([, d]) => d.origAmt);
    const colors = labels.map(bu => buColor(bu));
    const total  = amts.reduce((s, a) => s + a, 0);

    const ctx = document.getElementById('buChart').getContext('2d');
    if (_chartBU) _chartBU.destroy();
    _chartBU = new Chart(ctx, {
        type: 'doughnut',
        data: { labels, datasets: [{ data: amts, backgroundColor: colors, borderWidth: 2, borderColor: '#fff', hoverBorderWidth: 3 }] },
        options: {
            responsive: false,
            cutout: '68%',
            plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: c => ` ${c.label}: ${fmtN(c.raw)} ฿ (${pctStr(c.raw, total) || '0%'})` } }
            },
            animation: { duration: 500 }
        }
    });

    document.getElementById('buChartLegend').innerHTML = entries.map(([bu, d]) => `
        <div class="leg-row">
            <div class="leg-dot" style="background:${buColor(bu)}"></div>
            <span class="leg-name">${esc(bu)}</span>
            <span class="leg-pct">${total ? pctStr(d.origAmt, total) : ''}</span>
        </div>
    `).join('') || '<div class="dash-empty">No data</div>';
}

// ── Business Type: donut + detail list ───────────────────────────────────────
function renderTypeDonut({ typeMap }) {
    const entries = [...typeMap.entries()].sort((a, b) => b[1].amt - a[1].amt);
    const labels  = entries.map(([t]) => t);
    const amts    = entries.map(([,d]) => d.amt);
    const colors  = labels.map(t => TYPE_CLR[t] || '#94a3b8');
    const total   = amts.reduce((s,a) => s+a, 0);

    const ctx = document.getElementById('typeChart').getContext('2d');
    if (_chartType) _chartType.destroy();
    _chartType = new Chart(ctx, {
        type: 'doughnut',
        data: { labels, datasets: [{ data: amts, backgroundColor: colors, borderWidth: 2, borderColor: '#fff', hoverBorderWidth: 3 }] },
        options: {
            responsive: false,
            cutout: '68%',
            plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: c => ` ${c.label}: ${fmtN(c.raw)} ฿ (${pctStr(c.raw, total) || '0%'})` } }
            },
            animation: { duration: 500 }
        }
    });

    // Table instead of a plain dot/name/%-only legend — folds in Amount,
    // GP, GP% and Opportunity count per type so the standalone "GP by
    // Business Type" cards section isn't needed anymore.
    document.getElementById('typeLegend').innerHTML = entries.length ? `
        <table class="dash-tbl">
            <thead><tr><th>Type</th><th class="r">Amount</th><th class="r">GP</th><th class="r">GP%</th><th class="r">Opportunity</th></tr></thead>
            <tbody>
                ${entries.map(([t, d]) => `<tr>
                    <td class="strong"><span class="leg-dot" style="background:${TYPE_CLR[t]||'#94a3b8'};display:inline-block;vertical-align:middle;margin-right:6px"></span>${esc(t)}</td>
                    <td class="r">${fmtN(d.amt)} ฿</td>
                    <td class="r amt-green">${fmtN(d.gp)} ฿</td>
                    <td class="r">${pctStr(d.gp, d.amt) || '—'}</td>
                    <td class="r">${d.count}</td>
                </tr>`).join('')}
            </tbody>
        </table>
    ` : '<div class="dash-empty">No data</div>';
}

// ── Churn Analysis ────────────────────────────────────────────────────────────
function renderChurnSection({ churnRows, grandChurnAmt, grandOrigAmt, grandChurnGP, grandOrigGP }) {
    const rate   = pctStr(grandChurnAmt, grandOrigAmt + grandChurnAmt);
    const gpRate = pctStr(grandChurnGP, grandOrigGP + grandChurnGP);
    document.getElementById('churnKpiRow').innerHTML = `
        <div class="churn-kpi-card">
            <div class="churn-kpi-label">Churned Deals</div>
            <div class="churn-kpi-val">${churnRows.length}</div>
        </div>
        <div class="churn-kpi-card">
            <div class="churn-kpi-label">Churned Revenue</div>
            <div class="churn-kpi-val">${fmtN(grandChurnAmt)} ฿</div>
        </div>
        <div class="churn-kpi-card">
            <div class="churn-kpi-label">Churned GP</div>
            <div class="churn-kpi-val">${fmtN(grandChurnGP)} ฿</div>
            <div class="churn-kpi-sub">${gpRate || '0%'} of total GP</div>
        </div>
        <div class="churn-kpi-card">
            <div class="churn-kpi-label">Churn Rate</div>
            <div class="churn-kpi-val">${rate || '0%'}</div>
        </div>
    `;

    document.getElementById('churnCount').textContent = churnRows.length + ' รายการ';
    if (!churnRows.length) {
        document.getElementById('churnTableWrap').innerHTML = '<div class="dash-empty">No churned deals in this range</div>';
        return;
    }

    const sorted = [...churnRows].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    document.getElementById('churnTableWrap').innerHTML = `
        <table class="dash-tbl">
            <thead><tr><th>Account</th><th>Opportunity</th><th>BU</th><th class="r">Amount</th><th>Owner</th><th>Date</th></tr></thead>
            <tbody>
                ${sorted.map(r => `<tr>
                    <td class="strong">${esc(r.account)}</td>
                    <td>${esc(r.opportunity)}</td>
                    <td><span class="bu-mini-badge">${esc(r.bu || '—')}</span></td>
                    <td class="r amt-red">${fmtN(r.amt)} ฿</td>
                    <td>${esc(r.owner)}</td>
                    <td>${esc(r.date) || '—'}</td>
                </tr>`).join('')}
            </tbody>
        </table>
    `;
}

// ── Lead Source ───────────────────────────────────────────────────────────────
function renderLeadSource({ leadMap }) {
    const rows = [...leadMap.entries()].sort((a, b) => b[1].amt - a[1].amt);
    if (!rows.length) {
        document.getElementById('leadTableWrap').innerHTML = '<div class="dash-empty">No data</div>';
        if (_chartLead) { _chartLead.destroy(); _chartLead = null; }
        return;
    }

    const labels = rows.map(([s]) => s);
    const amts   = rows.map(([,d]) => d.amt);
    const total  = amts.reduce((s,a) => s+a, 0);

    const ctx = document.getElementById('leadChart').getContext('2d');
    if (_chartLead) _chartLead.destroy();
    _chartLead = new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets: [{ data: amts, backgroundColor: '#6d9eeb', borderRadius: 4, maxBarThickness: 22 }] },
        options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: c => ` ${fmtN(c.raw)} ฿` } }
            },
            scales: {
                x: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 }, color: '#94a3b8', callback: v => fmtK(v) }, beginAtZero: true },
                y: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#475569' } }
            }
        }
    });

    document.getElementById('leadTableWrap').innerHTML = `
        <table class="dash-tbl">
            <thead><tr><th>Source</th><th class="r">Amount</th><th class="r">Deals</th><th class="r">Share</th></tr></thead>
            <tbody>
                ${rows.map(([s, d]) => {
                    const pct = total ? Math.round(d.amt / total * 100) : 0;
                    return `<tr>
                        <td class="strong">${esc(s)}</td>
                        <td class="r">${fmtN(d.amt)} ฿</td>
                        <td class="r">${d.count}</td>
                        <td class="r"><div class="cell-bar-row"><div class="cell-bar-track"><div class="cell-bar-fill" style="width:${pct}%"></div></div><span class="cell-bar-pct">${pct}%</span></div></td>
                    </tr>`;
                }).join('')}
            </tbody>
        </table>
    `;
}

// ── Sales Rep Performance ─────────────────────────────────────────────────────
function rankBadge(i) {
    if (i === 0) return '<span class="rank-badge r1">1</span>';
    if (i === 1) return '<span class="rank-badge r2">2</span>';
    if (i === 2) return '<span class="rank-badge r3">3</span>';
    return `<span class="rank-plain">${i+1}</span>`;
}

function renderRepTable({ ownerMap }) {
    const rows = [...ownerMap.entries()].sort((a, b) => b[1].amt - a[1].amt);
    if (!rows.length) { document.getElementById('repTableWrap').innerHTML = '<div class="dash-empty">No data</div>'; return; }
    const maxAmt = Math.max(...rows.map(r => r[1].amt), 1);

    document.getElementById('repTableWrap').innerHTML = `
        <table class="dash-tbl">
            <thead><tr><th class="c">#</th><th>Rep</th><th class="r">Deals</th><th class="r">Amount</th><th class="r">GP</th><th class="r">Margin</th><th class="r">Share</th></tr></thead>
            <tbody>
                ${rows.map(([owner, d], i) => {
                    const margin = pctStr(d.gp, d.amt);
                    const pct = Math.round(d.amt / maxAmt * 100);
                    return `<tr>
                        <td class="c">${rankBadge(i)}</td>
                        <td class="strong">${esc(owner)}</td>
                        <td class="r">${d.count}</td>
                        <td class="r strong">${fmtN(d.amt)} ฿</td>
                        <td class="r amt-green">${fmtN(d.gp)} ฿</td>
                        <td class="r">${margin || '—'}</td>
                        <td class="r"><div class="cell-bar-row"><div class="cell-bar-track"><div class="cell-bar-fill" style="width:${pct}%"></div></div><span class="cell-bar-pct">${pct}%</span></div></td>
                    </tr>`;
                }).join('')}
            </tbody>
        </table>
    `;
}

// ── Top Clients ───────────────────────────────────────────────────────────────
function renderClientTable({ accountMap }) {
    const rows = [...accountMap.entries()].sort((a, b) => b[1].amt - a[1].amt).slice(0, 10);
    if (!rows.length) { document.getElementById('clientTableWrap').innerHTML = '<div class="dash-empty">No data</div>'; return; }

    document.getElementById('clientTableWrap').innerHTML = `
        <table class="dash-tbl">
            <thead><tr><th class="c">#</th><th>Client</th><th class="r">Deals</th><th class="r">Amount</th><th class="r">GP</th><th class="r">Margin</th></tr></thead>
            <tbody>
                ${rows.map(([, d], i) => {
                    const margin = pctStr(d.gp, d.amt);
                    return `<tr>
                        <td class="c">${rankBadge(i)}</td>
                        <td class="strong">${esc(d.name)}</td>
                        <td class="r">${d.count}</td>
                        <td class="r strong">${fmtN(d.amt)} ฿</td>
                        <td class="r amt-green">${fmtN(d.gp)} ฿</td>
                        <td class="r">${margin || '—'}</td>
                    </tr>`;
                }).join('')}
            </tbody>
        </table>
    `;
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function initPage() {
    sessionStorage.removeItem('bx_perms_baccount');
    await initLayout(B_ACCOUNT_CONFIG);
    initFilterDropdowns();
    await loadData();
    createPullToRefresh({
        container: document.getElementById('dashContainer'),
        track: document.querySelector('.dash-wrap'),
        onRefresh: loadData
    });
}
initPage();
</script>
