<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>B-ACCOUNT | Setting</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/system/config.js"></script>
    <script src="/system/system.js"></script>
    <script src="/system/save-bar.js"></script>
    <script src="b-account.js"></script>
    <link rel="stylesheet" href="/system/theme.css">
    <link rel="stylesheet" href="b-account.css">
    <style>
        /* Cross-document View Transitions — clicking the Setting/Member tab
           (a real <a href> navigation between two separate pages, not a JS
           tab switch) crossfades the old/new page instead of a hard flash.
           Needs the same declaration on both pages of the pair to engage;
           no-ops silently in browsers that don't support it yet. */
        @view-transition {
            navigation: auto;
        }

        .settings-wrapper { max-width: 1300px; margin: 0 auto; padding: 36px 20px 140px; }
        .page-header { margin-bottom: 28px; }
        .page-header h1 { font-size: 1.4rem; font-weight: 800; color: var(--c-dark); margin: 0; }

        .settings-tabnav { display: flex; gap: 8px; margin-bottom: 20px; }
        .settings-tab { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 12px; font-size: 0.82rem; font-weight: 700; color: var(--c-slate); text-decoration: none; border: 1px solid var(--c-border); background: #fff; transition: 0.15s; }
        .settings-tab:hover { border-color: var(--c-accent); color: var(--c-dark); }
        .settings-tab.active { background: var(--c-dark); color: var(--c-accent); border-color: var(--c-dark); }

        /* ── Section ── */
        .section { background: #fff; border: 1px solid var(--c-border); border-radius: 20px; margin-bottom: 20px; overflow: hidden; }
        .section-header { display: flex; align-items: center; gap: 12px; padding: 18px 24px; border-bottom: 1px solid var(--c-border); }
        .section-title { font-size: 0.82rem; font-weight: 800; color: var(--c-dark); text-transform: uppercase; letter-spacing: 0.8px; display: flex; align-items: center; gap: 8px; }
        .section-title i { font-size: 1rem; }
        .section-body { padding: 20px 24px; }

        /* ── Config boxes (Dropdown) — horizontal-scroll carousel, exact
           pattern from B-Quest's Role/Status/Type section: fixed-width
           .section boxes in a row instead of a squeezed 2-col grid, with
           edge-fade hints when there's more to scroll to. ── */
        .cfg-carousel-wrap { position: relative; margin-bottom: 20px; }
        .cfg-carousel-wrap::before, .cfg-carousel-wrap::after {
            content: ''; position: absolute; top: 0; bottom: 6px; width: 48px;
            pointer-events: none; z-index: 2; opacity: 0; transition: opacity 0.2s;
        }
        .cfg-carousel-wrap::before { left: 0; background: linear-gradient(to right, rgba(30,41,59,0.14), transparent); }
        .cfg-carousel-wrap::after { right: 0; background: linear-gradient(to left, rgba(30,41,59,0.14), transparent); }
        .cfg-carousel-wrap.fade-left::before { opacity: 1; }
        .cfg-carousel-wrap.fade-right::after { opacity: 1; }
        .cfg-carousel-grid { display: flex; gap: 20px; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 6px; }
        .cfg-carousel-grid .section { margin-bottom: 0; flex: 0 0 380px; scroll-snap-align: start; }
        @media (max-width: 600px) { .cfg-carousel-grid .section { flex-basis: 90vw; } }

        .cfg-count-badge { font-size: 0.66rem; font-weight: 700; color: var(--c-slate); background: var(--c-bg); border: 1px solid var(--c-border); border-radius: 20px; padding: 1px 8px; }
        .dirty-dot { width: 7px; height: 7px; background: #f59e0b; border-radius: 50%; display: none; }
        .section.is-dirty .dirty-dot { display: inline-block; }
        .section.is-dirty { border-color: #fde68a; }
        .cfg-header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }

        /* list rows */
        .cfg-list { padding: 6px 0; min-height: 40px; }
        .cfg-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px; border-bottom: 1px solid #f1f5f9; border-radius: 8px; transition: background 0.12s; }
        .cfg-row:last-child { border-bottom: none; }
        .cfg-row:hover { background: var(--c-bg); }
        .cfg-row.is-new { background: #f0fdf4; }
        .cfg-row.is-new .cfg-row-val { color: #166534; }
        .cfg-row.is-del { background: #fff5f5; opacity: 0.6; }
        .cfg-row.is-del .cfg-row-val { text-decoration: line-through; color: #b91c1c; }
        .cfg-row-val { font-size: 0.83rem; font-weight: 700; color: var(--c-dark); }
        .cfg-row-del { background: none; border: none; padding: 3px 5px; cursor: pointer; color: #cbd5e1; border-radius: 6px; display: flex; align-items: center; font-size: 0.9rem; transition: 0.15s; }
        .cfg-row-del:hover { background: #fee2e2; color: #ef4444; }
        .cfg-row.is-del .cfg-row-del { color: #86efac; }
        .cfg-row.is-del .cfg-row-del:hover { background: #f0fdf4; color: #16a34a; }
        .cfg-empty { padding: 16px 18px; font-size: 0.78rem; color: #cbd5e1; font-weight: 600; }
        .cfg-list--grid { display: grid; grid-template-columns: 1fr 1fr; }
        .cfg-name-input { flex: 1; border: 1px solid var(--c-accent); border-radius: 8px; padding: 6px 10px; font-size: 0.83rem; font-weight: 700; color: var(--c-dark); background: #fff; outline: none; font-family: inherit; }

        .btn-cfg-add { background: var(--c-dark); color: var(--c-accent); border: none; border-radius: 10px; padding: 7px 14px; font-size: 0.76rem; font-weight: 700; cursor: pointer; transition: 0.15s; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
        .btn-cfg-add:hover { background: #0f172a; }
    </style>
</head>
<body>

<div class="settings-wrapper">
    <div class="page-header">
        <h1><i class="bi bi-gear-fill me-2" style="color:var(--c-accent)"></i>B-ACCOUNT Setting</h1>
    </div>

    <div class="settings-tabnav">
        <a href="b-account-settings.html" class="settings-tab active"><i class="bi bi-gear-fill"></i> Setting</a>
        <a href="b-account-members.html" class="settings-tab"><i class="bi bi-people-fill"></i> Member</a>
    </div>

    <!-- Dropdown Config — 5 separate boxes, side by side (ref B-Quest's Role/Status/Type carousel) -->
    <div class="cfg-carousel-wrap" id="cfgCarouselWrap">
        <div class="cfg-carousel-grid" id="cfgGrid"></div>
    </div>
</div>

<script>

    // ── Config State ──────────────────────────────────────────────
    const CFG_TYPES = [
        { key: 'status',        label: 'Status',             icon: 'bi-circle-fill' },
        { key: 'business_type', label: 'Business Type',      icon: 'bi-briefcase-fill' },
        { key: 'company',       label: 'Company QT',         icon: 'bi-building-fill' },
        { key: 'bu',            label: 'Business Unit (BU)', icon: 'bi-grid-fill' },
        { key: 'lead_source',   label: 'Lead Source',        icon: 'bi-funnel-fill', full: true },
    ];

    const _cfg = {};  // _cfg[key] = { original: [], toAdd: [], toDelete: Set }

    function cfgIsDirty(key) {
        return _cfg[key].toAdd.length > 0 || _cfg[key].toDelete.size > 0;
    }

    function cfgCount(key) {
        const state = _cfg[key];
        return state.original.filter(v => !state.toDelete.has(v)).length + state.toAdd.length;
    }

    function renderCfgCard(type, values) {
        _cfg[type.key] = { original: [...values], toAdd: [], toDelete: new Set() };
        const listClass = type.full ? 'cfg-list cfg-list--grid' : 'cfg-list';
        return `<div class="section" id="cfgCard-${type.key}">
            <div class="section-header">
                <div class="section-title"><i class="bi ${type.icon}"></i> ${type.label} <span class="cfg-count-badge" id="cfgCount-${type.key}"></span> <span class="dirty-dot"></span></div>
                <div class="cfg-header-actions">
                    <button class="btn-cfg-add" onclick="addCfgTag('${type.key}')"><i class="bi bi-plus-lg"></i> Add</button>
                </div>
            </div>
            <div class="section-body">
                <div class="${listClass}" id="cfgTags-${type.key}"></div>
            </div>
        </div>`;
    }

    function refreshCfgTags(key) {
        const container = document.getElementById(`cfgTags-${key}`);
        const state = _cfg[key];
        const rows = [
            ...state.original.filter(v => !state.toDelete.has(v)).map(v =>
                `<div class="cfg-row">
                    <span class="cfg-row-val">${esc(v)}</span>
                    <button class="cfg-row-del" onclick="removeCfgTag('${key}','${esc(v)}')" title="Remove"><i class="bi bi-trash3"></i></button>
                </div>`
            ),
            ...state.toAdd.map(v =>
                `<div class="cfg-row is-new">
                    <span class="cfg-row-val">${esc(v)}</span>
                    <button class="cfg-row-del" onclick="undoAddCfgTag('${key}','${esc(v)}')" title="Undo"><i class="bi bi-arrow-counterclockwise"></i></button>
                </div>`
            ),
            ...([...state.toDelete].map(v =>
                `<div class="cfg-row is-del">
                    <span class="cfg-row-val">${esc(v)}</span>
                    <button class="cfg-row-del" onclick="undoDeleteCfgTag('${key}','${esc(v)}')" title="Undo"><i class="bi bi-arrow-counterclockwise"></i></button>
                </div>`
            )),
            ...(state.drafting ? [`<div class="cfg-row is-new">
                <input type="text" class="cfg-name-input" id="cfgDraft-${key}" placeholder="New value..." onkeydown="if(event.key==='Enter')this.blur()" onblur="commitCfgDraft('${key}', this.value)">
            </div>`] : [])
        ].join('');
        container.innerHTML = rows || '<div class="cfg-empty">No values</div>';
        document.getElementById(`cfgCount-${key}`).textContent = cfgCount(key);
        document.getElementById(`cfgCard-${key}`).classList.toggle('is-dirty', cfgIsDirty(key));
        if (state.drafting) document.getElementById(`cfgDraft-${key}`)?.focus();
        recomputeSaveBarCount();
    }

    function addCfgTag(key) {
        _cfg[key].drafting = true;
        refreshCfgTags(key);
    }

    function commitCfgDraft(key, rawVal) {
        const state = _cfg[key];
        state.drafting = false;
        const val = rawVal.trim();
        if (val) {
            const exists = [...state.original, ...state.toAdd].some(v => v.toLowerCase() === val.toLowerCase());
            if (!exists) state.toAdd.push(val);
        }
        refreshCfgTags(key);
    }

    function removeCfgTag(key, val) {
        _cfg[key].toDelete.add(val);
        refreshCfgTags(key);
    }

    function undoAddCfgTag(key, val) {
        _cfg[key].toAdd = _cfg[key].toAdd.filter(v => v !== val);
        refreshCfgTags(key);
    }

    function undoDeleteCfgTag(key, val) {
        _cfg[key].toDelete.delete(val);
        refreshCfgTags(key);
    }

    function cfgOps(key) {
        const state = _cfg[key];
        const toDelete = [...state.toDelete];
        const toInsert = state.toAdd.map(v => ({ type: key, value: v }));
        const ops = [];
        if (toDelete.length) ops.push(supabaseClient.from('b_opportunity_config').delete().eq('type', key).in('value', toDelete));
        if (toInsert.length) ops.push(supabaseClient.from('b_opportunity_config').insert(toInsert));
        return ops;
    }

    function commitCfgState(key) {
        const state = _cfg[key];
        state.original = [...state.original.filter(v => !state.toDelete.has(v)), ...state.toAdd];
        state.toDelete.clear();
        state.toAdd = [];
        refreshCfgTags(key);
    }

    async function loadConfig() {
        const { data } = await supabaseClient.from('b_opportunity_config').select('type, value').order('value');
        const grouped = {};
        CFG_TYPES.forEach(t => { grouped[t.key] = []; });
        (data || []).forEach(row => { if (grouped[row.type]) grouped[row.type].push(row.value); });

        const grid = document.getElementById('cfgGrid');
        grid.innerHTML = CFG_TYPES.map(t => renderCfgCard(t, grouped[t.key])).join('');
        CFG_TYPES.forEach(t => refreshCfgTags(t.key));
        setupCarouselFade('cfgGrid', 'cfgCarouselWrap');
    }

    // Generic left/right scroll-fade hint — ref B-Quest's own settings carousel.
    function setupCarouselFade(scrollerId, wrapId) {
        const scroller = document.getElementById(scrollerId);
        const wrap = document.getElementById(wrapId);
        if (!scroller || !wrap) return;
        const update = () => {
            wrap.classList.toggle('fade-left', scroller.scrollLeft > 2);
            wrap.classList.toggle('fade-right', scroller.scrollLeft + scroller.clientWidth < scroller.scrollWidth - 2);
        };
        scroller.addEventListener('scroll', update);
        update();
        setTimeout(update, 300);
    }

    let saveBar = null;

    function recomputeSaveBarCount() {
        if (!saveBar) return;
        let total = 0;
        CFG_TYPES.forEach(t => { const s = _cfg[t.key]; total += s.toAdd.length + s.toDelete.size; });
        saveBar.setCount(total);
    }

    // onSave for the shared save bar — button disable/spinner is handled
    // by the module itself, this just does the writes + local commit.
    async function saveAll() {
        const dirtyKeys = CFG_TYPES.map(t => t.key).filter(cfgIsDirty);
        const ops = dirtyKeys.flatMap(cfgOps);

        const results = await Promise.all(ops);

        const hasError = results.some(r => r.error);
        if (hasError) { notify('', 'Save failed', 'error'); return; }

        dirtyKeys.forEach(commitCfgState);
        saveBar.clear();
        notify('success', 'Settings saved');
    }

    // Cancel button on the shared save bar — discard every staged edit
    // without touching the server.
    async function cancelAllChanges() {
        CFG_TYPES.forEach(t => {
            const state = _cfg[t.key];
            state.toAdd = [];
            state.toDelete = new Set();
            state.drafting = false;
            refreshCfgTags(t.key);
        });
        recomputeSaveBarCount();
    }

    async function initPage() {
        sessionStorage.removeItem('bx_perms_baccount');
        await initLayout(B_ACCOUNT_CONFIG);
        if (!canBaccount('setting')) window.location.replace('b-opportunity-list.html');
        saveBar = createSaveBar({ label: 'B-Account Settings', onSave: saveAll, onCancel: cancelAllChanges });
        await loadConfig();
    }

    initPage();
</script>
</body>
</html>
