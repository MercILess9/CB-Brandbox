<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>B-STROM | Brandstrom X Portal</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/system/config.js"></script>
    <script src="/system/system.js"></script>
    <link rel="stylesheet" href="/system/theme.css">

    <style>
        :root {
            --brand-dark: #111111;
            --border-color: #eeeeee;
            --font-main: 'Outfit', sans-serif;
        }

        body { 
            opacity: 0; 
            transition: opacity 0.5s ease-in-out; 
            background-color: #ffffff;
            color: var(--brand-dark);
            margin: 0;
            font-family: var(--font-main);
            display: flex;
            align-items: center;
            min-height: 100vh;
        }
        body.auth-ready { opacity: 1; }

        .container-portal {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px;
            width: 100%;
        }

        /* --- Header Layout (Logo ใหญ่ขึ้น) --- */
        .portal-header {
            display: flex;
            align-items: center;
            gap: 60px;
            margin-bottom: 80px;
        }

        .logo-box {
            flex: 0 0 400px;
            border-right: 1.5px solid var(--border-color);
            padding-right: 60px;
        }

        .logo-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        .hero-content {
            flex: 1;
        }

        .top-label {
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: var(--c-accent);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .hero-content h1 {
            font-size: 2.8rem; /* ขยายขนาดหัวข้อตามโลโก้ */
            font-weight: 800;
            line-height: 1;
            margin: 0 0 20px 0;
            letter-spacing: -1.5px;
        }

        .hero-content p {
            font-size: 1.1rem;
            color: #666;
            margin: 0;
            max-width: 600px;
            line-height: 1.6;
        }

        /* --- Project Grid --- */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .app-card {
            position: relative;
            height: 160px;
            border: 2.5px solid var(--c-accent); 
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none !important;
            color: var(--brand-dark);
            background: transparent;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            overflow: hidden;
            z-index: 1;
        }

        .app-card::before {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 0;
            background: var(--c-accent);
            transition: height 0.4s ease;
            z-index: -1;
        }

        .app-card:hover {
            transform: translateY(-10px);
            color: #000;
            box-shadow: 0 20px 40px rgba(var(--c-accent-rgb), 0.25);
        }

        .app-card:hover::before {
            height: 100%;
        }

        .app-card i {
            font-size: 2.8rem;
            margin-bottom: 12px;
            transition: 0.3s;
        }

        .app-card span {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* --- 🚩 Disabled State (ตอบสนองเมื่อชี้) --- */
        .app-card.disabled {
            border: 1px dashed #cccccc;
            color: #bbbbbb;
            cursor: not-allowed; /* เปลี่ยนหัวลูกศรเมาส์ */
            background: #fafafa;
        }

        .app-card.disabled:hover {
            transform: translateY(-5px); /* ยกขึ้นนิดหน่อยพอให้รู้ว่าชี้อยู่ */
            border-color: #999999;
            color: #888888;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            animation: shake 0.4s ease-in-out; /* เอฟเฟกต์สั่น */
        }

        .app-card.disabled::before { display: none; }

        @keyframes shake {
            0%, 100% { transform: translateY(-5px) rotate(0deg); }
            25% { transform: translateY(-5px) rotate(-1deg); }
            75% { transform: translateY(-5px) rotate(1deg); }
        }
        
        .status-tag {
            font-size: 0.7rem;
            margin-top: 8px;
            font-weight: 700;
            opacity: 0.6;
            letter-spacing: 1.5px;
        }

        /* Top-right actions */
        .portal-actions {
            position: fixed; top: 20px; right: 24px;
            display: flex; align-items: center; gap: 8px;
            z-index: 100;
        }
        .portal-btn {
            width: 38px; height: 38px;
            border: none; border-radius: 10px;
            background: transparent; color: #6b7280;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.05rem; cursor: pointer; text-decoration: none;
            transition: 0.2s;
        }
        .portal-btn:hover { color: var(--brand-dark); background: #f5f5f5; }

        .portal-noti-dot {
            position: absolute;
            top: 5px; right: 6px;
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #e74c3c;
            border: 1.5px solid #fff;
            display: none;
        }
        .portal-noti-dot.show { display: block; }

        .portal-avatar-wrap { position: relative; }
        .portal-avatar-btn {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: var(--c-accent);
            color: #fff;
            border: none;
            padding: 0;
            overflow: hidden;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: box-shadow 0.15s;
        }
        .portal-avatar-btn:hover { box-shadow: 0 0 0 4px var(--c-accent-light), 0 4px 14px rgba(var(--c-accent-rgb, 189, 196, 50), 0.35); }

        /* Set by initIndex() below — same fallback-initials convention as
           system/profile-modal.js's own avatar preview / system.js's
           renderSystemUI(), sized down for these two smaller circles. */
        .portal-avatar-btn .portal-avatar-initials { font-size: 0.76rem; font-weight: 800; }
        .portal-avatar-lg .portal-avatar-initials { font-size: 1.15rem; font-weight: 800; }

        .portal-profile-menu {
            display: none;
            position: absolute;
            top: 46px; right: 0;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.14);
            width: 250px;
            padding: 20px 16px 14px;
            z-index: 1001;
            font-family: 'Outfit', sans-serif;
        }
        .portal-profile-menu.open { display: block; }

        .portal-profile-card {
            display: flex; flex-direction: column; align-items: center; text-align: center;
            padding-bottom: 14px;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 12px;
        }
        .portal-avatar-lg {
            width: 56px; height: 56px;
            border-radius: 50%;
            background: var(--c-accent);
            color: #fff;
            overflow: hidden;
            font-size: 1.6rem;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 10px;
        }
        .portal-profile-name { font-size: 0.95rem; font-weight: 800; color: #222; word-break: break-word; }
        .portal-profile-fullname { font-size: 0.76rem; font-weight: 600; color: #888; margin-top: 2px; word-break: break-word; }
        .portal-profile-email {
            font-size: 0.74rem; font-weight: 600;
            color: var(--c-accent) !important;
            text-decoration: none !important;
            margin-top: 4px; word-break: break-word;
        }
        .portal-profile-email:hover { text-decoration: underline !important; }

        .portal-profile-badges {
            display: flex; justify-content: center; gap: 6px; flex-wrap: wrap;
            padding-bottom: 14px;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 12px;
        }
        .portal-profile-badge {
            font-size: 0.68rem; font-weight: 700; color: #666;
            background: #f5f5f5;
            border-radius: 20px;
            padding: 4px 12px;
        }
        .portal-profile-badge:empty { display: none; }

        .portal-profile-actions { display: flex; gap: 8px; }
        .portal-profile-action, .portal-btn-logout {
            flex: 1;
            background: #f5f5f5;
            border: none;
            font-size: 0.76rem; font-weight: 700;
            cursor: pointer;
            padding: 9px 8px;
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: background 0.15s;
        }
        .portal-profile-action { color: #444; }
        .portal-profile-action:hover { background: #ebebeb; }
        .portal-btn-logout { color: #e74c3c; background: #fff0ee; }
        .portal-btn-logout:hover { background: #ffe1dc; }

        /* Responsive */
        @media (max-width: 992px) {
            .app-grid { grid-template-columns: repeat(2, 1fr); }
            .portal-header { flex-direction: column; text-align: center; gap: 30px; }
            .logo-box { border-right: none; padding-right: 0; border-bottom: 1px solid #eee; padding-bottom: 30px; flex: 0 0 auto; width: 220px; }
        }
        @media (max-width: 576px) {
            .app-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Top-right actions -->
    <div class="portal-actions">
        <a id="btn-setting" href="/system/setting.html" class="portal-btn" title="System Settings" style="display:none;">
            <i class="bi bi-gear-fill"></i>
        </a>
        <button class="portal-btn" title="Notifications" style="position:relative;">
            <i class="bi bi-bell-fill"></i>
            <span class="portal-noti-dot" id="portal-noti-dot"></span>
        </button>
        <div class="portal-avatar-wrap">
            <button class="portal-avatar-btn" id="portal-avatar-btn" title="Account"><i class="bi bi-person-fill"></i></button>
            <div class="portal-profile-menu" id="portal-profile-menu">
                <div class="portal-profile-card">
                    <div class="portal-avatar-lg" id="portal-avatar-lg"><i class="bi bi-person-fill"></i></div>
                    <div class="portal-profile-name" id="portal-user-display"></div>
                    <div class="portal-profile-fullname" id="portal-user-fullname"></div>
                    <a class="portal-profile-email" id="portal-user-email" href="#"></a>
                </div>
                <div class="portal-profile-badges">
                    <span class="portal-profile-badge" id="portal-user-department"></span>
                </div>
                <div class="portal-profile-actions">
                    <button class="portal-profile-action" onclick="handleEditProfile()">
                        <i class="bi bi-pencil-fill"></i> Edit
                    </button>
                    <button class="portal-btn-logout" onclick="handleLogout()">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="container-portal">
        <header class="portal-header">
            <div class="logo-box">
                <img src="https://www.brandboxplatform.com/images/brandbox-logo.png" class="sys-logo-img" alt="Brandstrom X Logo">
            </div>
            <div class="hero-content">
                <div class="top-label">Brandstrom X Operations</div>
                <h1>YOUR BUSINESS CHALLENGE<br>IS OUR STARTING POINT.</h1>
                <p>We provide flexi solutions and end-to-end digital services to help your business thrive in the 2026 digital era.</p>
            </div>
        </header>

        <div class="app-grid" id="app-grid"></div>

    </div>

    <script>
        // system_project.label is now admin-editable DB data (Settings →
        // Projects), rendered via innerHTML below — needs escaping per
        // the platform's own security convention, unlike before when
        // every field on this page was a hardcoded literal.
        function esc(s) {
            return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        const PROJECTS = [
            { key: 'bquest',      label: 'B-QUEST',      icon: 'bi-rocket-takeoff-fill', href: 'b-quest/b-quest-list.html', live: true },
            { key: 'baccount',    label: 'B-ACCOUNT',    icon: 'bi-person-vcard-fill',   href: 'b-account/b-opportunity-list.html', live: true },
            { key: 'bcommission', label: 'B-COMMISSION', icon: 'bi-graph-up-arrow',      href: null, live: false },
            { key: 'bfinance',    label: 'B-FINANCE',    icon: 'bi-wallet2',             href: '/b-finance/b-finance-list.html', live: true },
        ];

        function renderGrid(access, sysProj = [], isGod = false) {
            const grid = document.getElementById('app-grid');
            // sysProj (system_project rows) carries the admin's 3-state
            // switch (active/disabled/hidden) AND display order.
            // access[p.key] is the per-user permission half — a project
            // failing that is left out of the grid entirely regardless of
            // status (no point showing a card for something this person
            // was never granted). Hidden works the same way for a regular
            // user — invisible, as if no system_project row existed — but
            // GOD never gets that: a hidden project still renders for GOD,
            // downgraded to the same grayed treatment as Disabled. And
            // unlike a regular user, GOD can still click through a grayed
            // card into a built project — the switch only ever changes
            // how it LOOKS to GOD, never whether GOD can get in.
            const projectStatus = {};
            const sortOrder = {};
            const projectLabel = {};
            const projectIcon = {};
            sysProj.forEach(row => {
                projectStatus[row.key] = row.status || 'active';
                sortOrder[row.key] = row.sort_order;
                if (row.label) projectLabel[row.key] = row.label;
                if (row.icon) projectIcon[row.key] = row.icon;
            });

            const visible = PROJECTS.filter(p => access[p.key] && (isGod || projectStatus[p.key] !== 'hidden'));
            visible.sort((a, b) => (sortOrder[a.key] ?? 999) - (sortOrder[b.key] ?? 999));

            if (!visible.length) {
                grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#aaa;padding:60px 0;font-size:0.9rem;font-weight:700;letter-spacing:1px;">No projects assigned yet.</div>`;
                return;
            }

            grid.innerHTML = visible.map(p => {
                const rawStatus = projectStatus[p.key] || 'active';
                const status = (rawStatus === 'hidden' && isGod) ? 'disabled' : rawStatus;
                const built = p.live && p.href;
                // Custom label/icon (set from Settings → Projects) override
                // this array's own hardcoded ones when present — key/href/
                // live stay fixed here regardless, since those tie to
                // actual routing/code, not just cosmetics.
                const icon = esc(projectIcon[p.key] || p.icon);
                const displayLabel = esc(projectLabel[p.key] || p.label);
                // A regular user only gets in when status is Active. GOD
                // can always click through to a built project regardless
                // of status — the admin switch still shows visually
                // (grayed via the same .disabled class when not Active)
                // but never actually locks GOD out, since GOD is the one
                // who'd need to get in to flip the switch back anyway.
                if (built && (status === 'active' || isGod)) {
                    const cls = status === 'active' ? 'app-card' : 'app-card disabled';
                    return `<a href="${p.href}" class="${cls}"><i class="bi ${icon}"></i><span>${displayLabel}</span><div class="status-tag">ENTER SYSTEM</div></a>`;
                }
                // Two different reasons a card ends up disabled: never
                // built yet (COMING SOON) vs built but switched off by an
                // admin (UNAVAILABLE) — same visual treatment, different
                // label so "why can't I click this" has an honest answer.
                const label = built ? 'UNAVAILABLE' : 'COMING SOON';
                return `<div class="app-card disabled" title="Currently Locked"><i class="bi ${icon}"></i><span>${displayLabel}</span><div class="status-tag">${label}</div></div>`;
            }).join('');
        }

        async function initIndex() {
            await initLayout({ projectName: "BRANDSTROM X" });
            const user = getBxUser();
            if (!user) return;

            document.getElementById('portal-user-display').innerText = user.codename || user.email || '-';
            document.getElementById('portal-user-fullname').innerText = user.full_name || '';
            const emailEl = document.getElementById('portal-user-email');
            emailEl.innerText = user.email || '';
            emailEl.href = user.email ? ('mailto:' + user.email) : '#';
            document.getElementById('portal-user-department').innerText = user.department || '';

            [document.getElementById('portal-avatar-btn'), document.getElementById('portal-avatar-lg')].forEach(el => {
                if (!el) return;
                el.innerHTML = '';
                if (user.avatar_url) {
                    const img = document.createElement('img');
                    img.src = user.avatar_url;
                    img.alt = '';
                    img.style.cssText = 'width:100%;height:100%;object-fit:cover;';
                    el.appendChild(img);
                } else {
                    const span = document.createElement('span');
                    span.className = 'portal-avatar-initials';
                    span.textContent = getInitials(user.nick_name || user.full_name);
                    el.appendChild(span);
                }
            });

            const avatarBtn = document.getElementById('portal-avatar-btn');
            const profileMenu = document.getElementById('portal-profile-menu');
            avatarBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                profileMenu.classList.toggle('open');
            });
            document.addEventListener('click', (e) => {
                if (!profileMenu.contains(e.target) && e.target !== avatarBtn) profileMenu.classList.remove('open');
            });

            if (user.level === 'god') {
                document.getElementById('btn-setting').style.display = 'flex';
                const allAccess = {};
                PROJECTS.forEach(p => allAccess[p.key] = true);
                // God sees every project unconditionally (all access true)
                // but still gets the disabled/grayed treatment for whichever
                // ones an admin switched off — same rendering rules as
                // everyone else, just with nothing filtered by permission,
                // and Hidden downgraded to Disabled instead of invisible
                // (isGod=true — see renderGrid's own comment).
                const { data: sysProj } = await supabaseClient.from('system_project').select('key, status, sort_order, label, icon');
                renderGrid(allAccess, sysProj || [], true);
                return;
            }

            // bquest/baccount/bfinance tiles are driven by real membership
            // now (does a row for this codename exist in that project's own
            // member table), not a separate per-person platform toggle —
            // see system/system.js's guardProjectAccess for the same
            // convention. system_access is still the source for
            // system_setting/system_holiday/system_member (gear icon
            // below) and bcommission (not yet live, no member table to
            // check).
            const [{ data: sp }, { data: qm }, { data: am }, { data: fm }, { data: sysProj }] = await Promise.all([
                supabaseClient.from('system_access').select('*').eq('codename', user.codename).maybeSingle(),
                supabaseClient.from('b_quest_member').select('codename').eq('codename', user.codename).maybeSingle(),
                supabaseClient.from('b_account_setting').select('codename').eq('codename', user.codename).maybeSingle(),
                supabaseClient.from('b_finance_setting').select('codename').eq('codename', user.codename).maybeSingle(),
                supabaseClient.from('system_project').select('key, status, sort_order, label, icon'),
            ]);
            const access = { ...(sp || {}), bquest: !!qm, baccount: !!am, bfinance: !!fm };

            // Any one of the 3 setting.html tabs (Setting/Holiday/Member)
            // is enough to show the gear icon — the page itself now
            // admits anyone with at least one, and shows only the tab(s)
            // they actually have (see system/setting.html's
            // applyTabAccessVisibility()), not just system_setting alone.
            if (access.system_setting || access.system_holiday || access.system_member) {
                document.getElementById('btn-setting').style.display = 'flex';
            }

            renderGrid(access, sysProj || [], false);
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            sessionStorage.clear();
            window.location.href = '/auth/login.html';
        }

        initIndex();
    </script>
</body>
</html>
